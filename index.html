      const bad = [pr, fr, gr, mr].find(r => !r.ok);
      if (bad) { FR.error = 'HTTP ' + bad.status; return false; }
      FR.profiles = await pr.json();
      FR.links = await fr.json();
      const rows = await gr.json();
      FR.progress = {};

      const fetched = (await mr.json()).reverse();

      // keep such strays rather than letting a slower full load erase them from a chat.
      const maxId = fetched.length ? fetched[fetched.length - 1].id : 0;

// The profile row is what makes a person findable. Name and picture come from Google.

// What a friend is allowed to see. Built fresh from the board, pushed only when it changed.

  return {

      const s = habitStats(hb);

    }),

async function requestFriend(userId) {

  if (!r.ok) return { ok: false, message: 'Could not send (HTTP ' + r.status + ').' };

function markConversationRead(userId) {

  if (!unread.length) return;

  for (const m of unread) m.read_at = now; // paint first; the server catches up
  updateFriendBadge();
  frReady().then(ok => {
    if (!ok) return;
    sbFetch('/rest/v1/dayu_messages?sender=eq.' + encodeURIComponent(userId) + '&recipient=eq.' + encodeURIComponent(myId()) + '&read_at=is.null', {

// A slow heartbeat keeps messages fresh; every third tick refetches everything, which
// also heals read receipts from other devices and friendships accepted elsewhere.
async function friendsPollTick() {
  if (!signedIn() || document.hidden) return;
  FR.ticks++;
  if (FR.missing) {
    // The owner may have run the SQL since; look again every few minutes instead of
    // staying dark until the next full page load.
    if (FR.ticks % 15 === 0) { FR.missing = false; if (await loadFriends()) repaintFriendsIfSafe(); }
    return;
  }
  if (!FR.ready) { if (await loadFriends()) repaintFriendsIfSafe(); return; }
  try {
    const r = await sbFetch('/rest/v1/dayu_messages?select=id,sender,recipient,body,created_at,read_at&id=gt.' + FR.lastMsgId + '&order=id.asc');
    if (r.ok) {
      const rows = await r.json();
      // Advance the cursor over everything the server returned, seen before or not.
      if (rows.length) FR.lastMsgId = Math.max(FR.lastMsgId, rows[rows.length - 1].id);
      const known = new Set(FR.msgs.map(m => m.id));
      const fresh = rows.filter(m => !known.has(m.id));
      if (fresh.length) {
        FR.msgs.push(...fresh);
        const incoming = fresh.filter(m => m.recipient === myId());
        if (FR.chatWith && FR.chatHook && incoming.some(m => m.sender === FR.chatWith)) {
          FR.chatHook();
          markConversationRead(FR.chatWith);
        }
        const elsewhere = incoming.filter(m => m.sender !== FR.chatWith);
        if (elsewhere.length) {
          const m = elsewhere[elsewhere.length - 1];
          toast(displayName(m.sender) + ': ' + (m.body.length > 60 ? m.body.slice(0, 58) + '…' : m.body), null, 4500);
        }
        updateFriendBadge();
        repaintFriendsIfSafe();
      }
    } else await frMissing(r);
  } catch (e) { /* offline; the next tick tries again */ }
  // Friends' progress only changes when the whole set is refetched. While the Goals page is
  // actually on screen that happens every tick, so a friend ticking a goal shows up within
  // the minute; elsewhere it drops to every third tick, since nobody is looking.
  const watching = currentPage() === 'goals';
  if (watching || FR.ticks % 3 === 0) {
    if (!FR.profilePushed) pushProfile(); // a failed first push must not hide this person forever
    if (await loadFriends()) repaintFriendsIfSafe();
  }
  // Someone else may be moving things around inside a shared cluster right now, so the
  // canvas keeps up with it on the same beat. The "not set up" verdict is re-tested every
  // few minutes: the database can answer "no such table" for a table that does exist while
  // it reloads its schema cache, and one unlucky reply should not switch sharing off for
  // the rest of the session.
  if (SH.missing) { if (FR.ticks % 15 === 0) { SH.missing = false; await syncShared(); } }
  else if (sharedZones().length || sharedRoutines().length || FR.ticks % 3 === 0) await syncShared();
}
function initFriends() {
  if (signedIn()) { pushProfile(); loadFriends().then(ok => { if (ok) repaintFriendsIfSafe(); }); }
  setInterval(friendsPollTick, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') friendsPollTick(); });
}

/* ---------- shared clusters ---------- */
// A shared cluster is one row everyone in it may edit. Its tasks are mirrored into this
// board as ordinary tasks, so the canvas, archive and goals need to know nothing about
// sharing; only this layer does. What is shared is the cluster's name, colour, size and
// tasks. Where it sits on the canvas is yours alone, so task positions travel relative to
// the cluster's own corner and land wherever you have put it.
const SH = { rows: {}, members: {}, seen: {}, pushed: {}, ready: false, missing: false, syncing: false };
function resetSharedCache() { SH.rows = {}; SH.members = {}; SH.seen = {}; SH.pushed = {}; SH.ready = false; }

function isSharedCat(catId) { return String(catId || '').indexOf('sc-') === 0; }
async function shMissing(r) {

  let sig = '';
  try { const j = await r.json(); sig = String((j && (j.code || '')) + ' ' + (j && j.message || '')); } catch (e) { /* not JSON */ }
  if (/PGRST20|schema cache|does not exist/i.test(sig)) SH.missing = true;

}
// Everything about a shared cluster that belongs to everyone in it.
function sharedPayload(z) {

  return {
    name: cat.name, color: cat.color, w: Math.round(z.w), h: Math.round(z.h),
    tasks: STATE.notes.filter(n => n.sharedId === z.sharedId).map(n => ({
      id: n.id, title: n.title || '', desc: n.desc || '',

      completedAt: n.completedAt || null, archived: !!n.archived,

// Somewhere clear of everything already on the board, for a cluster arriving for the first time.
function freeSpotForShared() {
  let maxX = 40, minY = 40;
  for (const z of STATE.zones) maxX = Math.max(maxX, z.x + z.w);
  for (const n of STATE.notes) if (!n.archived) maxX = Math.max(maxX, n.x + NOTE_W);
  return { x: maxX + 80, y: minY };

  let sid = z.sharedId;

    const body = { owner: myId(), data: { name: cat.name, color: cat.color, w: Math.round(z.w), h: Math.round(z.h), tasks: [] } };
    const r = await sbFetch('/rest/v1/dayu_shared_clusters', {
      method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify([body]),
    }).catch(() => null);
    if (!r) return { ok: false, message: 'No connection right now.' };
    if (await shMissing(r)) return { ok: false, message: 'Shared clusters are not switched on for this copy of Dayu yet.' };
    if (!r.ok) return { ok: false, message: 'Could not share that cluster (HTTP ' + r.status + ').' };
    const made = (await r.json().catch(() => []))[0];

      body: JSON.stringify([{ cluster_id: sid, user_id: friendId }]),
    }).catch(() => null);

function dragToReorder(row, body) {

    if (e.button !== 0 || e.target.closest('button')) return;
    if (e.pointerType !== 'mouse' && !e.target.closest('.tpGrip')) return;
    const startY = e.clientY;
    let moving = false;
    const mv = ev => {
      if (ev.pointerId !== e.pointerId) return;
      if (!moving) {
        if (Math.abs(ev.clientY - startY) < 5) return;
        // The press may have closed a title box, and the redraw that followed replaced the
        // rows, so carry on with the row that stands in for this one now.
        if (!row.isConnected) {
          row = $('#queuePanel .tpRow[data-id="' + row.dataset.id + '"]');
          if (!row) { up(ev); return; }
          body = row.parentNode;

        moving = true;
        queueDragging = true;
        row.classList.add('dragging');
        body.classList.add('reordering');
        try { row.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
      }
      if (ev.cancelable) ev.preventDefault();
      // A long queue scrolls, so holding near either end carries the list along.
      const rb = body.getBoundingClientRect();
      if (ev.clientY < rb.top + 18) body.scrollTop -= 8;
      else if (ev.clientY > rb.bottom - 18) body.scrollTop += 8;
      for (const other of body.querySelectorAll('.tpRow')) {
        if (other === row) continue;
        const r = other.getBoundingClientRect();
        if (ev.clientY < r.top || ev.clientY > r.bottom) continue;
        if (ev.clientY < r.top + r.height / 2) { if (row.nextSibling !== other) body.insertBefore(row, other); }
        else if (other.nextSibling !== row) body.insertBefore(row, other.nextSibling);

      if (ev.pointerId !== e.pointerId) return;
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (!moving) return;
      row.classList.remove('dragging');
      body.classList.remove('reordering');
      // The click that ends a drag is not a request to go and look at the task, so the row
      // stays put and marked until that click has been and gone.
      row.dataset.dragged = '1';
      const order = [...body.querySelectorAll('.tpRow')].map(r => r.dataset.id);
      setTimeout(() => {
        queueDragging = false;
        delete row.dataset.dragged;
        reorderQueue(order);
        renderPanel(QUEUE_PANEL);     // catches up on any redraw skipped during the drag
      }, 0);
    };
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

// An arrow is a pointer from one task to another, kept in STATE.links rather than on either

    // leave it neither finished nor anywhere to be found, since the canvas hides archived
    // tasks and the archive only lists finished ones.
    n.archived = false;

  }

  wrap.append(h('div.filters', {}, h('div.frow', {}, quickSel, fromIn, h('span', { style: { color: 'var(--ink3)', fontSize: '12px' } }, 'to'), toIn)));

  const hasFilter = ghistHasFilter();

  // per-goal totals: the filtered window if one is set, otherwise the whole history
  const summary = h('div.ghist-sum');
  for (const hb of all) {
    let s;
    if (hasFilter) {
      s = habitStatsInRange(hb, ghistFilters.from, ghistFilters.to);
    } else {
      const st = habitStats(hb);
      const marks = Object.values(hb.days);
      s = { pct: st.pct, checked: st.checked, totalDays: st.totalDays, best: st.best, blue: marks.filter(v => v === 'blue').length, yellow: marks.filter(v => v === 'yellow').length, red: marks.filter(v => v === 'red').length };
    }
    summary.append(h('div.ghist-row', {},
      h('span.ghr-name', {}, hb.name, hb.archivedAt ? h('span.ghr-tag', {}, 'retired ' + fmtDY(hb.archivedAt)) : null),
      h('span.ghr-pct', {}, s.pct + '%'),
      h('span.ghr-detail', {}, s.checked + ' green'
        + (s.blue ? ', ' + s.blue + ' rest' : '') + (s.yellow ? ', ' + s.yellow + ' yellow' : '') + (s.red ? ', ' + s.red + ' red' : '')
        + ' of ' + s.totalDays + ' days · best streak ' + s.best),
      // A retired goal is only kept here, so this is where it comes back from, or goes for good.
      hb.archivedAt ? h('span.ghr-acts', {},
        h('button.btn.ghost.small', { title: 'Put it back on the daily sheet', onclick: () => {
          undoableAction('“' + hb.name + '” is back on the daily sheet', () => { hb.archivedAt = null; });
        } }, 'Resume'),
        h('button.btn.danger.small', { title: 'Delete it and its history forever', onclick: () => {
          undoableAction('“' + hb.name + '” deleted', () => { STATE.habits = STATE.habits.filter(x => x.id !== hb.id); });
        } }, 'Delete')) : null));
  }
  wrap.append(h('div.dsec', {}, h('span.label', {}, ghistRangeLabel()), summary));

  const letters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const tk = todayKey();
  const months = monthsWithHistory().filter(({ y, m }) => {
    if (!hasFilter) return true;
    const first = y + '-' + String(m + 1).padStart(2, '0') + '-01';
    const last = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(new Date(y, m + 1, 0).getDate()).padStart(2, '0');
    if (ghistFilters.to && first > ghistFilters.to) return false;
    if (ghistFilters.from && last < ghistFilters.from) return false;
    return true;
  });
  let shown = 0;
  for (const { y, m } of months) {
    let keys = monthDayKeys(y, m);
    if (hasFilter) keys = keys.filter(k => (!ghistFilters.from || k >= ghistFilters.from) && (!ghistFilters.to || k <= ghistFilters.to));
    if (!keys.length) continue;
    if (!hasFilter) {
      // Skip a month nobody marked, unless it is the current one.
      const anyMarks = all.some(hb => keys.some(k => hb.days[k]));
      if (!anyMarks && monthKeyOf(Date.now()) !== y + '-' + String(m + 1).padStart(2, '0')) continue;
    }
    // A goal belongs in this month if it was marked here, or if it was already alive then
    // and had not yet been retired: no rows for months before a goal existed.
    const monthEnd = keyToTs(keys[keys.length - 1]);
    const monthStart = keyToTs(keys[0]);
    const rows = all.filter(hb => keys.some(k => hb.days[k])
      || (startOfDay(hb.createdAt) <= monthEnd && (!hb.archivedAt || hb.archivedAt >= monthStart)));
    if (!rows.length) continue;

    const thead = h('thead', {}, h('tr', {},
      h('th.hname', {}, ''),
      keys.map(k => {
        const d = new Date(k + 'T12:00');
        return h('th' + (k === tk ? '.todaycol' : ''), {}, letters[d.getDay()], h('span.dnum', {}, String(d.getDate())));
      })));
    const tbody = h('tbody');
    for (const hb of rows) {
      const tr = h('tr', {}, h('td.hname', {}, hb.name, hb.archivedAt ? h('span.ghr-tag', {}, 'retired') : null));
      for (const k of keys) {
        const future = keyToTs(k) > Date.now();
        const title = () => hb.name + ' · ' + k + (hb.days[k] ? ' (' + cellLabel(hb.days[k]) + ')' : '');
        const cell = h('button.hcell' + (hb.days[k] ? '.c-' + hb.days[k] : ''), { title: title(), disabled: future });
        if (!future) cell.addEventListener('click', () => {
          toggleHabit(hb, k);
          cell.className = 'hcell' + (hb.days[k] ? ' c-' + hb.days[k] : '');
          cell.title = title();
        });
        tr.append(h('td' + (k === tk ? '.todaycol' : '') + (future ? '.futurecol' : ''), {}, cell));
      }
      tbody.append(tr);
    }
    const label = new Date(y, m, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    wrap.append(h('div.dsec', {},
      h('span.label', {}, label),
      h('div.hwrap', {}, h('table.htable.hmonth', {}, thead, tbody))));
    shown++;
  }
  if (hasFilter && !shown) wrap.append(h('div.empty', {}, 'Nothing tracked in this range.'));
  return wrap;
}

'use strict';
/* ================= Dayu: the Sleep page (checklist, nights, log, notes) and Gifts ================= */

/* ---------- nights and points ---------- */
// A night is named for the evening it begins on, and runs until noon the next day. The
// wind-down routine crosses midnight, and ticking off last night over breakfast should still
// land on last night, so this page turns over at noon rather than at midnight.
function nightKeyAt(ts) { const d = new Date(ts); d.setHours(d.getHours() - 12); return dayKey(d.getTime()); }
function currentNightKey() { return nightKeyAt(Date.now()); }
function nightKeyShift(key, days) { const d = new Date(key + 'T12:00'); d.setDate(d.getDate() + days); return dayKey(d.getTime()); }
function hasOwn(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }
// A tick keeps the points it was worth when it was made, so changing an item's points, or
// taking it off the list, never rewrites what was already earned.
function sleepEarned() {
  let n = 0;
  for (const night of Object.values(STATE.sleep.checks)) for (const v of Object.values(night)) n += Number(v) || 0;
  return n;
}
function giftsSpent() { return STATE.gifts.redeemed.reduce((a, r) => a + (Number(r.cost) || 0), 0); }
function pointsBalance() { return sleepEarned() + tasksEarned() - giftsSpent(); }

/* ---------- points on tasks ---------- */
// A task can carry points (n.pts). They are credited when you tick it off, into a record kept
// by task id, and taken back if you untick it. So deleting a finished task later never takes
// back what it earned, and a friend finishing a task in a shared cluster, which reaches this
// board through the sync rather than through a tick here, credits nothing.
function taskPts(n) { const v = Math.round(Number(n && n.pts)); return isFinite(v) && v > 0 ? Math.min(v, 999) : 0; }
function tasksEarned() { return Object.values(STATE.gifts.taskPts).reduce((a, v) => a + (Number(v) || 0), 0); }
function creditTask(n) {
  const p = taskPts(n);
  if (p) STATE.gifts.taskPts[n.id] = p; else delete STATE.gifts.taskPts[n.id];
}
function uncreditTask(n) { delete STATE.gifts.taskPts[n.id]; }
// Whether a finished task's credit follows a change to its points: one of yours that was
// finished before it had points is credited then, while a shared one is only adjusted if this
// board credited it in the first place (a friend may have been the one to finish it).
function taskCreditFollows(n) { return !!n.completedAt && (!n.sharedId || hasOwn(STATE.gifts.taskPts, n.id)); }
// Sets a task's points from what was typed (empty or 0 means none). `follows` comes from
// taskCreditFollows(), worked out by a caller that edits over several keystrokes before any
// of them can clear the credit it is deciding from.
function setTaskPts(n, raw, follows) {
  const s = String(raw == null ? '' : raw).trim();
  const p = Math.round(Number(s));
  if (s && isFinite(p) && p > 0) n.pts = Math.min(p, 999); else delete n.pts;
  if (follows === undefined ? taskCreditFollows(n) : follows) creditTask(n);
}
function ptsText(n) { return n + (n === 1 ? ' point' : ' points'); }

// What a points box holds, as a whole number in [lo, 999], or null when it is empty or not a
// number. Number('') is 0, so an emptied box would otherwise quietly become a price of 0 or 1.
function readPoints(input, lo) {
  const raw = String(input.value).trim();
  const n = Math.round(Number(raw));
  return raw && isFinite(n) ? clamp(n, lo, 999) : null;
}
// '23:45' becomes '11:45 p.m.', the way the routine was written.
function fmtClock(hhmm) {
  const [H, M] = String(hhmm).split(':').map(Number);
  return (H % 12 || 12) + ':' + String(M).padStart(2, '0') + ' ' + (H < 12 ? 'a.m.' : 'p.m.');
}
// The importer counts a night's times in minutes after 6 p.m. on its evening.
function fmtNightMin(m) {
  const t = ((18 * 60 + Math.round(m)) % 1440 + 1440) % 1440;
  return fmtClock(Math.floor(t / 60) + ':' + (t % 60));
}
function fmtDur(min) {
  const m = Math.max(0, Math.round(Number(min) || 0)), hh = Math.floor(m / 60), mm = m % 60;
  return hh ? hh + 'h' + (mm ? ' ' + mm + 'm' : '') : mm + 'm';
}
function nightDate(key, opts) { return new Date(key + 'T12:00').toLocaleDateString(undefined, opts || { weekday: 'short', month: 'short', day: 'numeric' }); }
function nightLabel(key) {
  if (key === currentNightKey()) return (new Date().getHours() < 12 ? 'Last night' : 'Tonight') + ', ' + nightDate(key);
  return 'The night of ' + nightDate(key);
}

/* ---------- the page ---------- */
let sleepView = 'list';          // which part of the page is showing: list, nights or notes
let sleepNight = null;           // the night being looked at, or null for the current one
let sleepEditList = false;       // the checklist is open for editing
let sleepRenderedNight = null;   // the current night when the list was last drawn
let sleepOpenNight = null;       // the night whose details are open in the Nights chart

// Pressing a row redraws the page, which would take the keyboard's place with it. Controls
// carry a data-fkey, and whichever one had focus gets it back in the new drawing.
function refocus(box, key) {
  if (!key) return;
  const el = $$('[data-fkey]', box).find(x => x.dataset.fkey === key);
  if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) { /* older browsers */ } }
}
function renderSleep() {
  const inner = $('#sleepInner');
  if (!inner) return;
  const a = document.activeElement;
  const fkey = a && inner.contains(a) && a.dataset ? a.dataset.fkey : '';
  inner.innerHTML = '';
  inner.append(h('h1', {}, 'Sleep'));
  inner.append(h('div.segbar', {}, [['list', 'Checklist'], ['nights', 'Nights'], ['notes', 'Notes']].map(([v, l]) =>
    h('button.seg' + (sleepView === v ? '.on' : ''), { dataset: { fkey: 'seg:' + v }, onclick: () => { sleepView = v; renderSleep(); } }, l))));
  if (sleepView === 'nights') inner.append(renderSleepNights());
  else if (sleepView === 'notes') inner.append(renderSleepNotesAndLog());
  else inner.append(renderSleepList());
  refocus(inner, fkey);
}

// Your points, and what they are closest to buying.
function sleepPointsLine() {
  const bal = pointsBalance();
  const gifts = STATE.gifts.items.slice().sort((a, b) => a.cost - b.cost);
  const next = gifts.find(g => g.cost > bal);
  const ready = gifts.filter(g => g.cost <= bal);
  let aim;
  if (!gifts.length) aim = 'Add a gift to work toward';
  else if (ready.length) aim = 'Enough for ' + ready[ready.length - 1].name;
  else aim = (next.cost - Math.max(0, bal)) + ' more for ' + next.name;
  return h('div.slpts', {},
    h('span.slptsnum', {}, ptsText(bal)),
    h('span.slptsaim', {}, aim),
    h('button.btn.ghost.small', { onclick: () => go('gifts') }, 'Gifts →'));
}

function renderSleepList() {
  const box = h('div');
  const cur = currentNightKey();
  if (sleepNight && sleepNight >= cur) sleepNight = null;
  const nk = sleepNight || cur;
  sleepRenderedNight = cur;
  box.append(h('div.sub', {}, 'Tick off the night’s list. Each tick earns its points toward a gift.'));
  box.append(sleepPointsLine());

  box.append(h('div.slhead', {},
    h('button.slnavbtn', { title: 'The night before', 'aria-label': 'The night before', dataset: { fkey: 'nav:prev' }, onclick: () => { sleepNight = nightKeyShift(nk, -1); renderSleep(); } }, '‹'),
    h('span.slnight', {}, nightLabel(nk)),
    h('button.slnavbtn', { title: 'The night after', 'aria-label': 'The night after', dataset: { fkey: 'nav:next' }, disabled: nk >= cur, onclick: () => {
      const n = nightKeyShift(nk, 1);
      sleepNight = n >= cur ? null : n;
      renderSleep();
    } }, '›'),
    sleepNight ? h('button.btn.ghost.small', { onclick: () => { sleepNight = null; renderSleep(); } }, new Date().getHours() < 12 ? 'Back to last night' : 'Back to tonight') : null));

  if (sleepEditList) { box.append(renderSleepListEditor()); return box; }

  const checks = STATE.sleep.checks[nk] || {};
  const items = STATE.sleep.items;
  if (!items.length) box.append(h('div.hempty', {}, 'Nothing on the list yet. Press Edit the list to add what you want to do each night.'));
  const list = h('div.sllist');
  for (const it of items) {
    const on = hasOwn(checks, it.id);
    const row = h('button.slrow' + (on ? '.on' : ''), { type: 'button', 'aria-pressed': on ? 'true' : 'false', dataset: { fkey: 'row:' + it.id } },
      h('span.slchk', { innerHTML: TICK_SVG }),
      h('span.slbody', {},
        it.time ? h('span.sltime', {}, fmtClock(it.time)) : null,
        h('span.sltext', {}, it.text)),
      h('span.slpt', {}, '+' + (on ? checks[it.id] : it.pts)));
    row.addEventListener('click', () => toggleSleepItem(it, nk, !sleepNight));
    list.append(row);
  }
  box.append(list);

  const done = items.filter(it => hasOwn(checks, it.id)).length;
  const earned = Object.values(checks).reduce((a, v) => a + (Number(v) || 0), 0);
  const nd = STATE.sleep.nights[nk];
  box.append(h('div.slfoot', {},
    h('span.slsum', {}, items.length ? done + ' of ' + items.length + ' done, ' + ptsText(earned) : (earned ? ptsText(earned) + ' earned' : '')),
    h('button.btn.ghost.small', { onclick: () => { sleepEditList = true; renderSleep(); } }, 'Edit the list')));
  if (nd) box.append(h('div.slwatch', {}, 'Apple Watch: ' + (nd.asleep ? 'asleep ' + fmtDur(nd.asleep) : 'in bed ' + fmtDur(nd.inBed)) + ', from ' + fmtNightMin(nd.b) + ' to ' + fmtNightMin(nd.w)));
  return box;
}

function toggleSleepItem(it, nk, live) {
  // Drawn before noon and tapped after it: the night has turned over, so redraw first rather
  // than tick a night that is no longer the one on screen.
  if (live && currentNightKey() !== nk) { renderSleep(); return; }
  const all = STATE.sleep.checks;
  const night = all[nk] || (all[nk] = {});
  const was = hasOwn(night, it.id);
  if (was) delete night[it.id]; else night[it.id] = it.pts;
  if (!Object.keys(night).length) delete all[nk];
  save();
  const items = STATE.sleep.items;
  if (!was && items.length > 1 && items.every(x => hasOwn(all[nk], x.id))) {
    const at = burstFrom($('.slfoot'));
    confetti(at.x, at.y);
    toast('The whole list, done. Sleep well');
  }
  renderSleep();
}

// The list itself: each item's time, words and points, its place in the order, and new items.
function renderSleepListEditor() {
  const box = h('div.sledit');
  const items = STATE.sleep.items;
  items.forEach((it, i) => {
    const time = h('input.input.sltimein', { type: 'time', value: it.time, title: 'Time (leave it empty for none)', 'aria-label': 'Time' });
    const text = h('input.input.grow', { value: it.text, maxLength: 200, placeholder: 'What to do', 'aria-label': 'What to do' });
    const pts = h('input.input.slptsin', { type: 'number', inputmode: 'numeric', min: 0, max: 999, value: it.pts, title: 'Points it earns', 'aria-label': 'Points' });
    time.addEventListener('change', () => { it.time = /^\d\d:\d\d$/.test(time.value) ? time.value : ''; save(); });
    const commitText = () => { const v = text.value.trim(); if (!v || v === it.text) return false; it.text = v; return true; };
    text.addEventListener('change', () => { if (commitText()) save(); else text.value = it.text; });
    text.__flush = commitText;
    const commitPts = () => { const v = readPoints(pts, 0); if (v === null || v === it.pts) return false; it.pts = v; return true; };
    pts.addEventListener('change', () => { if (commitPts()) save(); pts.value = it.pts; });
    pts.__flush = commitPts;
    const move = d => { const j = i + d; if (j < 0 || j >= items.length) return; items.splice(i, 1); items.splice(j, 0, it); save(); renderSleep(); };
    box.append(h('div.sleditrow', {},
      time, text, pts,
      h('span.sleditbtns', {},
        h('button.lnkbtn', { title: 'Move up', 'aria-label': 'Move up', dataset: { fkey: 'up:' + it.id }, disabled: i === 0, onclick: () => move(-1) }, '↑'),
        h('button.lnkbtn', { title: 'Move down', 'aria-label': 'Move down', dataset: { fkey: 'down:' + it.id }, disabled: i === items.length - 1, onclick: () => move(1) }, '↓'),
        h('button.xbtn', { title: 'Take it off the list', 'aria-label': 'Take it off the list', onclick: () => {
          undoableAction('“' + it.text + '” is off the list. Points it earned stay yours', () => { STATE.sleep.items = STATE.sleep.items.filter(x => x.id !== it.id); });
        } }, '✕'))));
  });
  const nTime = h('input.input.sltimein', { type: 'time', title: 'Time (optional)', 'aria-label': 'Time' });
  const nText = h('input.input.grow', { placeholder: coarsePointer() ? 'Add to the list…' : 'Add to the list and press Enter…', maxLength: 200, enterkeyhint: 'done' });
  const nPts = h('input.input.slptsin', { type: 'number', inputmode: 'numeric', min: 0, max: 999, value: 1, title: 'Points it earns', 'aria-label': 'Points' });
  const add = () => {
    const v = nText.value.trim();
    if (!v) { nText.focus(); return; }
    const p = readPoints(nPts, 0);
    STATE.sleep.items.push({ id: uid(), text: v, time: /^\d\d:\d\d$/.test(nTime.value) ? nTime.value : '', pts: p === null ? 1 : p });
    save(); renderSleep();
    setTimeout(() => { const i = $('.sledit .sleditnew input.grow'); if (i) i.focus({ preventScroll: true }); }, 0);
  };
  nText.addEventListener('keydown', e => { if (e.key === 'Enter' && !imeBusy(e)) add(); });
  box.append(h('div.sleditrow.sleditnew', {}, nTime, nText, nPts, h('span.sleditbtns', {}, h('button.btn.primary.small', { onclick: add }, 'Add'))));
  box.append(h('div.slfoot', {},
    h('span.slsum', {}, 'A time is optional. Points are what a tick earns.'),
    h('button.btn.primary.small', { onclick: () => { sleepEditList = false; renderSleep(); } }, 'Done')));
  return box;
}

/* ---------- nights from Apple Health ---------- */
// Every save and every sync carries the nights, so only about four months are kept, and only
// the numbers this page draws.
const SLEEP_KEEP_NIGHTS = 120;
const NIGHT_FIELDS = ['b', 'w', 'asleep', 'core', 'deep', 'rem', 'unspec', 'awake', 'inBed'];
function packNight(n) {
  const o = {};
  for (const k of NIGHT_FIELDS) {
    const v = Math.round(Number(n[k]) || 0);
    if (v || k === 'b' || k === 'w') o[k] = v;   // a zero is left out; the two times always stay
  }
  return o;
}
const SLEEP_CHART_NIGHTS = 14;
// An import can take minutes on a phone, and the page can be redrawn while it runs (another
// tab of the page, a sync), so how far it has got lives here rather than in the elements
// that happened to be on screen when it began.
let sleepImporting = false, sleepImportPct = 0, sleepImportText = '';

function renderSleepNights() {
  const box = h('div');
  box.append(h('div.sub', {}, 'Your nights from Apple Watch, read from an Apple Health export.'));

  // --- import ---
  const fileIn = h('input', { type: 'file', accept: '.zip,.xml,application/zip,application/xml,text/xml', style: { display: 'none' } });
  const btn = h('button.btn.primary.small', { disabled: sleepImporting, onclick: () => fileIn.click() }, sleepImporting ? 'Reading…' : 'Import from Apple Health…');
  const prog = h('div.slprog', { style: { display: sleepImporting ? '' : 'none' } }, h('div.slprogfill', { style: { width: sleepImportPct + '%' } }));
  const nKeys = Object.keys(STATE.sleep.nights).sort();
  const status = h('div.setnote.slstatus', {}, sleepImporting ? sleepImportText : STATE.sleep.importedAt && nKeys.length
    ? nKeys.length + ' night' + (nKeys.length === 1 ? '' : 's') + ' on file, through ' + nightDate(nKeys[nKeys.length - 1], { month: 'short', day: 'numeric' }) + '. Last imported ' + fmtD(STATE.sleep.importedAt) + '.'
    : 'Nothing imported yet.');
  fileIn.addEventListener('change', () => {
    const f = fileIn.files && fileIn.files[0];
    fileIn.value = '';
    if (f) importAppleSleep(f);
  });
  box.append(h('div.gcard.slimport', {},
    h('div.ghead', {}, h('span.gname', {}, 'Apple Watch sleep'), btn),
    h('div.slhelp', {}, 'On your iPhone, open the Health app, tap your picture at the top right, then Export All Health Data, and save the file to Files. Then choose it here, on the phone or on any computer you have copied it to. A big export can take a minute or two to read, and nothing in it leaves this device except the nightly totals.'),
    prog, status, fileIn));

  if (!nKeys.length) {
    box.append(h('div.empty', {}, 'No nights yet. Import your Apple Health export to see them here.'));
    return box;
  }

  // --- the last two weeks on file ---
  const lastKey = nKeys[nKeys.length - 1];
  const keys = [];
  for (let i = 0; i < SLEEP_CHART_NIGHTS; i++) keys.push(nightKeyShift(lastKey, -i));
  const shown = keys.map(k => STATE.sleep.nights[k]).filter(Boolean);
  const week = keys.slice(0, 7).map(k => STATE.sleep.nights[k]).filter(n => n && n.asleep > 0);
  if (week.length) {
    const avg = f => week.reduce((a, n) => a + f(n), 0) / week.length;
    box.append(h('div.sltiles', {},
      h('div.sltile', {}, h('div.slval', {}, fmtDur(avg(n => n.asleep))), h('div.sllab', {}, 'Asleep, average')),
      h('div.sltile', {}, h('div.slval', {}, fmtNightMin(avg(n => n.b))), h('div.sllab', {}, 'Asleep by, average')),
      h('div.sltile', {}, h('div.slval', {}, fmtNightMin(avg(n => n.w))), h('div.sllab', {}, 'Awake at, average'))));
    box.append(h('div.slnote', {}, 'Averages over the ' + (week.length === 1 ? 'one night' : week.length + ' nights') + ' with sleep in the last week on file.'));
  }

  // The time axis runs from the earliest bedtime to the latest wake-up shown, on whole hours,
  // and never narrower than 9 p.m. to 9 a.m., so one short night does not fill the width.
  let lo = 180, hi = 900;
  for (const n of shown) { lo = Math.min(lo, Math.floor(n.b / 60) * 60); hi = Math.max(hi, Math.ceil(n.w / 60) * 60); }
  lo = Math.max(0, lo); hi = Math.min(lo + 24 * 60, hi);
  const pos = m => (clamp(m, lo, hi) - lo) / (hi - lo) * 100;
  const ticks = [];
  for (let m = Math.ceil(lo / 180) * 180; m <= hi; m += 180) ticks.push(m);
  const tickName = m => { const t = (18 * 60 + m) % 1440, hr = Math.floor(t / 60); return (hr % 12 || 12) + (hr < 12 ? 'a' : 'p'); };
  const grid = () => ticks.map(m => h('span.slgrid', { style: { left: pos(m) + '%' } }));

  const chart = h('div.slchart', { role: 'group', 'aria-label': 'Sleep, the last ' + SLEEP_CHART_NIGHTS + ' nights on file' });
  chart.append(h('div.slcrow.slaxis', { 'aria-hidden': 'true' },
    h('span'), h('span.sltrack', {}, ticks.map(m => h('span.sltick', { style: { left: pos(m) + '%' } }, tickName(m)))), h('span')));
  for (const k of keys) {
    const n = STATE.sleep.nights[k];
    const label = nightDate(k, { weekday: 'short', day: 'numeric' });
    if (!n) {
      chart.append(h('div.slcrow.slempty', {}, h('span.slday', {}, label), h('span.sltrack', {}, grid()), h('span.sldur', {}, 'no data')));
      continue;
    }
    const open = sleepOpenNight === k;
    const asleep = n.asleep > 0;
    const row = h('button.slcrow' + (open ? '.open' : ''), { type: 'button', 'aria-expanded': open ? 'true' : 'false', dataset: { fkey: 'night:' + k },
      title: (asleep ? 'Asleep ' + fmtDur(n.asleep) : 'In bed ' + fmtDur(n.inBed)) + ', ' + fmtNightMin(n.b) + ' to ' + fmtNightMin(n.w),
      onclick: () => { sleepOpenNight = open ? null : k; renderSleep(); } },
      h('span.slday', {}, label),
      h('span.sltrack', {}, grid(), h('span.slbar' + (asleep ? '' : '.inbed'), { style: { left: pos(n.b) + '%', width: Math.max(1, pos(n.w) - pos(n.b)) + '%' } })),
      h('span.sldur', {}, asleep ? fmtDur(n.asleep) : 'in bed'));
    chart.append(row);
    if (open) {
      const parts = [];
      if (n.core) parts.push('Core ' + fmtDur(n.core));
      if (n.deep) parts.push('Deep ' + fmtDur(n.deep));
      if (n.rem) parts.push('REM ' + fmtDur(n.rem));
      if (n.unspec) parts.push('Asleep, no stage ' + fmtDur(n.unspec));
      if (n.awake) parts.push('Awake ' + fmtDur(n.awake));
      if (n.inBed) parts.push('In bed ' + fmtDur(n.inBed));
      chart.append(h('div.slndetail', {},
        h('div', {}, nightLabel(k) + ': ' + (asleep ? fmtDur(n.asleep) + ' asleep, from ' : 'in bed from ') + fmtNightMin(n.b) + ' to ' + fmtNightMin(n.w)),
        parts.length ? h('div', {}, parts.join(' · ')) : null));
    }
  }
  box.append(h('div.gcard.slchartcard', {},
    h('div.ghead', {}, h('span.label', {}, 'The ' + SLEEP_CHART_NIGHTS + ' nights to ' + nightDate(lastKey, { month: 'short', day: 'numeric' }))),
    chart,
    h('div.slnote', {}, (coarsePointer() ? 'Tap' : 'Click') + ' a night for its stages.')));
  box.append(h('div.slfoot', {}, h('span'),
    h('button.btn.danger.small', { onclick: () => undoableAction('Imported nights cleared', () => { STATE.sleep.nights = {}; STATE.sleep.importedAt = null; }) }, 'Clear imported nights')));
  return box;
}

// Reads the export, then folds its nights into the board: a night in the file replaces the
// one on file, and only the most recent nights are kept, since every save carries them.
async function importAppleSleep(file) {
  if (sleepImporting) return;
  const name = file.name || 'the file';
  // Whatever import card is on screen now shows this, and so does any drawn later.
  const show = () => {
    const fill = $('.slimport .slprogfill'), st = $('.slimport .slstatus');
    if (fill) fill.style.width = sleepImportPct + '%';
    if (st) st.textContent = sleepImportText;
  };
  sleepImporting = true; sleepImportPct = 0; sleepImportText = 'Reading ' + name + '…';
  if (currentPage() === 'sleep' && sleepView === 'nights' && !editorBusy()) renderSleep();
  try {
    const res = await readAppleSleep(file, f => {
      sleepImportPct = Math.round(clamp(f, 0, 1) * 100);
      sleepImportText = 'Reading ' + name + '… ' + sleepImportPct + '%';
      show();
    });
    const incoming = Object.keys(res.nights);
    const all = Object.assign({}, STATE.sleep.nights);
    for (const k of incoming) all[k] = packNight(res.nights[k]);
    const keep = Object.keys(all).sort().slice(-SLEEP_KEEP_NIGHTS);
    const nights = {};
    for (const k of keep) nights[k] = all[k];
    STATE.sleep.nights = nights;
    STATE.sleep.importedAt = Date.now();
    save();
    const kept = incoming.filter(k => nights[k]).length;
    toast('Read ' + incoming.length + ' night' + (incoming.length === 1 ? '' : 's') + ' of sleep.'
      + (kept < incoming.length ? ' Dayu keeps the latest ' + SLEEP_KEEP_NIGHTS + '.' : ''), null, 6000);
  } catch (e) {
    toast(e && e.code ? e.message : 'That file could not be read. Choose the export.zip from Health, or the export.xml inside it.', null, 9000);
  } finally {
    sleepImporting = false;
    if (currentPage() === 'sleep') { if (editorBusy()) renderAllWhenFree(); else renderSleep(); }
  }
}

function sleepFlipCheck() {
  if (currentPage() !== 'sleep' || sleepView !== 'list' || sleepNight !== null) return;
  if (sleepRenderedNight === null || sleepRenderedNight === currentNightKey()) return;
  if (editorBusy()) { setTimeout(sleepFlipCheck, 2000); return; }

}
function scheduleSleepFlip() {
  clearTimeout(sleepFlipTimer);
  const t = new Date();
  if (t.getHours() >= 12) t.setDate(t.getDate() + 1);
  t.setHours(12, 0, 0, 0);
  sleepFlipTimer = setTimeout(() => { scheduleSleepFlip(); sleepFlipCheck(); }, t - Date.now() + 800);
}

'use strict';
/* ================= Apple Health sleep import ================= */
// Reads the export.zip that the Health app makes (or the export.xml inside it) and turns the
// sleep records into one summary per night. Everything is streamed: a few years of watch data
// is several GB of XML, and this has to run on an iPhone without loading the file into memory.

const AH_SLEEP_TYPE = 'HKCategoryTypeIdentifierSleepAnalysis';
// Which nightly total each HealthKit sleep value adds to. The bare "Asleep" value is what
// watches wrote before sleep stages arrived in 2022, so it counts as unspecified sleep.
// A Map, so a value such as "constructor" cannot match something on Object.prototype.
const AH_SLEEP_KINDS = new Map([
  ['HKCategoryValueSleepAnalysisInBed', 'inBed'],
  ['HKCategoryValueSleepAnalysisAsleepUnspecified', 'unspec'],
  ['HKCategoryValueSleepAnalysisAsleep', 'unspec'],
  ['HKCategoryValueSleepAnalysisAwake', 'awake'],
  ['HKCategoryValueSleepAnalysisAsleepCore', 'core'],
  ['HKCategoryValueSleepAnalysisAsleepDeep', 'deep'],
  ['HKCategoryValueSleepAnalysisAsleepREM', 'rem'],
]);
const AH_SLEEP_VALUES = [...AH_SLEEP_KINDS.keys()];
const AH_MAX_NIGHTS = 400;
// The longest stretch of text kept between chunks. A sleep record's opening tag is well under
// 1 KB, so this only matters for a broken file, where it stops the leftover growing forever.
const AH_MAX_CARRY = 256 * 1024;
const AH_DAY = 864e5;
const AH_MIN = 6e4;
const AH_MAX32 = 0xffffffff;

function ahError(code, message) {
  const e = new Error(message);
  e.code = code;
  return e;
}
function ahBadZip() {
  return ahError('badzip', 'This zip file could not be read. Try exporting again from the Health app, or unzip it and choose the export.xml inside.');
}

// Entry point. file is a File or Blob holding export.zip or export.xml; onProgress gets a
// fraction from 0 to 1 now and then.
async function readAppleSleep(file, onProgress) {
  // Trust the first bytes, not the name: iOS often renames downloads, and people unzip on a
  // computer and send the .xml back.
  const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
  const isZip = head.length === 4 && head[0] === 0x50 && head[1] === 0x4b &&
    ((head[2] === 3 && head[3] === 4) || (head[2] === 5 && head[3] === 6) || (head[2] === 7 && head[3] === 8));
  let raw, total, inflate = false;
  if (isZip) {
    const entry = await ahFindExportXml(file);
    raw = file.slice(entry.dataStart, entry.dataStart + entry.comp).stream();
    total = entry.comp;
    inflate = entry.method === 8;
  } else {
    raw = file.stream();
    total = file.size;
  }

  let stream = ahCountBytes(raw, total, onProgress);
  if (inflate) stream = stream.pipeThrough(new DecompressionStream('deflate-raw'));
  const st = { carry: '', skip: '', seen: 0, dups: new Set(), names: new Map(), list: [] };
  const reader = stream.getReader();
  const decoder = new TextDecoder('utf-8');
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      ahScanText(st, decoder.decode(value, { stream: true }));
    }
    ahScanText(st, decoder.decode());
  } catch (err) {
    reader.cancel().catch(() => { /* already closed */ });
    // A deflate error means the zip is damaged. A plain XML read error is passed on as it is.
    if (isZip) throw ahBadZip();
    throw err;
  }
  if (typeof onProgress === 'function') { try { onProgress(1); } catch (e) { /* not ours */ } }
  if (!st.seen) throw ahError('nosleep', 'No sleep data was found in this file.');

  const nights = ahSummariseNights(st.list);
  const keys = Object.keys(nights).sort();
  return { nights, records: st.seen, first: keys[0] || null, last: keys[keys.length - 1] || null };
}

/* ---------- zip: find export.xml without reading the whole file ---------- */
async function ahReadView(file, start, end) {
  return new DataView(await file.slice(start, end).arrayBuffer());
}
// 64-bit little-endian as a plain number. Safe up to 9 PB, so no BigInt needed.
function ahU64(v, at) {
  return v.getUint32(at, true) + v.getUint32(at + 4, true) * 4294967296;
}
function ahFindEocd(v, strict) {
  // Walk back from the end. Strict means the comment length must reach the end of the file
  // exactly, which skips a stray signature inside a comment; the loose pass allows junk after.
  for (let i = v.byteLength - 22; i >= 0; i--) {
    if (v.getUint32(i, true) !== 0x06054b50) continue;
    const end = i + 22 + v.getUint16(i + 20, true);
    if (strict ? end === v.byteLength : end <= v.byteLength) return i;
  }
  return -1;
}

async function ahFindExportXml(file) {
  const size = file.size;
  // The End of Central Directory is 22 bytes plus a comment of up to 65535, and the ZIP64
  // locator sits right before it.
  const tailStart = Math.max(0, size - (22 + 65535 + 20));
  const tail = await ahReadView(file, tailStart, size);
  let eocd = ahFindEocd(tail, true);
  if (eocd < 0) eocd = ahFindEocd(tail, false);
  if (eocd < 0) throw ahBadZip();
  let cdSize = tail.getUint32(eocd + 12, true);
  let cdOffset = tail.getUint32(eocd + 16, true);
  const maxed = cdSize === AH_MAX32 || cdOffset === AH_MAX32;

  // ZIP64: the real sizes live in a separate record that the locator points to.
  let z64 = false;
  if (eocd >= 20 && tail.getUint32(eocd - 20, true) === 0x07064b50) {
    const recAt = ahU64(tail, eocd - 20 + 8);
    if (recAt + 56 <= size) {
      const rec = await ahReadView(file, recAt, recAt + 56);
      if (rec.getUint32(0, true) === 0x06064b50) {
        cdSize = ahU64(rec, 40);
        cdOffset = ahU64(rec, 48);
        z64 = true;
      }
    }
  }
  if (maxed && !z64) throw ahBadZip();
  if (cdOffset + cdSize > size) throw ahBadZip();

  const cd = await ahReadView(file, cdOffset, cdOffset + cdSize);
  const names = new TextDecoder('utf-8');
  let found = null, entries = 0;
  for (let p = 0; p + 46 <= cd.byteLength;) {
    if (cd.getUint32(p, true) !== 0x02014b50) break;
    entries++;
    const nameLen = cd.getUint16(p + 28, true);
    const extraLen = cd.getUint16(p + 30, true);
    const commentLen = cd.getUint16(p + 32, true);
    const name = names.decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, Math.min(nameLen, cd.byteLength - p - 46)));
    // export_cda.xml sits next to it and is a different document, so match the name exactly.
    // macOS adds __MACOSX/ copies when someone re-zips the folder; those are not the data.
    const isExport = (name === 'export.xml' || /[\\/]export\.xml$/.test(name)) && !/^__MACOSX[\\/]/.test(name);
    if (isExport && !found) {
      const e = {
        flags: cd.getUint16(p + 8, true),
        method: cd.getUint16(p + 10, true),
        comp: cd.getUint32(p + 20, true),
        uncomp: cd.getUint32(p + 24, true),
        offset: cd.getUint32(p + 42, true),
      };
      // The ZIP64 extra field holds 8-byte values only for the fields that are maxed out,
      // always in this order.
      for (let q = p + 46 + nameLen, qEnd = Math.min(q + extraLen, cd.byteLength); q + 4 <= qEnd;) {
        const id = cd.getUint16(q, true), len = cd.getUint16(q + 2, true);
        if (id === 1) {
          let r = q + 4;
          const rEnd = Math.min(r + len, qEnd);
          if (e.uncomp === AH_MAX32 && r + 8 <= rEnd) { e.uncomp = ahU64(cd, r); r += 8; }
          if (e.comp === AH_MAX32 && r + 8 <= rEnd) { e.comp = ahU64(cd, r); r += 8; }
          if (e.offset === AH_MAX32 && r + 8 <= rEnd) { e.offset = ahU64(cd, r); r += 8; }
        }
        q += 4 + len;
      }
      found = e;
    }
    p += 46 + nameLen + extraLen + commentLen;
  }
  // Not one readable entry where the directory should be means the offsets are wrong.
  if (!entries && cdSize > 0) throw ahBadZip();
  if (!found) throw ahError('nozipxml', 'This zip has no export.xml in it. Use the export.zip from Export All Health Data in the Health app.');
  if (found.flags & 1) throw ahBadZip();
  if (found.method !== 0 && found.method !== 8) throw ahBadZip();
  if (found.method === 8 && !ahCanInflate()) {
    throw ahError('nodeflate', 'This browser cannot unzip files. Unzip export.zip first, then choose the export.xml inside it.');
  }

  // The data starts after the LOCAL header, whose name and extra lengths can differ from the
  // central directory's (a ZIP64 extra field is often only in one of them).
  if (found.offset + 30 > size) throw ahBadZip();
  const local = await ahReadView(file, found.offset, found.offset + 30);
  if (local.getUint32(0, true) !== 0x04034b50) throw ahBadZip();
  found.dataStart = found.offset + 30 + local.getUint16(26, true) + local.getUint16(28, true);
  if (found.dataStart + found.comp > size) throw ahBadZip();
  return found;
}

function ahCanInflate() {
  if (typeof DecompressionStream !== 'function') return false;
  // Chrome before 103 has DecompressionStream but not the raw format a zip needs.
  try { new DecompressionStream('deflate-raw'); return true; } catch (e) { return false; }
}

// Pass the bytes through untouched, reporting how far into the file we are.
function ahCountBytes(stream, total, onProgress) {
  if (typeof onProgress !== 'function') return stream;
  let got = 0, last = 0;
  return stream.pipeThrough(new TransformStream({
    transform(chunk, ctl) {
      got += chunk.byteLength;
      const now = Date.now();
      if (now - last >= 150) {
        last = now;
        try { onProgress(total > 0 ? Math.min(1, got / total) : 0); } catch (e) { /* a broken callback must not stop the import */ }
      }
      ctl.enqueue(chunk);
    },
  }));
}

/* ---------- XML: pick the sleep records out of the stream ---------- */
// Markup that runs until a fixed closing text, whatever is inside. Quotes and '<' in a comment
// mean nothing, so a comment such as "Andy's old phone" must not look like a quoted value
// that never ends.
const AH_SKIPS = [['<?', '?>'], ['<!--', '-->'], ['<![CDATA[', ']]>']];

// Most of the file is heart rate and step counts, so jump between mentions of the sleep type
// with indexOf instead of parsing every tag. Whatever is cut off at the end of a chunk is
// carried into the next one.
//
// Every position found with indexOf is kept until the scan moves past it, so no stretch of a
// chunk is searched twice. That keeps the time linear in the chunk size even when the type id
// turns up on every line and there is no '<' for thousands of lines (a CSV from another app).
//
// Comments, processing instructions, CDATA sections and DTD declarations are stepped over
// whole. Only those start with '<!' or '<?', and Apple puts them only at the top of the file,
// so in the body each of those two searches comes up empty once per chunk.
function ahScanText(st, chunk) {
  const text = st.carry ? st.carry + chunk : chunk;
  let from = 0, keep = -1;
  if (st.skip) {
    // The last chunk ended inside a comment or the like: find where it closes first.
    const end = text.indexOf(st.skip);
    if (end < 0) { st.carry = text.slice(Math.max(0, text.length - st.skip.length + 1)); return; }
    from = end + st.skip.length;
    st.skip = '';
  }
  let hit = -1, lt = -1, bang = -1, pi = -1;
  for (;;) {
    if (hit < from) hit = ahFind(text, AH_SLEEP_TYPE, from);
    if (bang < from) bang = ahFindMark(text, '!', from);
    if (pi < from) pi = ahFindMark(text, '?', from);
    const mark = Math.min(bang, pi);
    // Markup before the next mention (or anywhere in the rest, when there is none) is stepped
    // over, so the scan is never left inside it at a mention or at the end of the chunk.
    if (mark < hit) {
      const long = AH_SKIPS.find(s => text.startsWith(s[0], mark));
      if (long) {
        const body = mark + long[0].length;
        const end = text.indexOf(long[1], body);
        if (end >= 0) { from = end + long[1].length; continue; }
        // It goes on into the next chunk. Carry only enough to spot the closing text when it
        // is split across the boundary, since a comment can be any length.
        st.skip = long[1];
        keep = Math.max(body, text.length - long[1].length + 1);
        break;
      }
      const end = ahDeclEnd(text, mark);
      if (end < 0) { keep = mark; break; }
      from = end;
      continue;
    }
    if (hit === Infinity) break;
    if (lt < from) lt = ahFind(text, '<', from);
    // No tag starts between here and the mention, so it is in plain text.
    if (lt > hit) { from = hit + AH_SLEEP_TYPE.length; continue; }
    // A '<' at lt comes before the mention, so this backward search stops at or after lt
    // rather than running back to the start of the chunk. With no markup in the way, and '<'
    // not allowed inside an attribute value, the last '<' is where the tag around it starts.
    const open = text.lastIndexOf('<', hit);
    const close = ahTagEnd(text, open, false);
    if (close < 0) { keep = open; break; }
    if (close > hit && text.startsWith('<Record', open) && /\s/.test(text.charAt(open + 7))) {
      ahTakeRecord(st, ahAttrs(text.slice(open + 7, close)));
    }
    from = close + 1;
  }
  // Keep the last, possibly unfinished, tag. Every comment and the like has been stepped over
  // by now, so the last '<' is where an ordinary tag starts.
  let start = keep;
  if (start < 0) {
    const last = text.lastIndexOf('<');
    start = last >= from ? last : text.length;
  }
  if (text.length - start > AH_MAX_CARRY) start = text.length - AH_MAX_CARRY;
  st.carry = text.slice(start);
}

// indexOf, with Infinity for "not there" so the result can be compared and kept.
function ahFind(text, s, from) {
  const i = text.indexOf(s, from);
  return i < 0 ? Infinity : i;
}

// Where the next '<!' or '<?' starts. Searching for the '!' or '?' alone and checking the
// character before it is about twice as fast as searching for the pair, and these two searches
// run over every byte of the file.
function ahFindMark(text, ch, from) {
  for (let i = text.indexOf(ch, from + 1); i >= 0; i = text.indexOf(ch, i + 1)) {
    if (text.charCodeAt(i - 1) === 60) return i - 1;
  }
  return Infinity;
}

// Index just past the DTD declaration (<!ELEMENT, <!ATTLIST and the like) starting at i, or -1
// when it runs past the text we have so far. A DOCTYPE with an internal subset counts as
// ending at its '[', so the declarations inside are stepped over one by one; the ']>' that
// closes it is plain text to this scanner.
function ahDeclEnd(text, i) {
  // '<![CDATA[' is the longest opener, so with less than that we cannot tell what this is yet.
  if (text.length - i < 9) return -1;
  const end = ahTagEnd(text, i, text.startsWith('<!DOCTYPE', i));
  return end < 0 ? -1 : end + 1;
}

// Index of the '>' that ends the tag starting at open, skipping quoted values, or -1 when the
// tag runs past the end of the text we have so far. For a DOCTYPE, a '[' ends it too.
function ahTagEnd(text, open, doctype) {
  for (let i = open + 1; i < text.length; i++) {
    const c = text.charCodeAt(i);
    if (c === 62 || (doctype && c === 91)) return i;
    if (c === 34 || c === 39) {
      const q = text.indexOf(c === 34 ? '"' : "'", i + 1);
      if (q < 0) return -1;
      i = q;
    }
  }
  return -1;
}

function ahAttrs(s) {
  const out = {};
  const re = /([\w:.-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g;
  let m;
  while ((m = re.exec(s))) {
    const v = m[2] !== undefined ? m[2] : m[3];
    out[m[1]] = v.indexOf('&') < 0 ? v : ahDecodeXml(v);
  }
  return out;
}

function ahDecodeXml(s) {
  return s.replace(/&(#[xX][0-9a-fA-F]+|#\d+|amp|lt|gt|quot|apos);/g, (all, ent) => {
    if (ent.charAt(0) !== '#') return { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" }[ent];
    const code = ent.charAt(1) === 'x' || ent.charAt(1) === 'X' ? parseInt(ent.slice(2), 16) : parseInt(ent.slice(1), 10);
    return code > 0 && code <= 0x10ffff ? String.fromCodePoint(code) : all;
  });
}

// '2024-10-01 23:12:30 -0700' as two numbers: wall is the local clock reading treated as if it
// were UTC (for which night and what time it says), abs is the real instant (for durations,
// so a clock change in the night does not add or lose an hour).
function ahParseDate(s) {
  const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)(?::(\d\d))?(?:\.\d+)?\s*(?:([+-])(\d\d):?(\d\d)|Z)?/.exec(s || '');
  if (!m) return null;
  const wall = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
  const off = m[7] ? (m[7] === '-' ? -1 : 1) * (+m[8] * 60 + +m[9]) : 0;
  return { wall, abs: wall - off * AH_MIN };
}

function ahTakeRecord(st, a) {
  if (a.type !== AH_SLEEP_TYPE) return;
  st.seen++;
  const kind = AH_SLEEP_KINDS.get(a.value);
  if (!kind) return;
  const s = ahParseDate(a.startDate), e = ahParseDate(a.endDate);
  // A record with no length says nothing about the night, and would otherwise count as the
  // watch having tracked stages, or pull the bedtime earlier than the real sleep.
  if (!s || !e || e.abs <= s.abs) return;
  // A night runs from 18:00 to noon the next day on the record's own clock, and is named for
  // the evening it began. Anything starting between noon and 18:00 is a nap and is left out.
  const day = Math.floor(s.wall / AH_DAY);
  const minute = (s.wall - day * AH_DAY) / AH_MIN;
  let night;
  if (minute >= 18 * 60) night = day;
  else if (minute < 12 * 60) night = day - 1;
  else return;
  // Nothing kept may point into the text: browsers make a substring share the memory of the
  // string it came from, so one kept name would hold on to a whole chunk of the file. Names are
  // copied once per source, and the duplicate key is built from numbers.
  const name = a.sourceName || '';
  let src = st.names.get(name);
  if (!src) {
    const copy = JSON.parse(JSON.stringify(name));
    src = { name: copy, id: st.names.size, watch: /watch/i.test(copy) };
    st.names.set(copy, src);
  }
  // Exports sometimes hold the same record twice (a restored backup, a resync).
  const key = src.id + '|' + s.wall + '|' + s.abs + '|' + e.wall + '|' + e.abs + '|' + AH_SLEEP_VALUES.indexOf(a.value);
  if (st.dups.has(key)) return;
  st.dups.add(key);
  st.list.push({
    night, src: src.name, kind,
    watch: src.watch || /watch/i.test(a.device || ''),
    sa: s.abs, ea: e.abs, sw: s.wall, ew: e.wall,
  });
}

/* ---------- one summary per night ---------- */
function ahIsAsleep(kind) {
  return kind === 'core' || kind === 'deep' || kind === 'rem' || kind === 'unspec';
}
// Time covered by a set of [start, end] spans, counting any overlap once.
function ahUnionMs(recs) {
  const spans = recs.map(r => [r.sa, r.ea]).sort((x, y) => x[0] - y[0]);
  let total = 0, curS = -Infinity, curE = -Infinity;
  for (const [s, e] of spans) {
    if (s > curE) {
      if (curE > curS) total += curE - curS;
      curS = s; curE = e;
    } else if (e > curE) curE = e;
  }
  if (curE > curS) total += curE - curS;
  return total;
}

function ahSummariseNights(list) {
  const byNight = new Map();
  for (const r of list) {
    let arr = byNight.get(r.night);
    if (!arr) byNight.set(r.night, arr = []);
    arr.push(r);
  }
  // Newest first, so the cap keeps the most recent nights, then stored oldest first.
  const kept = [];
  for (const night of [...byNight.keys()].sort((x, y) => y - x)) {
    if (kept.length >= AH_MAX_NIGHTS) break;
    const sum = ahSummariseNight(night, byNight.get(night));
    if (sum) kept.push([new Date(night * AH_DAY).toISOString().slice(0, 10), sum]);
  }
  const out = {};
  for (let i = kept.length - 1; i >= 0; i--) out[kept[i][0]] = kept[i][1];
  return out;
}

function ahSummariseNight(night, recs) {
  // Several apps can write the same night (the watch, the iPhone's bedtime In bed, AutoSleep
  // and the like), and adding them up would double count. So use one source per night.
  const bySrc = new Map();
  for (const r of recs) {
    let s = bySrc.get(r.src);
    if (!s) bySrc.set(r.src, s = { name: r.src, recs: [], stages: false, watch: false });
    s.recs.push(r);
    if (r.kind === 'core' || r.kind === 'deep' || r.kind === 'rem') s.stages = true;
    if (r.watch) s.watch = true;
  }
  let pool = [];
  for (const s of bySrc.values()) {
    s.sleep = s.recs.filter(r => ahIsAsleep(r.kind));
    s.bed = s.recs.filter(r => r.kind === 'inBed');
    // A source with only Awake records has nothing to show for the night.
    if (!s.sleep.length && !s.bed.length) continue;
    s.asleepMs = ahUnionMs(s.sleep);
    s.bedMs = s.bed.reduce((t, r) => t + r.ea - r.sa, 0);
    pool.push(s);
  }
  if (!pool.length) return null;
  // Sleep stages only come from the watch itself (or an app reading it), so they win first.
  if (pool.some(s => s.stages)) pool = pool.filter(s => s.stages);
  pool.sort((x, y) => (y.watch - x.watch) || (y.asleepMs - x.asleepMs) || (y.bedMs - x.bedMs) ||
    (x.name < y.name ? -1 : x.name > y.name ? 1 : 0));
  const pick = pool[0];

  const span = pick.sleep.length ? pick.sleep : pick.bed;
  let first = span[0], lastEnd = span[0];
  for (const r of span) {
    if (r.sa < first.sa) first = r;
    if (r.ea > lastEnd.ea) lastEnd = r;
  }
  const base = night * AH_DAY + 18 * 36e5;
  const ms = { core: 0, deep: 0, rem: 0, unspec: 0, awake: 0, inBed: 0 };
  for (const r of pick.recs) ms[r.kind] += r.ea - r.sa;
  const min = v => Math.round(v / AH_MIN);
  return {
    b: Math.floor((first.sw - base) / AH_MIN),
    w: Math.floor((lastEnd.ew - base) / AH_MIN),
    asleep: min(pick.asleepMs),
    core: min(ms.core), deep: min(ms.deep), rem: min(ms.rem), unspec: min(ms.unspec),
    awake: min(ms.awake), inBed: min(ms.inBed),
    src: pick.name,
  };
}

'use strict';
/* ================= Tack — archive & goals pages, boot ================= */

/* ---------- archive ---------- */
const afilters = { q: '', cats: new Set(), from: '', to: '', quick: 'all' };
let archiveView = 'tasks'; // 'tasks' or 'goals'

function archivedNotes() {
  let list = STATE.notes.filter(n => n.archived && n.completedAt);
  if (afilters.q) {
    const q = afilters.q.toLowerCase();
    list = list.filter(n => (n.title || '').toLowerCase().includes(q) || (n.desc || '').toLowerCase().includes(q));
  }
  if (afilters.cats.size) list = list.filter(n => afilters.cats.has(n.catId || 'none'));
  if (afilters.from) { const t = new Date(afilters.from + 'T00:00').getTime(); list = list.filter(n => n.completedAt >= t); }
  if (afilters.to) { const t = new Date(afilters.to + 'T00:00').getTime() + DAY; list = list.filter(n => n.completedAt < t); }
  return list.sort((a, b) => b.completedAt - a.completedAt);
}

function renderArchive() {
  const inner = $('#archiveInner');
  inner.innerHTML = '';
  inner.append(h('h1', {}, 'Archive'),
    h('div.sub', {}, archiveView === 'goals'
      ? 'Every day you have marked, all the way back. ' + (coarsePointer() ? 'Tap' : 'Click') + ' any cell to correct it.'
      : 'Everything you’ve finished. ' + (coarsePointer() ? 'Tap' : 'Click') + ' any task to read it back, or filter and restore.'));

  // --- which archive are we looking at ---
  const seg = h('div.segbar', {}, [['tasks', 'Completed tasks'], ['goals', 'Goal history']].map(([v, l]) =>
    h('button.seg' + (archiveView === v ? '.on' : ''), { onclick: () => { archiveView = v; renderArchive(); } }, l)));
  inner.append(seg);

  if (archiveView === 'goals') { inner.append(renderGoalHistory()); return; }

  // --- filters ---
  const qIn = h('input.input.grow', { placeholder: 'Search by name…', value: afilters.q });
  qIn.addEventListener('input', () => { afilters.q = qIn.value; refresh(); });
  const fromIn = h('input.input', { type: 'date', value: afilters.from, title: 'Completed on or after' });
  const toIn = h('input.input', { type: 'date', value: afilters.to, title: 'Completed on or before' });
  fromIn.addEventListener('change', () => { afilters.from = fromIn.value; afilters.quick = ''; refresh(); });
  toIn.addEventListener('change', () => { afilters.to = toIn.value; afilters.quick = ''; refresh(); });
  const quick = h('select.input', {},
    [['all', 'All time'], ['7', 'Last 7 days'], ['30', 'Last 30 days'], ['', 'Custom range']].map(([v, l]) =>
      h('option', { value: v, selected: afilters.quick === v }, l)));
  quick.addEventListener('change', () => {
    afilters.quick = quick.value;
    if (quick.value === 'all') { afilters.from = ''; afilters.to = ''; }
    else if (quick.value) {
      afilters.from = dayKey(Date.now() - (Number(quick.value) - 1) * DAY); afilters.to = '';
    }
    renderArchive();
  });

  const catRow = h('div.frow');
  const usedCats = [...new Set(STATE.notes.filter(n => n.archived).map(n => n.catId || 'none'))];
  for (const cid of usedCats) {
    const cat = cid === 'none' ? null : catById(cid);
    const pal = cat ? palById(cat.color) : null;
    const on = afilters.cats.has(cid);
    catRow.append(h('button.chip' + (on ? '.on' : ''), { onclick: e => {
      if (afilters.cats.has(cid)) afilters.cats.delete(cid); else afilters.cats.add(cid);
      renderArchive();
    } },
      pal ? h('span.dot', { style: { background: pal.bg, border: '1px solid ' + pal.deep } }) : null,
      cat ? cat.name : 'No category'));
  }

  inner.append(h('div.filters', {},
    // The dates stay together, so a narrow screen never leaves "to" stranded at a line's end.
    h('div.frow', {}, qIn, quick, h('span.daterange', {}, fromIn, h('span', { style: { color: 'var(--ink3)', fontSize: '12px' } }, 'to'), toIn)),
    usedCats.length ? catRow : null));

  // --- list ---
  const countEl = h('div.count');
  const listEl = h('div.alist');
  inner.append(countEl, listEl);

  function refresh() {
    const items = archivedNotes();
    countEl.textContent = items.length === 1 ? '1 task' : items.length + ' tasks';
    listEl.innerHTML = '';
    if (!items.length) {
      listEl.append(h('div.empty', { style: { gridColumn: '1/-1' } },

      return;
    }
    for (const n of items) listEl.append(archiveCard(n));
  }
  refresh();
}

function archiveCard(n) {
  const cat = catById(n.catId);
  const days = Math.max(0, Math.round((n.completedAt - n.createdAt) / DAY));
  const card = h('div.acard', { tabIndex: 0, title: 'Click to see the details' },
    h('div.atop', {},
      h('span.atick', { innerHTML: TICK_SVG.replace('class="tickpath"', 'class="tickpath" style="stroke-dashoffset:0"') }),
      h('div.atitle', {}, n.title || 'Untitled')),
    h('div.adates', {}, 'Created ' + fmtDY(n.createdAt) + '  →  Done ' + fmtDY(n.completedAt) + (days ? '  (' + days + (days === 1 ? ' day)' : ' days)') : '  (same day)')
      + (hasOwn(STATE.gifts.taskPts, n.id) ? '  ·  +' + ptsText(STATE.gifts.taskPts[n.id]) : '')),
    h('div.abot', {},
      cat ? h('span.minichip', {}, h('span.dot', { style: { background: palById(cat.color).bg, border: '1px solid ' + palById(cat.color).deep } }), cat.name) : null,
      (n.desc || '').trim() ? h('span.nmore', { title: 'Has a description' }, h('span'), h('span'), h('span')) : null,
      h('span.spacer'),
      h('button.btn.ghost.small', { title: 'Back to the canvas, unchecked', onclick: () => {
        undoableAction('“' + (n.title || 'Untitled') + '” is back on the canvas', () => { n.archived = false; n.completedAt = null; uncreditTask(n); });
        completionChanged();
      } }, 'Restore'),
      h('button.btn.danger.small', { onclick: () => {
        undoableAction('Deleted from archive', () => { STATE.notes = STATE.notes.filter(x => x.id !== n.id); });
        completionChanged();
      } }, 'Delete')));
  onRightClickDelete(card, n.title || 'this task', () => {
    undoableAction('Deleted from archive', () => { STATE.notes = STATE.notes.filter(x => x.id !== n.id); });
    completionChanged();
  });
  // The whole card opens the same expanded view the canvas uses, so a finished task can be
  // read back in full. The buttons along the bottom keep their own jobs.
  card.addEventListener('click', e => { if (!e.target.closest('button')) openNote(n.id); });
  card.addEventListener('keydown', e => {
    if (e.target !== card) return;                       // a button inside handles its own keys
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openNote(n.id); }
  });
  return card;
}

function repaintFriends() { if (friendsMount && friendsMount.isConnected) paintFriends(friendsMount); }
// The poll calls this. It used to skip whenever anything in the section held focus, which
// a button does after you click it: pressing "Add a friend" once left focus parked there
// and stopped every later refresh. Only a half-typed entry is worth protecting, and the
// section has none, so the guard now looks for one specifically.
function repaintFriendsIfSafe() {
  if (!friendsMount || !friendsMount.isConnected) return;

function agoText(iso) {
  const t = Date.parse(iso || '');
  if (!t) return 'a while ago';
  const s = Math.max(0, Date.now() - t);
  if (s < 90000) return 'just now';
  if (s < 3600000) return Math.round(s / 60000) + ' min ago';
  if (s < 86400000) return Math.round(s / 3600000) + ' h ago';
  return fmtD(t);
}
// Only picture hosts Google itself serves avatars from. A profile row is writable by its
// owner with any URL, and an arbitrary host would let one user turn everyone else's
// friend list into a beacon that pings their server.
function safeAvatarUrl(raw) {
  const s = safeUrl(raw);
  if (!s) return '';
  try {
    return /(^|\.)googleusercontent\.com$/i.test(new URL(s).hostname) ? s : '';
  } catch (e) { return ''; }
}
// Initials on a sticky-note color, with the Google picture layered on top when it loads.
function avatarEl(userId, size) {
  const name = displayName(userId);
  const initials = name.split(/\s+/).slice(0, 2).map(w => (w[0] || '')).join('').toUpperCase() || '?';
  let hash = 0;
  for (const ch of String(userId)) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  const el = h('span.favatar', { 'aria-hidden': 'true', style: { background: PAL[hash % PAL.length].bg } }, initials);
  if (size) { el.style.width = size + 'px'; el.style.height = size + 'px'; el.style.fontSize = Math.round(size * .38) + 'px'; }
  const p = profileOf(userId);
  const src = p ? safeAvatarUrl(p.avatar) : '';
  if (src) {
    const img = h('img', { src, alt: '', referrerPolicy: 'no-referrer' });
    img.addEventListener('error', () => img.remove());
    el.append(img);
  }

}
// Fetch everything again on demand, for when a friend says they have just ticked something

    let lastDay = '';
    for (const m of ms) {
      const t = Date.parse(m.created_at || '') || Date.now();
      const dk = dayKey(t);
      if (dk !== lastDay) { lastDay = dk; log.append(h('div.cday', {}, fmtFull(t))); }
      log.append(h('div.cmsg' + (m.sender === myId() ? '.me' : '.them'), { title: new Date(t).toLocaleString() }, m.body));
    }
    if (stick) log.scrollTop = log.scrollHeight;
  };
  paintLog(true);
  markConversationRead(fid);
  FR.chatWith = fid;
  FR.chatHook = paintLog;
  modalOnClose = () => { FR.chatWith = null; FR.chatHook = null; updateFriendBadge(); repaintFriends(); };
  const inp = h('input.input', { placeholder: 'Cheer them on…', maxLength: 2000, enterkeyhint: 'send' });
  const err = h('div.errline', { style: { marginTop: '6px' } });
  const sendBtn = h('button.btn.primary.small', { onclick: doSend }, 'Send');
  // Pressing Send must not take the focus off the box, or a phone drops its keyboard after
  // every message and will not raise it again on its own.
  sendBtn.addEventListener('pointerdown', e => e.preventDefault());
  async function doSend() {
    const text = inp.value.trim();
    if (!text) { inp.focus(); return; }
    sendBtn.disabled = true; err.textContent = '';
    const r = await sendFriendMessage(fid, text);
    sendBtn.disabled = false;
    if (!r.ok) { err.textContent = r.message || 'Could not send.'; return; }
    inp.value = '';
    paintLog(true);
    inp.focus();
  }
  // isComposing: the Enter that commits an IME conversion must not send half a word.
  // sendBtn.disabled: a held or repeated Enter must not send the same text twice.
  inp.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || imeBusy(e) || sendBtn.disabled) return;
    doSend();
  });
  const body = h('div.sbody', {},
    h('div.fid', { style: { marginBottom: '12px' } }, avatarEl(fid),
      h('span.fwho', {}, h('div.fname', { style: { fontSize: '16px' } }, displayName(fid)))),
    log,
    h('div.crow', {}, inp, sendBtn),
    err);
  const sheet = h('div.sheet', {}, h('div.ctab', { style: { background: 'var(--accent)' } }), body,
    h('div.sfoot', {},
      h('span', { style: { fontSize: '11.5px', color: 'var(--ink3)' } }, 'Messages refresh on their own'),
      h('button.btn.small', { onclick: closeModal }, 'Close')));
  root.append(h('div.overlay', { onclick: closeModal }), sheet);
  // Scroll only works once the log is really in the document and has a height.
  setTimeout(() => { log.scrollTop = log.scrollHeight; inp.focus(); }, 0);
}

// The one control that says what is holding a wish back: a run of finished tasks, a run of
// days on a daily goal, or nothing at all. Shared by the add form and the editor, so the
// two can never drift apart. Pass null for a wish that does not exist yet.
// Just the wish cards. Kept separate so that ticking a daily-goal cell can bring them up to
// date without rebuilding the sheet, which would throw its horizontal scroll back to today,
// and without clearing a half-typed new wish out of the form below them.
function renderWishes(box) {
  const list = box || $('#wishList');

}
function wishCondControls(w) {
  const habs = activeHabits();

  // activeHabits. It has to stay in this list: otherwise the control silently falls back to
  // "no goal, just a wish", and pressing Save writes that emptiness over the condition.
  const named = w && w.habitId && w.habitId !== '*' ? habitById(w.habitId) : null;
  const pick = named && !habs.some(x => x.id === named.id) ? habs.concat([named]) : habs;

    h('option', { value: '' }, 'no goal, just a wish'),
    STATE.goals.length ? h('optgroup', { label: 'Finish tasks' },

    pick.length ? h('optgroup', { label: 'Days in a row' },
      pick.map(hb => h('option', { value: 'h:' + hb.id }, 'days in a row of: ' + hb.name + (hb.archivedAt ? ' (retired)' : ''))),
      (pick.length > 1 || (w && w.habitId === '*')) ? h('option', { value: 'h:*' }, 'days in a row of: every daily goal') : null) : null);
  const days = h('input.input', { type: 'number', inputmode: 'numeric', min: 1, max: 365, style: { width: '78px' }, title: 'How many days in a row' });
  const daysWrap = h('span.wdays', {}, days, h('span.wdayslab', {}, 'days in a row'));
  sel.value = w && w.habitId ? 'h:' + w.habitId : (w && w.goalId ? 'g:' + w.goalId : '');
  if (sel.selectedIndex < 0) sel.value = '';   // whatever it named has since been deleted
  days.value = String(w ? wishStreakNeed(w) : 7);
  const sync = () => { daysWrap.style.display = sel.value.slice(0, 2) === 'h:' ? '' : 'none'; };
  sel.addEventListener('change', sync);
  sync();
  return {
    sel, daysWrap,
    read() {
      const v = sel.value;
      if (v.slice(0, 2) === 'g:') return { goalId: v.slice(2), habitId: null, streakDays: null };
      if (v.slice(0, 2) === 'h:') return { goalId: null, habitId: v.slice(2), streakDays: clamp(Math.round(Number(days.value) || 1), 1, 365) };

}
function wishCard(w) {
  const goal = STATE.goals.find(g => g.id === w.goalId) || null;
  // A wish is held back by days in a row, or by finished tasks, never by both.
  const byStreak = wishStreakOn(w);
  const need = wishStreakNeed(w), have = byStreak ? wishStreakNow(w) : 0;
  // A condition naming something that no longer exists is NOT the same as no condition.
  // Reading it as "unconditional" handed out the reward the moment a goal was deleted, or
  // the moment the last daily goal was retired under an "every daily goal" wish.
  const dangling = (!!w.goalId && !goal) || (!!w.habitId && !byStreak);
  const unlocked = dangling ? false : (byStreak ? have >= need : (!goal || goalMet(goal)));
  const link = safeUrl(w.url);
  const card = h('div.gcard.wcard' + (w.claimedAt ? '.claimed' : ''));

  // picture, when we can get one. A dead or placeholder image removes itself rather than
  // leaving a broken frame behind.
  const imgSrc = wishImageUrl(w);
  if (imgSrc) {
    // Not lazy: these are a few small thumbnails, and lazy ones below the fold sit
    // unloaded until scrolled to, which reads as a broken picture.
    const thumb = h('img.wthumb', { src: imgSrc, alt: '', referrerPolicy: 'no-referrer' });
    thumb.addEventListener('error', () => shell.remove());
    // Amazon answers unknown ids with a 1x1 transparent pixel, which loads "successfully".
    thumb.addEventListener('load', () => { if (thumb.naturalWidth <= 1 || thumb.naturalHeight <= 1) shell.remove(); });
    const shell = link
      ? h('a.wthumbwrap', { href: link, target: '_blank', rel: 'noopener noreferrer', title: 'Open ' + w.text }, thumb)
      : h('span.wthumbwrap', {}, thumb);
    card.append(shell);
  }

  const main = h('div.wmain');
  card.append(main);

  let stateEl = null;
  if (w.claimedAt) stateEl = h('span.wish-state', { style: { color: 'var(--ink3)' } }, 'Claimed ' + fmtD(w.claimedAt) + ' 🎉');
  else if (dangling) stateEl = h('span.wish-state.locked', {}, 'Waiting on a goal that no longer exists. Press ✎ to point it at another one.');
  else if (byStreak && unlocked) stateEl = h('span.wish-state.unlocked', {}, 'Unlocked by ' + need + ' days in a row!');
  else if (byStreak) stateEl = h('span.wish-state.locked', {}, have + ' of ' + need + ' days in a row (' + wishStreakName(w) + (habitById(w.habitId) && habitById(w.habitId).archivedAt ? ', retired' : '') + ')');
  else if (goal && unlocked) stateEl = h('span.wish-state.unlocked', {}, 'Unlocked by “' + goal.name + '”!');
  else if (goal) stateEl = h('span.wish-state.locked', {}, (goal.target - goalCount(goal)) + ' more task' + (goal.target - goalCount(goal) === 1 ? '' : 's') + ' to unlock (' + goal.name + ')');

  main.append(h('div.ghead', {},
    link
      ? h('a.gname.wlink', { href: link, target: '_blank', rel: 'noopener noreferrer' }, w.text)
      : h('span.gname', {}, w.text),
    !w.claimedAt && unlocked ? h('button.btn.primary.small', { onclick: e => {
      w.claimedAt = Date.now(); save();
      const r = e.target.getBoundingClientRect();
      confetti(r.left, r.top);
      renderGoals();
    } }, 'Claim it') : null,
    h('button.lnkbtn', { title: 'Edit name, link and picture', onclick: () => openWishLinkEditor(w) }, '✎'),
    h('button.xbtn', { title: 'Delete', onclick: () => undoableAction('Wish deleted', () => { STATE.wishes = STATE.wishes.filter(x => x.id !== w.id); }) }, '✕')));
  if (stateEl) main.append(h('div.gmeta', {}, stateEl));
  onRightClickDelete(card, w.text || 'this wish', () => {
    undoableAction('Wish deleted', () => { STATE.wishes = STATE.wishes.filter(x => x.id !== w.id); });
  });
  return card;
}

// Rename a wish, or attach and change its shop link and picture.
function openWishLinkEditor(w) {
  const root = $('#modalRoot');

  const urlIn = h('input.input.grow', Object.assign({ placeholder: 'https://www.amazon.com/dp/…', value: w.url || '', maxLength: 600 }, urlHints));
  const imgIn = h('input.input.grow', Object.assign({ placeholder: 'Picture link (optional, overrides the automatic one)', value: w.img || '', maxLength: 600 }, urlHints));
  const wc = wishCondControls(w);
  const preview = h('div.wprev');
  const note = h('div.setnote');
  // Each keystroke starts a new attempt. Stamp it, so a slow earlier image cannot come
  // back later and describe itself over the newer one.
  let paintGen = 0;
  const paint = () => {
    const gen = ++paintGen;
    preview.innerHTML = '';
    const nUrl = normalizeUrl(urlIn.value), nImg = normalizeUrl(imgIn.value);
    const src = nImg || amazonImageFor(nUrl);
    if (!src) {
      if (urlIn.value.trim() && !nUrl) note.textContent = 'That shop link is not a web address Dayu can open.';
      else if (imgIn.value.trim() && !nImg) note.textContent = 'That picture link is not a web address Dayu can open.';
      else if (!urlIn.value.trim()) note.textContent = 'Paste a shop link. Amazon product links find their own picture; for other shops, paste a picture link too.';
      else note.textContent = 'No picture found for that link. ' + (coarsePointer() ? 'Long-press' : 'Right-click') + ' the product image in your browser, copy its address, and paste it below.';
      return;
    }
    const im = h('img', { src, alt: '', referrerPolicy: 'no-referrer' });
    im.addEventListener('load', () => {
      if (gen !== paintGen) return;
      if (im.naturalWidth <= 1 || im.naturalHeight <= 1) { preview.innerHTML = ''; note.textContent = 'Amazon has no picture on file for that item. Paste a picture link below instead.'; }
      else note.textContent = 'This is how it will look.';
    });
    im.addEventListener('error', () => {
      if (gen !== paintGen) return;
      preview.innerHTML = ''; note.textContent = 'That picture would not load. Check the address, or leave it blank.';
    });
    preview.append(im);
    note.textContent = 'Loading the picture…';

  const commit = () => {
    if (!nameIn.value.trim()) { note.textContent = 'Give it a name so you know what you are working towards.'; nameIn.focus(); return; }
    // Refuse to close on something we would only throw away: say so and let them fix it.
