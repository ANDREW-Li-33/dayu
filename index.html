<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayu</title>
<style>
/* ---------- theme tokens ---------- */
:root{
  --paper:#F5F2E9; --dots:#DAD4C2; --surface:#FFFFFF; --raise:#FBFAF5;
  --ink:#17161B; --ink2:#5D5B64; --ink3:#93909B; --line:#E4E0D2; --line2:#D2CDBB;
  --accent:#2B3FD6; --accent-hover:#1F2FA8; --accent-ink:#FFFFFF; --accent-soft:rgba(43,63,214,.09);
  --good:#187A48; --warn:#B4790E; --danger:#C63A45; --danger-soft:rgba(198,58,69,.08);
  --shadow:0 1px 2px rgba(23,22,27,.07),0 8px 22px rgba(23,22,27,.11);
  --shadow-big:0 4px 10px rgba(23,22,27,.10),0 24px 60px rgba(23,22,27,.22);
  --note-ink:#262212; --note-ink2:rgba(38,34,18,.62);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1B20; --dots:#2C2B33; --surface:#26252C; --raise:#2C2B33;
    --ink:#F1EFE9; --ink2:#A9A6B1; --ink3:#77747F; --line:#37363F; --line2:#434250;
    --accent:#8D99FF; --accent-hover:#A9B2FF; --accent-ink:#12142B; --accent-soft:rgba(141,153,255,.13);
    --good:#53C98D; --warn:#E3B341; --danger:#F08089; --danger-soft:rgba(240,128,137,.10);
    --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.35);
    --shadow-big:0 4px 10px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#1C1B20; --dots:#2C2B33; --surface:#26252C; --raise:#2C2B33;
  --ink:#F1EFE9; --ink2:#A9A6B1; --ink3:#77747F; --line:#37363F; --line2:#434250;
  --accent:#8D99FF; --accent-hover:#A9B2FF; --accent-ink:#12142B; --accent-soft:rgba(141,153,255,.13);
  --good:#53C98D; --warn:#E3B341; --danger:#F08089; --danger-soft:rgba(240,128,137,.10);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.35);
  --shadow-big:0 4px 10px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.5);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.45; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

#app{height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
#topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:18px;
  height:54px; padding:0 16px; background:var(--surface);
  border-bottom:1px solid var(--line); position:relative; z-index:40;
}
.wordmark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.02em;user-select:none}
.wordmark .pin{width:20px;height:20px;display:block}
.tabs{display:flex;gap:2px}
.tab{
  padding:6px 12px;border-radius:8px;font-weight:600;color:var(--ink2);
  text-decoration:none;font-size:13.5px;
}
.tab:hover{color:var(--ink);background:var(--accent-soft)}
.tab.active{color:var(--accent);background:var(--accent-soft)}
#meters{margin-left:auto;display:flex;align-items:center;gap:14px}
.meter{display:flex;flex-direction:column;gap:3px;min-width:96px;cursor:pointer;border-radius:6px;padding:2px 4px}
.meter:hover{background:var(--accent-soft)}
.meter .mlabel{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.meter .mrow{display:flex;align-items:center;gap:6px}
.meter .mtrack{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.meter .mfill{height:100%;border-radius:4px;background:var(--accent);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.meter .mnum{font-size:11px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter.pulse .mfill{animation:mpulse .5s ease}
@keyframes mpulse{50%{filter:brightness(1.4)}}
#menuBtn{width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1;color:var(--ink2)}
#menuBtn:hover{background:var(--accent-soft);color:var(--ink)}
#menuPop{
  position:absolute;top:50px;right:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-big);padding:6px;min-width:200px;display:none;z-index:60;
}
#menuPop.open{display:block}
#menuPop button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-weight:500}
#menuPop button:hover{background:var(--accent-soft)}
#menuPop .sep{height:1px;background:var(--line);margin:5px 8px}
#menuPop .danger{color:var(--danger)}

/* ---------- pages ---------- */
main{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none}
.page.active{display:block}
.doc{height:100%;overflow-y:auto;padding:32px 20px 80px}
.doc-inner{max-width:920px;margin:0 auto}
.doc h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;text-wrap:balance}
.doc .sub{color:var(--ink2);margin-bottom:24px}

/* ---------- canvas ---------- */
/* The board is the window; the field is an unbounded plane moved under it by transform,
   so notes and clusters can sit at any coordinate, negative included. */
#board{
  position:absolute;inset:0;overflow:hidden;z-index:0; /* own stacking context, so raised notes stay under the toolbar */
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);
  background-size:24px 24px;
  cursor:grab;
  touch-action:none; /* drags on the canvas are ours: panning is done in script */
}
#board.panready{cursor:grab}
#board.panning{cursor:grabbing;user-select:none}
#board.drawing{cursor:crosshair}
#field{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.hint{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  color:var(--ink3);font-size:15px;text-align:center;pointer-events:none;user-select:none;
}
.hint b{color:var(--ink2)}

/* zones: the area itself lets pointers through so the canvas can be panned across it */
.zone{position:absolute;border-radius:14px;z-index:1;pointer-events:none}
.zone .zbg{position:absolute;inset:0;border-radius:14px;opacity:.10;pointer-events:none;transition:opacity .15s ease}
.zone.moving .zbg{opacity:.2}
.zone.moving .zborder{opacity:.85}
.zone .zborder{position:absolute;inset:0;border-radius:14px;border:1.5px dashed;opacity:.55;pointer-events:none}
.zone .zhead{
  position:absolute;top:-1px;left:10px;transform:translateY(-50%);
  display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:12px;font-weight:700;cursor:grab;user-select:none;white-space:nowrap;
  pointer-events:auto;
}
.zone .zhead:active{cursor:grabbing}
.zone .zcount{font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.zone .zdel{width:16px;height:16px;border-radius:50%;font-size:11px;line-height:1;color:var(--ink3);display:none;align-items:center;justify-content:center}
.zone .zhead:hover .zdel{display:flex}
.zone .zdel:hover{background:var(--danger-soft);color:var(--danger)}
.zone .zresize{position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;cursor:nwse-resize;border-radius:4px;pointer-events:auto}
.zone .zresize::after{content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);border-radius:1px}
#drawPreview{position:absolute;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:14px;z-index:5;display:none;pointer-events:none}

/* notes */
.note{
  position:absolute;width:178px;min-height:64px;padding:10px 12px 9px 34px;
  border-radius:3px 10px 3px 3px;color:var(--note-ink);
  box-shadow:0 1px 2px rgba(23,22,27,.14),0 5px 12px rgba(23,22,27,.14);
  cursor:grab;user-select:none;touch-action:none;
  transition:box-shadow .15s ease, transform .15s ease;
}
.note:hover{box-shadow:0 2px 4px rgba(23,22,27,.16),0 10px 22px rgba(23,22,27,.2)}
.note.dragging{cursor:grabbing;transform:scale(1.04) rotate(-.6deg);box-shadow:0 6px 14px rgba(23,22,27,.2),0 18px 40px rgba(23,22,27,.28);z-index:999}
.note .chk{
  position:absolute;left:8px;top:9px;width:19px;height:19px;border-radius:50%;
  border:2px solid var(--note-ink2);background:rgba(255,255,255,.4);padding:0;
  display:flex;align-items:center;justify-content:center;
}
.note .chk svg{width:11px;height:11px;display:block}
.note .chk .tickpath{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14}
.note .chk:hover{border-color:var(--note-ink)}
.note .ntitle{font-size:13.5px;font-weight:600;line-height:1.3;word-wrap:break-word;white-space:pre-wrap}
.note .ntitle:empty::before{content:"Untitled";opacity:.4}
.note .nmeta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10.5px;font-weight:700;color:var(--note-ink2)}
.note .nmeta:empty{display:none}
.note .ncat{letter-spacing:.05em;text-transform:uppercase;font-size:9.5px}
.note .nsteps{font-variant-numeric:tabular-nums}
.note.done{opacity:.55}
.note.done .ntitle{text-decoration:line-through;text-decoration-thickness:1.5px}
.note.done .chk{background:var(--good);border-color:var(--good)}
.note.done .chk .tickpath{animation:tick .3s ease forwards}
@keyframes tick{to{stroke-dashoffset:0}}
.note.flyoff{transition:transform .5s cubic-bezier(.5,0,.9,.4),opacity .5s ease;opacity:0 !important;pointer-events:none}
.note textarea{
  width:100%;background:transparent;border:none;resize:none;outline:none;
  font-size:13.5px;font-weight:600;line-height:1.3;color:var(--note-ink);overflow:hidden;
}
.dropchip{
  position:fixed;z-index:1200;padding:5px 12px;border-radius:999px;background:var(--ink);color:var(--paper);
  font-size:12px;font-weight:700;pointer-events:none;animation:chipin 1.1s ease forwards;white-space:nowrap;
}
@keyframes chipin{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* toolbar */
#toolbar{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  display:flex;gap:4px;padding:5px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow-big);z-index:30;
}
#toolbar button{
  display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;
}
#toolbar button:hover{background:var(--accent-soft)}
#toolbar button.primary{background:var(--accent);color:var(--accent-ink)}
#toolbar button.primary:hover{background:var(--accent-hover)}
#toolbar button.on{background:var(--ink);color:var(--paper)}
#toolbar svg{width:15px;height:15px}

/* ---------- shared controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;
  font-weight:700;font-size:13px;border:1px solid var(--line2);background:var(--surface);
}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:7px}
.input,select.input{
  padding:7px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);
  font-size:13.5px;min-width:0;
}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.input::placeholder{color:var(--ink3)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  border:1px solid var(--line2);font-size:12px;font-weight:700;background:var(--surface);
}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.label{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* ---------- modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.open{display:block}
.overlay{position:absolute;inset:0;background:rgba(23,22,27,.35);animation:fadein .15s ease}
@keyframes fadein{from{opacity:0}}
.sheet{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 32px));max-height:min(680px,calc(100vh - 48px));
  background:var(--surface);border-radius:16px;box-shadow:var(--shadow-big);
  display:flex;flex-direction:column;overflow:hidden;animation:sheetin .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes sheetin{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}}
.sheet .ctab{height:6px;flex:0 0 auto}
.sheet .sbody{padding:20px 24px 22px;overflow-y:auto}
.sheet .srow{display:flex;align-items:flex-start;gap:12px}
.sheet .bigchk{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line2);margin-top:4px;display:flex;align-items:center;justify-content:center;padding:0}
.sheet .bigchk:hover{border-color:var(--good)}
.sheet .bigchk.done{background:var(--good);border-color:var(--good)}
.sheet .bigchk svg{width:13px;height:13px}
.sheet .bigchk .tickpath{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sheet .ttl{
  flex:1;border:none;outline:none;background:transparent;resize:none;overflow:hidden;
  font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.25;
}
.sheet .desc{
  width:100%;border:none;outline:none;background:transparent;resize:none;overflow:hidden;
  color:var(--ink2);font-size:13.5px;margin:6px 0 0 38px;max-width:calc(100% - 38px);
}
.sheet .sec{margin-top:20px}
.sheet .sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:8px}
.step:hover{background:var(--accent-soft)}
.step .schk{flex:0 0 auto;width:17px;height:17px;border-radius:50%;border:2px solid var(--line2);padding:0;display:flex;align-items:center;justify-content:center}
.step .schk.done{background:var(--good);border-color:var(--good)}
.step .schk svg{width:9px;height:9px}
.step .schk .tickpath{stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.step input[type=text]{flex:1;border:none;outline:none;background:transparent;font-size:13.5px}
.step.done input[type=text]{text-decoration:line-through;color:var(--ink3)}
.step .sdel{color:var(--ink3);font-size:14px;width:22px;height:22px;border-radius:6px;visibility:hidden}
.step:hover .sdel{visibility:visible}
.step .sdel:hover{color:var(--danger);background:var(--danger-soft)}
.addstep{display:flex;gap:9px;align-items:center;padding:5px 6px}
.addstep .plus{color:var(--ink3);width:17px;text-align:center;font-weight:700}
.addstep input{flex:1;border:none;outline:none;background:transparent;font-size:13.5px}
.ainote{margin-top:8px;font-size:11.5px;color:var(--ink3);font-style:italic}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.newcat{display:flex;gap:6px;margin-top:8px}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.meta .mitem{display:flex;flex-direction:column;gap:2px}
.meta .mval{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.sfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--raise)}
.sfoot .screated{font-size:11.5px;font-weight:700;color:var(--ink3)}

/* ---------- archive ---------- */
.filters{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.filters .frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .grow{flex:1;min-width:180px}
.count{color:var(--ink2);font-size:13px;margin-bottom:12px}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.acard .atop{display:flex;align-items:flex-start;gap:8px}
.acard .atick{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--good);display:flex;align-items:center;justify-content:center;margin-top:1px}
.acard .atick svg{width:9px;height:9px}
.acard .atitle{font-weight:700;font-size:14px;line-height:1.3;flex:1}
.acard .adates{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.acard .abot{display:flex;align-items:center;gap:8px;margin-top:2px}
.acard .spacer{flex:1}
.minichip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.minichip .dot{width:7px;height:7px;border-radius:50%}
.aisec{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.aisec .frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.aiout{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--raise);border:1px solid var(--line);white-space:pre-wrap;font-size:13.5px;display:none}
.aiout.show{display:block}

/* prompts modal list */
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pitem .phead{display:flex;align-items:center;gap:8px}
.pitem .pname{font-weight:700;flex:1}
.pitem .ptext{color:var(--ink2);font-size:12.5px;margin-top:4px}
.pedit{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pedit textarea{min-height:60px;resize:vertical}

/* ---------- goals ---------- */
.gsplit{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:760px){.gsplit{grid-template-columns:1fr}}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.gcard .ghead{display:flex;align-items:center;gap:8px}
.gcard .gname{font-weight:700;flex:1}
.gcard .gmeta{font-size:12px;color:var(--ink2);margin-top:2px}
.gcard .gbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.gcard .gtrack{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gcard .gfill{height:100%;border-radius:4px;background:var(--accent);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.gcard .gfill.full{background:var(--good)}
.gcard .gnum{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.gcard.donegoal{border-color:var(--good)}
.gdone-tag{display:inline-flex;align-items:center;gap:5px;color:var(--good);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pinbtn{width:26px;height:26px;border-radius:7px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.pinbtn:hover{background:var(--accent-soft)}
.pinbtn.on{color:var(--accent)}
.xbtn{width:26px;height:26px;border-radius:7px;color:var(--ink3);font-size:15px}
.xbtn:hover{color:var(--danger);background:var(--danger-soft)}
.newform{background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.newform .frow{display:flex;gap:8px;flex-wrap:wrap}
.wish-state{font-size:12px;font-weight:700}
.wish-state.locked{color:var(--ink3)}
.wish-state.unlocked{color:var(--accent)}
.claimed .gname{text-decoration:line-through;color:var(--ink3)}

/* wishlist cards with a product picture */
.gcard.wcard{display:flex;gap:12px;align-items:flex-start}
.wthumbwrap{
  flex:0 0 auto;display:block;width:58px;height:58px;border-radius:9px;overflow:hidden;
  background:var(--raise);border:1px solid var(--line);
}
a.wthumbwrap:hover{border-color:var(--accent)}
.wthumb{width:100%;height:100%;object-fit:contain;display:block}
.wmain{flex:1;min-width:0}

'use strict';
/* ================= Tack — core ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2) + Date.now());

// dom builder: h('div.cls', {attrs/on*}, children...)
function h(spec, props, ...kids) {
  const [tag, ...classes] = spec.split('.');
  const el = document.createElement(tag || 'div');
  if (classes.length) el.className = classes.join(' ');
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') Object.assign(el.style, v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k in el && k !== 'list') { try { el[k] = v; } catch (e) { el.setAttribute(k, v); } }
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));

const TICK_SVG = '<svg viewBox="0 0 14 14" aria-hidden="true"><path class="tickpath" d="M2.5 7.5l3 3 6-7"/></svg>';

/* ---------- sticky palette (fixed, not themed — stickies are physical) ---------- */
const PAL = [
  { id: 'yellow', name: 'Lemon',  bg: '#FFE97D', deep: '#7A6000' },
  { id: 'rose',   name: 'Rose',   bg: '#FFC9D4', deep: '#96324B' },
  { id: 'peach',  name: 'Peach',  bg: '#FFD8AC', deep: '#8F520D' },
  { id: 'mint',   name: 'Mint',   bg: '#BEE9C8', deep: '#1D663F' },
  { id: 'sky',    name: 'Sky',    bg: '#BDDFFF', deep: '#1B5795' },
  { id: 'lilac',  name: 'Lilac',  bg: '#DCCEFF', deep: '#5F3BA1' },
];
const palById = id => PAL.find(p => p.id === id) || PAL[0];
const DEFAULT_NOTE_BG = PAL[0].bg;

/* ---------- dates ---------- */
const DAY = 86400000;
const fmtD = ts => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtDY = ts => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
const fmtFull = ts => new Date(ts).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function startOfWeek(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); } // Monday
function inPeriod(ts, period) {
  const now = Date.now();
  if (period === 'day') return startOfDay(ts) === startOfDay(now);
  if (period === 'week') return ts >= startOfWeek(now);
  if (period === 'month') { const a = new Date(ts), b = new Date(now); return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear(); }
  return true;

const PERIOD_LABEL = { day: 'today', week: 'this week', month: 'this month', all: 'all-time' };

/* ---------- storage adapter ---------- */
const STORE_KEY = 'dayu-state-v1';
const LEGACY_STORE_KEY = 'tack-state-v1';
let storageOK = true;
const memStore = {};
function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { storageOK = false; return memStore[k] || null; } }

/* ---------- state ---------- */
let STATE = null;
let saveTimer = null;
function save() {
  if (STATE.meta) STATE.meta.updatedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => storeSet(STORE_KEY, JSON.stringify(STATE)), 250);

function blankState() {
  return {
    v: 5, notes: [], cats: [], zones: [], prompts: [], goals: [], wishes: [], habits: [], zTop: 10,
    ai: { key: '', model: 'gemini-flash-latest', lastVersion: '' },
    meta: { updatedAt: Date.now() },

}
function dashPromptSeeds() {
  return [
    { id: uid(), scope: 'dashboard', name: 'What could be better?', text: 'Look at my daily goal tracking. Tell me directly what could be improved: which goals slip most, which days are weak, and one concrete change to try. No fluff.' },
    { id: uid(), scope: 'dashboard', name: 'Pep talk', text: 'Review my goal tracking and give me a short, honest pep talk: call out real wins and streaks, then one nudge for tomorrow.' },

// adoptLocal is true ONLY for the board loaded out of this browser's own storage.
// A pulled remote board or an imported backup belongs to some other context, and must

/* ---------- links & product images ---------- */
// Only ever hand http(s) to an href or img src: a pasted "javascript:" string must never
// become a live link.
function safeUrl(raw) {
  const s = String(raw || '').trim();
  if (!s) return '';
  try {
    const u = new URL(s);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
  } catch (e) { return ''; }
}
// True only when "amazon" is the registrable name, so amazon.com and amazon.co.uk count
// while a lookalike such as amazon.evil.com or www.amazon.com.evil.com does not.
const SECOND_LEVEL = ['co', 'com', 'net', 'org'];
function isAmazonHost(host) {
  const p = String(host || '').toLowerCase().split('.');
  if (p.length < 2) return false;
  if (p[p.length - 2] === 'amazon') return true;                                  // amazon.com, amazon.de
  return p.length >= 3 && p[p.length - 3] === 'amazon' && SECOND_LEVEL.indexOf(p[p.length - 2]) >= 0; // amazon.co.uk
}
// What someone types is rarely a perfect URL. "amazon.com/dp/X" means https, so treat it
// that way; anything carrying a scheme we do not serve is still refused outright.
function normalizeUrl(raw) {
  const s = String(raw || '').trim();
  if (!s) return '';
  const direct = safeUrl(s);
  if (direct) return direct;
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return ''; // had a scheme, and it was not http(s)
  const guessed = safeUrl('https://' + s.replace(/^\/+/, ''));
  if (!guessed) return '';
  // Only supply the scheme when what came before the first slash is really a domain,
  // so a sentence typed into the box is rejected rather than becoming a dead link.
  try {
    if (!/^[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$/i.test(new URL(guessed).hostname)) return '';
  } catch (e) { return ''; }
  return guessed;
}
// Amazon puts the product id (ASIN) in the path: /dp/XXXX, /gp/product/XXXX, /product/XXXX.
function amazonAsin(url) {
  const s = safeUrl(url);
  if (!s) return '';
  let host;
  try { host = new URL(s).hostname; } catch (e) { return ''; }
  if (!isAmazonHost(host)) return '';
  const m = s.match(/\/(?:dp|gp\/product|product|gp\/aw\/d)\/([A-Z0-9]{10})(?:[/?]|$)/i);
  return m ? m[1].toUpperCase() : '';
}

// returns a 1x1 placeholder for the rest, which the <img> load handler screens out.
function amazonImageFor(url) {
  const asin = amazonAsin(url);
  return asin ? 'https://m.media-amazon.com/images/P/' + asin + '.01._SCLZZZZZZZ_.jpg' : '';
}
function wishImageUrl(w) {
  return safeUrl(w.img) || amazonImageFor(w.url) || '';
}

async function gemini(prompt) {

  }
  if (r.status === 400 || r.status === 401 || r.status === 403) {

    if (/api key/i.test(msg) || r.status === 401 || r.status === 403) {

      throw { code: 'key' };

  }
  if (r.status === 503) throw { code: 'busy' };
  if (r.status === 404) {
    let msg = '';
    try { msg = ((await r.json()).error || {}).message || ''; } catch (e) { /* ignore */ }
    showNotice('gem-model', 'That model is not available to this key: ' + (msg || model) + ' Pick another one in Settings.');
    throw { code: 'model' };
  }
  if (!r.ok) throw { code: 'http' + r.status };
  const j = await r.json();
  let text = '';
  try { text = j.candidates[0].content.parts.map(p => p.text || '').join(''); } catch (e) { /* empty */ }
  if (!text.trim()) throw { code: 'empty' };
  // Record which concrete version answered, since the -latest aliases move over time.
  // Re-read the config: a sync pull may have replaced STATE while this request was in flight.
  const cur = aiCfg();
  if (j.modelVersion && j.modelVersion !== cur.lastVersion) { cur.lastVersion = j.modelVersion; save(); }

}

    + '&code_challenge=' + challenge + '&code_challenge_method=s256';
  return { ok: true };
}
// Turn provider jargon into something a person can act on.
function explainAuthError(raw) {
  const s = String(raw || '');
  if (/unable to exchange external code/i.test(s)) {
    return 'Google refused the hand-off. The Client Secret saved in Supabase does not match the Google OAuth client. Copy the secret again from Google Cloud (APIs & Services, Credentials, your Web application client) and paste it into Supabase under Authentication, Sign In / Providers, Google.';
  }
  if (/redirect_uri_mismatch/i.test(s)) {
    return 'Google rejected the callback address. In Google Cloud, the client\'s Authorized redirect URI must be exactly the callback URL shown in Supabase\'s Google provider panel.';
  }
  if (/provider is not enabled|unsupported provider/i.test(s)) {
    return 'Google sign-in is switched off for this project. Enable the Google provider in Supabase.';
  }
  if (/access_denied/i.test(s)) {
    return 'Sign-in was cancelled, or this Google account is not on the test-user list while the consent screen is in Testing mode.';
  }
  if (/bad_oauth_state|flow state|state/i.test(s) && /expired|not found|invalid/i.test(s)) {
    return 'That sign-in attempt expired. Try Continue with Google once more.';
  }
  return s;
}
// On load: finish an OAuth redirect if one is in the URL (PKCE ?code=, or implicit #access_token=)
function clearPending() { storeSet('dayu-oauth-pending', ''); }
function cleanUrl(keepHash) {
  try { history.replaceState(null, '', location.pathname + (keepHash ? location.hash : '')); } catch (e) { /* sandboxed */ }
}
async function handleAuthRedirect() {
  let pending = null;
  try { pending = JSON.parse(storeGet('dayu-oauth-pending') || 'null'); } catch (e) { pending = null; }
  try {
    const qs = new URLSearchParams(location.search);

    // 1. PKCE: Supabase sent us back with an auth code.
    if (qs.get('code') && sbConfigured()) {
      const verifier = storeGet('dayu-pkce') || '';
      cleanUrl(true);
      clearPending();
      if (!verifier) {
        showNotice('sb-oauth', 'Sign-in could not finish: this browser lost the security code, which happens if sign-in started in a different browser or a private window. Try Continue with Google once more.');
        return;
      }
      const r = await fetch(CFG.sbUrl + '/auth/v1/token?grant_type=pkce', {
        method: 'POST',
        headers: { apikey: CFG.sbAnon, 'Content-Type': 'application/json' },
        body: JSON.stringify({ auth_code: qs.get('code'), code_verifier: verifier }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.access_token) {
        applySession(j.access_token, j.refresh_token);
        toast('Signed in' + (CFG.sbEmail ? ' as ' + CFG.sbEmail : ''));
      } else {
        showNotice('sb-oauth', 'Google sign-in failed. ' + explainAuthError(j.error_description || j.msg || j.error || ('HTTP ' + r.status)));
      }
      return;
    }

    // 2. Implicit flow tokens, or an error, in the hash.
    if (location.hash.indexOf('access_token=') >= 0 || location.hash.indexOf('error=') >= 0) {
      const hs = new URLSearchParams(location.hash.replace(/^#\/?/, ''));
      if (hs.get('access_token')) {
        applySession(hs.get('access_token'), hs.get('refresh_token') || '');
        clearPending(); cleanUrl(false);
        toast('Signed in' + (CFG.sbEmail ? ' as ' + CFG.sbEmail : ''));
        return;
      }
      if (hs.get('error') || hs.get('error_description')) {
        showNotice('sb-oauth', 'Google sign-in failed. ' + explainAuthError(hs.get('error_description') || hs.get('error')));
        clearPending(); cleanUrl(false);
        return;
      }
    }

    // 3. An error came back on the query string.
    if (qs.get('error') || qs.get('error_description')) {
      showNotice('sb-oauth', 'Google sign-in failed. ' + explainAuthError(qs.get('error_description') || qs.get('error')));
      clearPending(); cleanUrl(true);
      return;
    }

    // 4. We left for Google recently and came back with nothing at all. That means the
    //    provider redirected somewhere else: this page's address is not on the allow list.
    if (pending && pending.at && Date.now() - pending.at < 20 * 60 * 1000 && !CFG.sbRefresh) {
      clearPending();
      showNotice('sb-redirect', 'Sign-in bounced back without completing. In Supabase go to Authentication, URL Configuration, and add this exact address to Redirect URLs: ' + (pending.redirect || location.href));
    }
  } catch (e) {
    clearPending();
    showNotice('sb-oauth', 'Sign-in hit an unexpected error: ' + (e && e.message ? e.message : String(e)));
  }
}
async function sbRefreshToken() {
  let r;
  try {
    r = await fetch(CFG.sbUrl + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: CFG.sbAnon, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: CFG.sbRefresh }),
    });
  } catch (e) {
    // No network. Being offline is not a reason to sign someone out; keep the token.
    syncStatus('off');
    return false;
  }
  if (r.status >= 500 || r.status === 429) { syncStatus('off', 'Sync service busy'); return false; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) {
    // The server genuinely rejected this token, so it is spent.
    SB.access = null; CFG.sbRefresh = ''; saveCfg();
    syncStatus('signin');
    showNotice('sb-signin', 'Sync sign-in expired. Open Settings (⋯ menu) and sign in again.');
    return false;
  }
  SB.access = j.access_token;
  if (j.refresh_token) { CFG.sbRefresh = j.refresh_token; saveCfg(); }
  return true;
}
function sbSignOut() {
  SB.access = null; CFG.sbRefresh = ''; CFG.sbEmail = '';
  storeSet(WELCOME_KEY, '1'); // someone who found the sign-out button does not need the intro again
  saveCfg(); syncStatus('signin');
}
function schedulePush() {
  if (!sbConfigured() || (!SB.access && !CFG.sbRefresh)) return;
  clearTimeout(SB.pushTimer);
  SB.pushTimer = setTimeout(() => syncNow(), 2000);
}
let syncing = false;
async function syncNow() {
  if (!sbConfigured()) { syncStatus('local'); return; }
  if (!SB.access) {
    if (CFG.sbRefresh) { if (!await sbRefreshToken()) return; }
    else { syncStatus('signin'); return; }
  }
  if (syncing) return;
  syncing = true;
  syncStatus('busy');
  try {
    const r = await sbFetch('/rest/v1/dayu_state?id=eq.main&select=data,updated_at');
    if (r.status === 401) { syncStatus('signin'); return; }
    if (!r.ok) { syncStatus('err', 'Pull failed: HTTP ' + r.status); return; }
    const rows = await r.json();
    SB.lastPull = Date.now();
    const remote = rows && rows[0];
    const localTs = (STATE.meta && STATE.meta.updatedAt) || 0;
    const remoteTs = remote ? Date.parse(remote.updated_at) : 0;
    // Never swap the board out from under an open sheet: the user may be mid-edit in it.
    const busy = modalNoteId || $('#modalRoot').classList.contains('open') || zoneDragging;
    if (remote && remoteTs > localTs + 500 && !busy) {
      STATE = migrate(remote.data, false);
      STATE.meta.updatedAt = remoteTs;
      storeSet(STORE_KEY, JSON.stringify(STATE));
      renderAll();
      CFG.lastSyncAt = Date.now(); saveCfg();
      syncStatus('ok');
    } else if (!remote || localTs > remoteTs + 500) {
      const pr = await sbFetch('/rest/v1/dayu_state', {
        method: 'POST',
        headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{ id: 'main', data: STATE, updated_at: new Date(localTs || Date.now()).toISOString() }]),
      });
      if (pr.ok) { CFG.lastSyncAt = Date.now(); saveCfg(); syncStatus('ok'); }
      else syncStatus('err', 'Push failed: HTTP ' + pr.status);
    } else {
      syncStatus('ok');
    }
  } catch (e) {
    syncStatus('off');
    if (!storageOK) showNotice('sandbox', 'This preview page can’t reach the internet, so AI and sync are off here. They work when Tack runs locally or on your own hosting.');
  } finally {
    syncing = false;
  }
}
function initSync() {
  syncStatus(sbConfigured() ? (CFG.sbRefresh ? 'busy' : 'signin') : 'local');
  if (sbConfigured() && CFG.sbRefresh) syncNow();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && sbConfigured() && Date.now() - SB.lastPull > 30000) syncNow();
  });
}

'use strict';
/* ================= Tack — canvas, notes, zones, modal ================= */
const NOTE_W = 178;
let drawMode = false;

function catById(id) { return STATE.cats.find(c => c.id === id) || null; }
function noteById(id) { return STATE.notes.find(n => n.id === id) || null; }
function zoneCat(z) { return catById(z.catId); }
function notesInCat(catId) { return STATE.notes.filter(n => !n.archived && n.catId === catId); }

function noteBg(n) { const c = catById(n.catId); return c ? palById(c.color).bg : DEFAULT_NOTE_BG; }

/* ---------- canvas render ---------- */
function renderCanvas() {
  const field = $('#field'), board = $('#board');
  $$('.note, .zone, .zonepop', field).forEach(el => el.remove());
  $$('.hint', board).forEach(el => el.remove());

  for (const z of STATE.zones) field.append(buildZone(z));
  const live = STATE.notes.filter(n => !n.archived);
  for (const n of live) field.append(buildNote(n));

  // The hint belongs to the window, not the plane, so it stays put while you pan.
  if (!live.length && !STATE.zones.length) {
    board.append(h('div.hint', {},
      h('div', { style: { fontSize: '34px', marginBottom: '10px' } }, '📌'),
      h('div', {}, h('b', {}, 'Double-click anywhere'), ' to pin your first note.'),
      h('div', { style: { marginTop: '4px' } }, 'Then draw a cluster and drag notes into it.')));
  }
}

/* ---------- zones ---------- */
function buildZone(z) {
  const cat = zoneCat(z), pal = palById(cat ? cat.color : 'sky');
  const el = h('div.zone', { dataset: { id: z.id }, style: { left: z.x + 'px', top: z.y + 'px', width: z.w + 'px', height: z.h + 'px' } },
    h('div.zbg', { style: { background: pal.deep } }),
    h('div.zborder', { style: { borderColor: pal.deep } }),
    h('div.zhead', {},
      h('span.dot', { style: { width: '8px', height: '8px', borderRadius: '50%', background: pal.deep, flex: '0 0 auto' } }),
      h('span', {}, cat ? cat.name : '?'),
      h('span.zcount', {}, String(notesInCat(z.catId).length)),
      h('button.zdel', { title: 'Remove this area (notes keep their category)', onclick: e => { e.stopPropagation(); removeZone(z.id); } }, '✕')),
    h('div.zresize', { title: 'Resize' }));

  // move zone by its name tag (its empty interior works too, handled on the field)
  const head = $('.zhead', el);
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('.zdel') || e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    startZoneDrag(z, e, head);
  });
  // resize
  const rz = $('.zresize', el);
  rz.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    dragXY(e, rz, (dx, dy) => {
      z.w = Math.max(130, z.w + dx); z.h = Math.max(100, z.h + dy); // no upper bound, only a floor
      el.style.width = z.w + 'px'; el.style.height = z.h + 'px';
    }, () => save());
  });
  return el;
}
// Everything sitting inside the area right now, by position rather than by category,
// so what moves with a cluster is exactly what you can see inside it.
function notesInsideZone(z) {
  const out = [];
  for (const n of STATE.notes) {
    if (n.archived) continue;
    const el = $('.note[data-id="' + n.id + '"]');
    const halfH = el ? el.offsetHeight / 2 : 32;
    const cx = n.x + NOTE_W / 2, cy = n.y + halfH;
    if (cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h) out.push({ n, el, x0: n.x, y0: n.y });
  }
  return out;
}
// Drag a cluster and carry its contents. `grabEl` is whatever received the pointer.
function startZoneDrag(z, e, grabEl) {
  const el = $('.zone[data-id="' + z.id + '"]');
  if (!el) return;
  const riders = notesInsideZone(z);
  const zx0 = z.x, zy0 = z.y;
  const sx = e.clientX, sy = e.clientY;
  let moved = false;
  zoneDragging = true;
  try { grabEl.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
  const place = (dx, dy) => {
    z.x = zx0 + dx; z.y = zy0 + dy;
    el.style.left = z.x + 'px'; el.style.top = z.y + 'px';
    for (const r of riders) {
      r.n.x = r.x0 + dx; r.n.y = r.y0 + dy;
      if (r.el) { r.el.style.left = r.n.x + 'px'; r.el.style.top = r.n.y + 'px'; }
    }
  };
  const mv = ev => {
    if (ev.pointerId !== e.pointerId) return;
    const rawX = ev.clientX - sx, rawY = ev.clientY - sy;
    if (!moved) {
      if (Math.abs(rawX) + Math.abs(rawY) < 4) return;
      moved = true;
      el.classList.add('moving');
    }
    if (ev.cancelable) ev.preventDefault();
    place(rawX / zoom, rawY / zoom);
  };
  const teardown = () => {
    zoneDragging = false;
    grabEl.removeEventListener('pointermove', mv);
    grabEl.removeEventListener('pointerup', up);
    grabEl.removeEventListener('pointercancel', cancel);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', cancel);
    el.classList.remove('moving');
    try { grabEl.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
  };
  const up = ev => {
    if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
    teardown();
    if (moved) save();
  };
  // An interrupted gesture (the browser claiming it, a call taking over the screen) is
  // not a decision to move anything, so put everything back.
  const cancel = ev => {
    if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
    if (moved) place(0, 0);
    moved = false;
    teardown();
  };
  grabEl.addEventListener('pointermove', mv);
  grabEl.addEventListener('pointerup', up);
  grabEl.addEventListener('pointercancel', cancel);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', cancel);
}
function removeZone(id) {
  undoableAction('Cluster area removed. Notes kept their category', () => {
    STATE.zones = STATE.zones.filter(z => z.id !== id);
  });
}
// generic incremental drag helper: cb gets deltas since last move, in logical (unzoomed) px
function dragXY(e, elm, onMove, onUp) {
  let lx = e.clientX, ly = e.clientY;
  try { elm.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
  const mv = ev => { onMove((ev.clientX - lx) / zoom, (ev.clientY - ly) / zoom); lx = ev.clientX; ly = ev.clientY; };
  const up = () => { elm.removeEventListener('pointermove', mv); elm.removeEventListener('pointerup', up); elm.removeEventListener('pointercancel', up); if (onUp) onUp(); };
  elm.addEventListener('pointermove', mv);
  elm.addEventListener('pointerup', up);
  elm.addEventListener('pointercancel', up);
}

/* ---------- notes ---------- */
function buildNote(n) {
  const el = h('div.note', { dataset: { id: n.id }, style: { left: n.x + 'px', top: n.y + 'px', background: noteBg(n), zIndex: n.z || 10 } });
  if (n.completedAt) el.classList.add('done');

  const chk = h('button.chk', { title: n.completedAt ? 'Not done after all' : 'Done: sends it to the archive', innerHTML: TICK_SVG, onclick: e => { e.stopPropagation(); toggleDone(n.id); } });
  el.append(chk);

  if (n.editing) {
    const ta = h('textarea', { rows: 2, placeholder: 'What needs doing?', value: n.title });
    const commit = () => {
      delete n.editing;
      n.title = ta.value.trim();
      if (!n.title) STATE.notes = STATE.notes.filter(x => x.id !== n.id);
      save(); renderCanvas();
    };
    ta.addEventListener('blur', commit);
    ta.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); ta.blur(); }
      if (ev.key === 'Escape') { ta.value = n.title; ta.blur(); }
      ev.stopPropagation();
    });
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
    ta.addEventListener('pointerdown', ev => ev.stopPropagation());
    el.append(ta);
    setTimeout(() => { ta.focus(); ta.style.height = ta.scrollHeight + 'px'; }, 0);
  } else {
    el.append(h('div.ntitle', {}, n.title));
    const meta = h('div.nmeta');
    const cat = catById(n.catId);
    if (cat) meta.append(h('span.ncat', { style: { color: palById(cat.color).deep } }, cat.name));
    if (n.steps.length) meta.append(h('span.nsteps', {}, n.steps.filter(s => s.done).length + '/' + n.steps.length + ' steps'));
    if (meta.children.length) el.append(meta);
  }

  // drag vs click
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.chk') || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
    let moved = false;
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    const mv = ev => {
      const rawX = ev.clientX - sx, rawY = ev.clientY - sy;
      if (!moved && Math.abs(rawX) + Math.abs(rawY) > 5) {
        moved = true;
        el.classList.add('dragging');
        n.z = ++STATE.zTop; el.style.zIndex = n.z;
      }
      if (moved) {
        n.x = ox + rawX / zoom; n.y = oy + rawY / zoom; // the plane has no edges
        el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
      }
    };
    const up = ev => {
      el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      el.classList.remove('dragging');
      if (!moved) { openNote(n.id); return; }
      dropAssign(n, el, ev);
      save();
    };
    el.addEventListener('pointermove', mv);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
  return el;
}

// Save a note title that is still being typed. Called before the canvas takes over a
// gesture: relying on the textarea's blur alone is not dependable, since a blur raised
// while the page itself is unfocused does not always reach the listener.
function commitOpenNoteEditor() {
  const ta = $('.note textarea');
  if (!ta) return;
  const noteEl = ta.closest('.note');
  const n = noteEl && noteById(noteEl.dataset.id);
  ta.blur();
  if (!n || !n.editing) return; // the blur listener already did it
  delete n.editing;
  n.title = ta.value.trim();
  if (!n.title) STATE.notes = STATE.notes.filter(x => x.id !== n.id);
  save(); renderCanvas();
}

function zoneAt(cx, cy) {
  for (let i = STATE.zones.length - 1; i >= 0; i--) {
    const z = STATE.zones[i];
    if (cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h) return z;
  }
  return null;
}
function dropAssign(n, el, ev) {
  const cx = n.x + el.offsetWidth / 2, cy = n.y + el.offsetHeight / 2;
  const z = zoneAt(cx, cy);
  const before = n.catId;
  if (z) n.catId = z.catId;
  else if (n.catId && STATE.zones.some(zz => zz.catId === n.catId)) n.catId = null; // pulled out of its home area
  if (n.catId !== before) {
    const cat = catById(n.catId);
    dropChip(ev.clientX, ev.clientY, cat ? '→ ' + cat.name : 'No category');
    renderCanvas();
  } else {
    renderCanvas(); // refresh zone counts / colors anyway (cheap)
  }
}
function dropChip(x, y, text) {
  const c = h('div.dropchip', { style: { left: x + 12 + 'px', top: y - 34 + 'px' } }, text);
  document.body.append(c);
  setTimeout(() => c.remove(), 1150);
}

/* ---------- create notes ---------- */
function newNoteAt(x, y) {
  const n = {
    id: uid(), title: '', desc: '', x, y,
    catId: (zoneAt(x + NOTE_W / 2, y + 35) || {}).catId || null,
    createdAt: Date.now(), completedAt: null, archived: false, steps: [], z: ++STATE.zTop, editing: true,
  };
  STATE.notes.push(n);
  save(); renderCanvas();
}
function newNoteCenter() {
  const rb = $('#board').getBoundingClientRect();
  const c = toCanvas(rb.left + rb.width / 2, rb.top + rb.height / 2);
  newNoteAt(c.x - NOTE_W / 2 + (Math.random() * 60 - 30), c.y - 60 + (Math.random() * 60 - 30));
}

/* ---------- complete / archive flow ---------- */
function toggleDone(id) {
  const n = noteById(id);
  if (!n) return;
  if (n.completedAt) { // un-complete
    n.completedAt = null;
    save(); renderCanvas(); completionChanged();
    return;
  }
  const snap = snapshot();
  n.completedAt = Date.now();
  const el = $('.note[data-id="' + n.id + '"]');
  if (el) el.classList.add('done');
  completionChanged();
  save();
  setTimeout(() => {
    const elNow = $('.note[data-id="' + n.id + '"]');
    if (elNow && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const r = elNow.getBoundingClientRect();
      const target = $('#meters').getBoundingClientRect();
      elNow.classList.add('flyoff');
      elNow.style.transform = 'translate(' + (target.right - 60 - r.left) + 'px,' + (target.top - r.top) + 'px) scale(.08) rotate(8deg)';
      setTimeout(finish, 480);
    } else finish();
    function finish() {
      const nn = noteById(id);
      if (!nn || !nn.completedAt) return; // undone in the meantime
      nn.archived = true;
      save(); renderCanvas(); renderMeters();
      toast('“' + (nn.title || 'Untitled') + '” archived', () => { restore(snap); completionChanged(); });
    }
  }, 620);
}

/* ---------- the view: an unbounded plane seen through the board ---------- */
let zoom = 1, panX = 0, panY = 0;
const ZOOM_MIN = 0.2, ZOOM_MAX = 2.5;
const VIEW_KEY = 'dayu-view-v1';
let viewSaveTimer = null;
// Where you were looking is a property of this screen, not of the account, so it stays
// in this browser rather than syncing.
function saveView() {
  clearTimeout(viewSaveTimer);
  viewSaveTimer = setTimeout(() => storeSet(VIEW_KEY, JSON.stringify({ panX, panY, zoom })), 400);
}
function loadView() {
  try {
    const v = JSON.parse(storeGet(VIEW_KEY) || 'null');
    if (v && isFinite(v.panX) && isFinite(v.panY)) {
      panX = v.panX; panY = v.panY;
      zoom = clamp(isFinite(v.zoom) ? v.zoom : 1, ZOOM_MIN, ZOOM_MAX);
    }
  } catch (e) { /* first visit */ }
}
function applyView() {
  const field = $('#field'), board = $('#board');
  field.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
  // The dots live on the board and are shifted to match, so the ground appears to move.
  board.style.backgroundSize = (24 * zoom) + 'px ' + (24 * zoom) + 'px';
  board.style.backgroundPosition = panX + 'px ' + panY + 'px';
  saveView();
}
// A point on screen, in the plane's own coordinates.
function toCanvas(clientX, clientY) {
  const rb = $('#board').getBoundingClientRect();
  return { x: (clientX - rb.left - panX) / zoom, y: (clientY - rb.top - panY) / zoom };
}
// Rescale around a screen point (the cursor, by default the middle of the view) so that
// point stays put instead of the canvas lurching.
function setZoom(newZoom, clientX, clientY) {
  newZoom = clamp(newZoom, ZOOM_MIN, ZOOM_MAX);
  if (newZoom === zoom) return;
  const rb = $('#board').getBoundingClientRect();
  const px = clientX == null ? rb.width / 2 : clientX - rb.left;
  const py = clientY == null ? rb.height / 2 : clientY - rb.top;
  const cx = (px - panX) / zoom, cy = (py - panY) / zoom;
  zoom = newZoom;
  panX = px - cx * zoom;
  panY = py - cy * zoom;
  applyView();
}
// Bounding box of everything on the plane, or null when it is empty.
function contentBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of STATE.notes) {
    if (n.archived) continue;
    const el = $('.note[data-id="' + n.id + '"]');
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + NOTE_W); maxY = Math.max(maxY, n.y + (el ? el.offsetHeight : 90));
  }
  for (const z of STATE.zones) {
    minX = Math.min(minX, z.x); minY = Math.min(minY, z.y);
    maxX = Math.max(maxX, z.x + z.w); maxY = Math.max(maxY, z.y + z.h);
  }
  return isFinite(minX) ? { minX, minY, maxX, maxY } : null;
}
// First look at a board in this browser. Leave it at 1:1 when there is already something
// on screen, and only reframe when the content would otherwise be off in blank space.
function initialView() {
  const rb = $('#board').getBoundingClientRect();
  const b = contentBounds();
  if (!b) return;
  const anyVisible = b.maxX > 0 && b.maxY > 0 && b.minX < rb.width && b.minY < rb.height;
  if (anyVisible) { panX = 0; panY = 0; zoom = 1; applyView(); return; }
  recenter();
}
// Bring everything back into view. The way home when you have wandered off into blank space.
function recenter() {
  const rb = $('#board').getBoundingClientRect();
  const b = contentBounds();
  if (!b) { zoom = 1; panX = rb.width / 2 - NOTE_W; panY = rb.height / 2 - 120; applyView(); return; }
  const pad = 70;
  const w = (b.maxX - b.minX) + pad * 2, hgt = (b.maxY - b.minY) + pad * 2;
  zoom = clamp(Math.min(rb.width / w, rb.height / hgt, 1), ZOOM_MIN, ZOOM_MAX);
  panX = rb.width / 2 - ((b.minX + b.maxX) / 2) * zoom;
  panY = rb.height / 2 - ((b.minY + b.maxY) / 2) * zoom;
  applyView();
}

/* ---------- draw-cluster mode ---------- */
let spaceHeld = false;    // space turns any drag into a pan, the usual canvas convention
let zoneDragging = false; // a cluster is mid-drag: hold off re-rendering it out from under the pointer
let cancelDraw = null;    // tears down an in-progress cluster draw, if there is one
function setDrawMode(on) {
  if (!on && cancelDraw) cancelDraw();
  drawMode = on;
  $('#btnZone').classList.toggle('on', on);
  $('#board').classList.toggle('drawing', on);
}
function wireCanvas() {
  const board = $('#board'), field = $('#field');
  $('#btnNote').addEventListener('click', newNoteCenter);
  $('#btnZone').addEventListener('click', () => setDrawMode(!drawMode));
  $('#btnHome').addEventListener('click', recenter);
  loadView();
  applyView();

  // The wheel zooms the canvas instead of scrolling the page. Panning still works by
  // dragging (see below), so nothing is lost by repurposing the wheel this way.
  board.addEventListener('wheel', e => {
    e.preventDefault();
    setZoom(zoom * Math.exp(-e.deltaY * 0.0016), e.clientX, e.clientY);
  }, { passive: false });
  // The view is expressed in screen pixels, so a resized window needs no correction,
  // but a board that was hidden at load (another page open) has no size until shown.
  window.addEventListener('resize', () => applyView());

  // The field has no size of its own now, so the board is what a pointer actually lands on.
  const onBareCanvas = t => t === board || t === field;

  board.addEventListener('dblclick', e => {
    if (!onBareCanvas(e.target)) return;
    const c = toCanvas(e.clientX, e.clientY);
    newNoteAt(c.x - NOTE_W / 2, c.y - 20);
  });

  // Empty canvas drags the view; empty space inside a cluster drags that cluster and its
  // contents. Middle button, or space held, always pans so a big cluster cannot trap you.
  board.addEventListener('pointerdown', e => {
    if (drawMode) return;
    const panOverride = e.button === 1 || spaceHeld;
    if (e.button !== 0 && !panOverride) return;
    if (e.target.closest('.note, .zhead, .zresize, .zonepop')) return;
    commitOpenNoteEditor(); // finish any title being typed before taking over the gesture
    if (!panOverride) {
      const c = toCanvas(e.clientX, e.clientY);
      const z = zoneAt(c.x, c.y);
      if (z) { startZoneDrag(z, e, board); return; }
    }
    const sx = e.clientX, sy = e.clientY;
    const p0x = panX, p0y = panY;
    let panning = false;
    // Capture up front, so releasing over the toolbar or outside the window still ends the pan.
    try { board.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    const mv = ev => {
      if (ev.pointerId !== e.pointerId) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!panning) {
        if (Math.abs(dx) + Math.abs(dy) < 4) return;
        panning = true;
        board.classList.add('panning');
      }
      if (ev.cancelable) ev.preventDefault(); // only once this is genuinely a drag
      panX = p0x + dx; panY = p0y + dy;
      applyView();
    };
    const up = ev => {
      if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      board.removeEventListener('pointermove', mv);
      board.removeEventListener('pointerup', up);
      board.removeEventListener('pointercancel', up);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      board.classList.remove('panning');
      try { board.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
    };
    board.addEventListener('pointermove', mv);
    board.addEventListener('pointerup', up);
    board.addEventListener('pointercancel', up);
    // Backstop: if capture ever fails to take, the release still reaches us here.
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });

  board.addEventListener('pointerdown', e => {
    if (!drawMode || !onBareCanvas(e.target) || e.button !== 0) return;
    e.preventDefault();
    const a = toCanvas(e.clientX, e.clientY);
    const ax = a.x, ay = a.y;
    const prev = $('#drawPreview');
    prev.style.display = 'block';
    let w = 0, hgt = 0, x = ax, y = ay;
    try { board.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    const mv = ev => {
      const b2 = toCanvas(ev.clientX, ev.clientY);
      x = Math.min(ax, b2.x); y = Math.min(ay, b2.y); w = Math.abs(b2.x - ax); hgt = Math.abs(b2.y - ay);
      Object.assign(prev.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: hgt + 'px' });
    };
    const finish = commit => {
      if (!cancelDraw) return;     // already torn down
      cancelDraw = null;           // cleared first, so setDrawMode below cannot recurse
      board.removeEventListener('pointermove', mv); board.removeEventListener('pointerup', up); board.removeEventListener('pointercancel', up);
      try { board.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
      prev.style.display = 'none';
      setDrawMode(false);
      if (commit && w > 70 && hgt > 60) zoneNamePopover(x, y, Math.max(w, 130), Math.max(hgt, 100));
    };
    const up = () => finish(true);
    cancelDraw = () => finish(false);
    board.addEventListener('pointermove', mv);
    board.addEventListener('pointerup', up);
    board.addEventListener('pointercancel', up);
  });

  // Space belongs to whatever is focused: it types, and it presses buttons. Only claim it
  // when the bare canvas has focus and nothing is layered over it.
  const spaceIsOurs = t => {
    if (currentPage() !== 'canvas') return false;
    if ($('#welcome') || $('#modalRoot').classList.contains('open')) return false;
    if (!t || t === document.body || t === field || t === board) return true;
    return false;
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { setDrawMode(false); closeModal(); $$('.zonepop').forEach(p => p.remove()); }
    if (e.code === 'Space' && spaceIsOurs(e.target)) {
      if (!spaceHeld) { spaceHeld = true; board.classList.add('panready'); }
      e.preventDefault(); // stop the page from scrolling under us
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space') { spaceHeld = false; board.classList.remove('panready'); }
  });
  window.addEventListener('blur', () => { spaceHeld = false; board.classList.remove('panready'); });
}

function zoneNamePopover(x, y, w, hgt) {
  $$('.zonepop').forEach(p => p.remove());
  const unused = PAL.filter(p => !STATE.cats.some(c => c.color === p.id));
  let color = (unused[0] || PAL[STATE.cats.length % PAL.length]).id;
  const nameIn = h('input.input', { placeholder: 'Name this cluster…', maxLength: 40 });
  const existing = STATE.cats.filter(c => !STATE.zones.some(z => z.catId === c.id));
  const sel = existing.length ? h('select.input', {},
    h('option', { value: '' }, '…or use an existing category'),
    existing.map(c => h('option', { value: c.id }, c.name))) : null;
  const dots = h('div.dots', {}, PAL.map(p => {
    const b = h('button.cdot' + (p.id === color ? '.on' : ''), { style: { background: p.bg }, title: p.name, onclick: () => { color = p.id; $$('.cdot', dots).forEach(d => d.classList.remove('on')); b.classList.add('on'); } });
    return b;
  }));
  const create = () => {
    let catId = sel && sel.value ? sel.value : null;
    const nm = nameIn.value.trim();
    if (!catId) {
      if (!nm) { nameIn.focus(); return; }
      const existingByName = STATE.cats.find(c => c.name.toLowerCase() === nm.toLowerCase());
      if (existingByName) catId = existingByName.id;
      else { const c = { id: uid(), name: nm, color }; STATE.cats.push(c); catId = c.id; }
    }
    STATE.zones.push({ id: uid(), catId, x, y, w, h: hgt });
    // adopt notes already inside the new area
    for (const n of STATE.notes) {
      if (n.archived) continue;
      const cx = n.x + NOTE_W / 2, cy = n.y + 35;
      if (cx >= x && cx <= x + w && cy >= y && cy <= y + hgt) n.catId = catId;
    }
    pop.remove();
    save(); renderCanvas();
  };
  const pop = h('div.zonepop', { style: { left: x + 'px', top: (y + hgt + 8) + 'px' } },
    h('div.label', {}, 'New cluster'),
    nameIn, sel, dots,
    h('div', { style: { display: 'flex', gap: '8px', justifyContent: 'flex-end' } },
      h('button.btn.ghost.small', { onclick: () => pop.remove() }, 'Cancel'),
      h('button.btn.primary.small', { onclick: create }, 'Create')));
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') create(); });
  $('#field').append(pop);
  setTimeout(() => nameIn.focus(), 0);
}

/* ---------- note modal ---------- */
let modalNoteId = null;
function closeModal() {
  const root = $('#modalRoot');
  if (!root.classList.contains('open')) return;
  root.classList.remove('open'); root.innerHTML = '';
  modalNoteId = null;
  renderCanvas(); renderMeters();
  if (currentPage() === 'archive') renderArchive();
}
function openNote(id) {
  const n = noteById(id);
  if (!n) return;
  modalNoteId = id;
  const root = $('#modalRoot');
  root.innerHTML = ''; root.classList.add('open');

  const cat = catById(n.catId);
  const sheet = h('div.sheet');
  sheet.append(h('div.ctab', { style: { background: cat ? palById(cat.color).bg : DEFAULT_NOTE_BG } }));

  const body = h('div.sbody');
  sheet.append(body);

  // title row with big check
  const bigchk = h('button.bigchk' + (n.completedAt ? '.done' : ''), { title: n.completedAt ? 'Not done after all' : 'Done: sends it to the archive', innerHTML: TICK_SVG, onclick: () => { closeModal(); toggleDone(n.id); } });
  const ttl = h('textarea.ttl', { rows: 1, placeholder: 'What needs doing?', value: n.title });
  const grow = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  ttl.addEventListener('input', () => { n.title = ttl.value; grow(ttl); save(); });
  ttl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ttl.blur(); } });
  body.append(h('div.srow', {}, bigchk, ttl));

  const desc = h('textarea.desc', { rows: 1, placeholder: 'Add a note to self…', value: n.desc || '' });
  desc.addEventListener('input', () => { n.desc = desc.value; grow(desc); save(); });
  body.append(desc);

  // steps
  const stepsBox = h('div.steps');
  const aiBtn = h('button.btn.ghost.small', { onclick: () => draftSteps(n, aiBtn, stepsBox, aiNote) }, '✨ Draft steps');
  const aiNote = h('div.ainote');
  body.append(h('div.sec', {},
    h('div.sechead', {}, h('span.label', {}, 'Steps'), aiBtn),
    stepsBox, aiNote));
  renderSteps(n, stepsBox);

  // category picker
  const pick = h('div.catpick');
  body.append(h('div.sec', {}, h('div.sechead', {}, h('span.label', {}, 'Category')), pick));
  renderCatPick(n, pick, sheet);

  // completion date, if any, stays with the other detail up here; creation date moves to the footer below
  if (n.completedAt) {
    body.append(h('div.meta', {}, h('div.mitem', {}, h('span.label', {}, 'Completed'), h('span.mval', {}, fmtFull(n.completedAt)))));
  }

  // footer
  sheet.append(h('div.sfoot', {},
    h('button.btn.danger.small', { onclick: () => { closeModal(); undoableAction('Note deleted', () => { STATE.notes = STATE.notes.filter(x => x.id !== n.id); }); } }, 'Delete'),
    h('span.screated', { title: fmtFull(n.createdAt) }, 'Created ' + fmtDY(n.createdAt)),
    h('button.btn.small', { onclick: closeModal }, 'Close')));

  root.append(h('div.overlay', { onclick: closeModal }), sheet);
  setTimeout(() => { grow(ttl); grow(desc); if (!n.title) ttl.focus(); }, 0);
}

function renderSteps(n, box) {
  box.innerHTML = '';
  for (const s of n.steps) {
    const inp = h('input', { type: 'text', value: s.text });
    inp.addEventListener('input', () => { s.text = inp.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') addInp.focus(); });
    const row = h('div.step' + (s.done ? '.done' : ''), {},
      h('button.schk' + (s.done ? '.done' : ''), { innerHTML: s.done ? TICK_SVG : '', onclick: () => { s.done = !s.done; save(); renderSteps(n, box); } }),
      inp,
      h('button.sdel', { title: 'Remove step', onclick: () => { n.steps = n.steps.filter(x => x.id !== s.id); save(); renderSteps(n, box); } }, '✕'));
    box.append(row);
  }
  const addInp = h('input', { type: 'text', placeholder: n.steps.length ? 'Add another step…' : 'Break it down. Add a step…' });
  addInp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && addInp.value.trim()) {
      n.steps.push({ id: uid(), text: addInp.value.trim(), done: false });
      save(); renderSteps(n, box);
      setTimeout(() => { const inps = $$('.addstep input', box.parentElement); if (inps.length) inps[inps.length - 1].focus(); }, 0);
    }
  });
  box.append(h('div.addstep', {}, h('span.plus', {}, '+'), addInp));
}

function renderCatPick(n, pick, sheet) {
  pick.innerHTML = '';
  for (const c of STATE.cats) {
    const pal = palById(c.color);
    const on = n.catId === c.id;
    pick.append(h('button.chip' + (on ? '.on' : ''), { onclick: () => { n.catId = on ? null : c.id; save(); renderCatPick(n, pick, sheet); $('.ctab', sheet).style.background = n.catId ? pal.bg : DEFAULT_NOTE_BG; } },
      h('span.dot', { style: { background: pal.bg, border: '1px solid ' + pal.deep } }), c.name));
  }
  const newBtn = h('button.chip', { onclick: () => {
    const inp = h('input.input', { placeholder: 'New category…', maxLength: 40, style: { padding: '4px 10px', fontSize: '12px' } });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && inp.value.trim()) {
        const color = (PAL.filter(p => !STATE.cats.some(c => c.color === p.id))[0] || PAL[STATE.cats.length % PAL.length]).id;

function sampleSteps(title) {

/* ================= Tack — daily goals (sheet) & dashboard ================= */

function activeHabits() { return STATE.habits.filter(x => !x.archivedAt).sort((a, b) => (a.order || 0) - (b.order || 0)); }
function retiredHabits() { return STATE.habits.filter(x => x.archivedAt).sort((a, b) => b.archivedAt - a.archivedAt); }
function todayKey() { return dayKey(Date.now()); }
// A cell cycles blank -> green -> yellow -> red -> blank. Green is the only state that
// counts as "done" for streaks and hit rate; yellow/red just record that the day was marked.
const CELL_ORDER = ['green', 'yellow', 'red'];
function habitCheckedToday(hb) { return hb.days[todayKey()] === 'green'; }
function keyToTs(k) { return new Date(k + 'T12:00').getTime(); }

function habitStats(hb) {
  const keys = Object.keys(hb.days).sort();          // every marked day, any color
  const greenKeys = keys.filter(k => hb.days[k] === 'green');
  const end = startOfDay(hb.archivedAt || Date.now());
  let start = startOfDay(hb.createdAt);
  if (keys.length) start = Math.min(start, startOfDay(keyToTs(keys[0])));
  const totalDays = Math.max(1, Math.round((end - start) / DAY) + 1);
  const checked = greenKeys.length;
  const pct = Math.round(checked / totalDays * 100);
  // best streak, green days only
  let best = 0, run = 0, prev = null;
  for (const k of greenKeys) {
    const t = startOfDay(keyToTs(k));
    run = (prev !== null && t - prev === DAY) ? run + 1 : 1;
    best = Math.max(best, run);
    prev = t;
  }
  // current streak: consecutive green days ending today (or yesterday if today isn't green)
  let cur = 0;
  let cursor = startOfDay(Date.now());
  if (hb.days[dayKey(cursor)] !== 'green') cursor -= DAY;
  while (hb.days[dayKey(cursor)] === 'green') { cur++; cursor -= DAY; }
  return { totalDays, checked, pct, best, cur, since: start };
}
// Same shape as habitStats(), but bounded to a [fromKey, toKey] window (either end may be
// blank for open-ended). Used by the Archive's Goal history date filter, where "best streak"
// and the day counts should reflect only the selected window, not the goal's whole life.
function habitStatsInRange(hb, fromKey, toKey) {
  const keys = Object.keys(hb.days).filter(k => (!fromKey || k >= fromKey) && (!toKey || k <= toKey)).sort();
  const greenKeys = keys.filter(k => hb.days[k] === 'green');
  const habStart = startOfDay(hb.createdAt);
  const habEnd = startOfDay(hb.archivedAt || Date.now());
  const rangeStart = fromKey ? startOfDay(keyToTs(fromKey)) : habStart;
  const rangeEnd = toKey ? startOfDay(keyToTs(toKey)) : habEnd;
  const clampedStart = Math.max(habStart, rangeStart), clampedEnd = Math.min(habEnd, rangeEnd);
  const totalDays = clampedEnd >= clampedStart ? Math.round((clampedEnd - clampedStart) / DAY) + 1 : 0;
  const checked = greenKeys.length;
  const pct = totalDays > 0 ? Math.round(checked / totalDays * 100) : 0;
  let best = 0, run = 0, prev = null;
  for (const k of greenKeys) {
    const t = startOfDay(keyToTs(k));
    run = (prev !== null && t - prev === DAY) ? run + 1 : 1;
    best = Math.max(best, run);
    prev = t;
  }
  return {
    totalDays, checked, pct, best,
    yellow: keys.filter(k => hb.days[k] === 'yellow').length,
    red: keys.filter(k => hb.days[k] === 'red').length,
  };
}

function lastNDaysKeys(n) {
  const out = [];
  const t0 = startOfDay(Date.now());
  for (let i = n - 1; i >= 0; i--) out.push(dayKey(t0 - i * DAY));
  return out;
}

/* ---------- full goal-tracking history (archive page) ---------- */
function monthKeyOf(ts) { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthsWithHistory() {
  // Every month from the first day anyone tracked through the current one, newest first.
  const all = STATE.habits;
  if (!all.length) return [];
  let earliest = Infinity;
  for (const hb of all) {
    earliest = Math.min(earliest, startOfDay(hb.createdAt || Date.now()));
    for (const k of Object.keys(hb.days)) earliest = Math.min(earliest, startOfDay(keyToTs(k)));
  }
  if (!isFinite(earliest)) return [];
  const out = [];
  const now = new Date();
  const cur = new Date(now.getFullYear(), now.getMonth(), 1);
  const first = new Date(earliest);
  const walk = new Date(first.getFullYear(), first.getMonth(), 1);
  while (walk <= cur) { out.push({ y: walk.getFullYear(), m: walk.getMonth() }); walk.setMonth(walk.getMonth() + 1); }
  return out.reverse();
}
function monthDayKeys(y, m) {
  const days = new Date(y, m + 1, 0).getDate();
  const out = [];
  for (let d = 1; d <= days; d++) out.push(y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'));
  return out;
}
const GHIST_QUICK = [['all', 'All time'], ['30', 'Last 30 days'], ['90', 'Last 90 days'], ['year', 'This year'], ['', 'Custom range']];
let ghistFilters = { from: '', to: '', quick: 'all' };
function ghistHasFilter() { return !!(ghistFilters.from || ghistFilters.to); }
function ghistRangeLabel() {
  const f = ghistFilters.from, t = ghistFilters.to;
  if (f && t) return 'Totals, ' + fmtDY(keyToTs(f)) + ' to ' + fmtDY(keyToTs(t));
  if (f) return 'Totals since ' + fmtDY(keyToTs(f));
  if (t) return 'Totals through ' + fmtDY(keyToTs(t));
  return 'Totals so far';
}

function renderGoalHistory() {
  const wrap = h('div');
  const all = STATE.habits.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  if (!all.length) {
    wrap.append(h('div.empty', {}, 'No daily goals yet. Add some on the Goals page and their whole history shows up here.'));
    return wrap;
  }

  // --- date range filter ---
  const quickSel = h('select.input', {}, GHIST_QUICK.map(([v, l]) => h('option', { value: v, selected: ghistFilters.quick === v }, l)));
  const fromIn = h('input.input', { type: 'date', value: ghistFilters.from, title: 'From this day' });
  const toIn = h('input.input', { type: 'date', value: ghistFilters.to, title: 'Through this day' });
  quickSel.addEventListener('change', () => {
    ghistFilters.quick = quickSel.value;
    const now = Date.now();
    if (quickSel.value === 'all') { ghistFilters.from = ''; ghistFilters.to = ''; }
    else if (quickSel.value === '30') { ghistFilters.from = dayKey(now - 29 * DAY); ghistFilters.to = ''; }
    else if (quickSel.value === '90') { ghistFilters.from = dayKey(now - 89 * DAY); ghistFilters.to = ''; }
    else if (quickSel.value === 'year') { ghistFilters.from = new Date().getFullYear() + '-01-01'; ghistFilters.to = ''; }
    // '' (custom) leaves from/to as already typed
    renderArchive();
  });
  fromIn.addEventListener('change', () => { ghistFilters.from = fromIn.value; ghistFilters.quick = ''; renderArchive(); });
  toIn.addEventListener('change', () => { ghistFilters.to = toIn.value; ghistFilters.quick = ''; renderArchive(); });
  wrap.append(h('div.filters', {}, h('div.frow', {}, quickSel, fromIn, h('span', { style: { color: 'var(--ink3)', fontSize: '12px' } }, 'to'), toIn)));

  const hasFilter = ghistHasFilter();

  // per-goal totals: the filtered window if one is set, otherwise the whole history
  const summary = h('div.ghist-sum');
  for (const hb of all) {
    let s;
    if (hasFilter) {
      s = habitStatsInRange(hb, ghistFilters.from, ghistFilters.to);
    } else {
      const st = habitStats(hb);
      const marks = Object.values(hb.days);
      s = { pct: st.pct, checked: st.checked, totalDays: st.totalDays, best: st.best, yellow: marks.filter(v => v === 'yellow').length, red: marks.filter(v => v === 'red').length };
    }
    summary.append(h('div.ghist-row', {},
      h('span.ghr-name', {}, hb.name, hb.archivedAt ? h('span.ghr-tag', {}, 'retired') : null),
      h('span.ghr-pct', {}, s.pct + '%'),
      h('span.ghr-detail', {}, s.checked + ' green'
        + (s.yellow ? ', ' + s.yellow + ' yellow' : '') + (s.red ? ', ' + s.red + ' red' : '')
        + ' of ' + s.totalDays + ' days · best streak ' + s.best)));
  }
  wrap.append(h('div.dsec', {}, h('span.label', {}, ghistRangeLabel()), summary));

  const letters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const tk = todayKey();
  const months = monthsWithHistory().filter(({ y, m }) => {
    if (!hasFilter) return true;
    const first = y + '-' + String(m + 1).padStart(2, '0') + '-01';
    const last = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(new Date(y, m + 1, 0).getDate()).padStart(2, '0');
    if (ghistFilters.to && first > ghistFilters.to) return false;
    if (ghistFilters.from && last < ghistFilters.from) return false;
    return true;
  });
  let shown = 0;
  for (const { y, m } of months) {
    let keys = monthDayKeys(y, m);
    if (hasFilter) keys = keys.filter(k => (!ghistFilters.from || k >= ghistFilters.from) && (!ghistFilters.to || k <= ghistFilters.to));
    if (!keys.length) continue;
    if (!hasFilter) {
      // Skip a month nobody marked, unless it is the current one.
      const anyMarks = all.some(hb => keys.some(k => hb.days[k]));
      if (!anyMarks && monthKeyOf(Date.now()) !== y + '-' + String(m + 1).padStart(2, '0')) continue;
    }
    // A goal belongs in this month if it was marked here, or if it was already alive then
    // and had not yet been retired: no rows for months before a goal existed.
    const monthEnd = keyToTs(keys[keys.length - 1]);
    const monthStart = keyToTs(keys[0]);
    const rows = all.filter(hb => keys.some(k => hb.days[k])
      || (startOfDay(hb.createdAt) <= monthEnd && (!hb.archivedAt || hb.archivedAt >= monthStart)));
    if (!rows.length) continue;

    const thead = h('thead', {}, h('tr', {},
      h('th.hname', {}, ''),
      keys.map(k => {
        const d = new Date(k + 'T12:00');
        return h('th' + (k === tk ? '.todaycol' : ''), {}, letters[d.getDay()], h('span.dnum', {}, String(d.getDate())));
      })));
    const tbody = h('tbody');
    for (const hb of rows) {
      const tr = h('tr', {}, h('td.hname', {}, hb.name, hb.archivedAt ? h('span.ghr-tag', {}, 'retired') : null));
      for (const k of keys) {
        const future = keyToTs(k) > Date.now();
        const title = () => hb.name + ' · ' + k + (hb.days[k] ? ' (' + hb.days[k] + ')' : '');
        const cell = h('button.hcell' + (hb.days[k] ? '.c-' + hb.days[k] : ''), { title: title(), disabled: future });
        if (!future) cell.addEventListener('click', () => {
          toggleHabit(hb, k);
          cell.className = 'hcell' + (hb.days[k] ? ' c-' + hb.days[k] : '');
          cell.title = title();
        });
        tr.append(h('td' + (k === tk ? '.todaycol' : '') + (future ? '.futurecol' : ''), {}, cell));
      }
      tbody.append(tr);
    }
    const label = new Date(y, m, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    wrap.append(h('div.dsec', {},
      h('span.label', {}, label),
      h('div.hwrap', {}, h('table.htable.hmonth', {}, thead, tbody))));
    shown++;
  }
  if (hasFilter && !shown) wrap.append(h('div.empty', {}, 'Nothing tracked in this range.'));
  return wrap;
}
