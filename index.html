        name: hb.name, retired: !!hb.archivedAt, since: dayKey(s.since),
        daysTracked: s.totalDays, daysHit: s.checked, hitRatePct: s.pct,
        currentStreak: s.cur, bestStreak: s.best,
        // last 14 days, one letter per day: G green (done), Y yellow, R red, . blank
        last14: lastNDaysKeys(14).map(k => ({ green: 'G', yellow: 'Y', red: 'R' }[hb.days[k]] || '.')).join(''),
      };
    }),
    taskGoals: STATE.goals.map(g => ({ name: g.name, target: g.target, period: g.period, progress: goalCount(g) })),
  };
}
function sampleDashSummary() {
  const habs = activeHabits();
  if (!habs.length) return 'No daily goals tracked yet, so there is nothing to score. Add a few on the Goals page.';
  const last7 = lastNDaysKeys(7);
  const lines = [];
  const hit7 = habs.reduce((a, hb) => a + last7.filter(k => hb.days[k] === 'green').length, 0);
  lines.push('Last 7 days: you hit ' + hit7 + ' of ' + habs.length * 7 + ' possible checks (' + Math.round(hit7 / (habs.length * 7) * 100) + '%).');
  const scored = habs.map(hb => ({ hb, s: habitStats(hb) })).sort((a, b) => b.s.pct - a.s.pct);
  const top = scored[0], low = scored[scored.length - 1];
  lines.push('Strongest: “' + top.hb.name + '” at ' + top.s.pct + '% (streak ' + top.s.cur + ', best ' + top.s.best + ').');
  if (low !== top) lines.push('Weakest: “' + low.hb.name + '” at ' + low.s.pct + '%. Try anchoring it to something you already do every day.');
  const curMax = scored.slice().sort((a, b) => b.s.cur - a.s.cur)[0];
  if (curMax.s.cur >= 2) lines.push('Live streak: ' + curMax.s.cur + ' days of “' + curMax.hb.name + '”. Don’t break the chain today.');
  return lines.join('\n');
}
function buildDashSummarySection() {
  const prompts = STATE.prompts.filter(p => p.scope === 'dashboard');
  const sel = h('select.input.grow', {}, prompts.map(p => h('option', { value: p.id }, p.name)));
  const out = h('div.aiout');
  const run = h('button.btn.primary.small', { onclick: async () => {

    out.classList.add('show'); out.textContent = 'Summarizing…'; run.disabled = true;
    out.textContent = await summarize(p, dashData(), sampleDashSummary);
    run.disabled = false;
  } }, 'Summarize');
  return h('div.aisec.dsec', {},
    h('div.sechead', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' } },
      h('span.label', {}, 'AI review of your goal keeping'),
      h('button.btn.ghost.small', { onclick: () => openPromptsModal('dashboard') }, 'Manage prompts')),
    h('div.frow', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap' } }, sel, run),
    out);
}

'use strict';
/* ================= Tack — archive & goals pages, boot ================= */

/* ---------- archive ---------- */
const afilters = { q: '', cats: new Set(), from: '', to: '', quick: 'all' };
let archiveView = 'tasks'; // 'tasks' or 'goals'

function archivedNotes() {
  let list = STATE.notes.filter(n => n.archived && n.completedAt);
  if (afilters.q) {
    const q = afilters.q.toLowerCase();
    list = list.filter(n => (n.title || '').toLowerCase().includes(q) || (n.desc || '').toLowerCase().includes(q));
  }
  if (afilters.cats.size) list = list.filter(n => afilters.cats.has(n.catId || 'none'));
  if (afilters.from) { const t = new Date(afilters.from + 'T00:00').getTime(); list = list.filter(n => n.completedAt >= t); }
  if (afilters.to) { const t = new Date(afilters.to + 'T00:00').getTime() + DAY; list = list.filter(n => n.completedAt < t); }
  return list.sort((a, b) => b.completedAt - a.completedAt);
}

function renderArchive() {
  const inner = $('#archiveInner');
  inner.innerHTML = '';
  inner.append(h('h1', {}, 'Archive'),

  toIn.addEventListener('change', () => { afilters.to = toIn.value; afilters.quick = ''; refresh(); });

  const catRow = h('div.frow');

function sampleSummary(items, prompt) {
  if (!items.length) return 'No tasks match the current filters — nothing to summarize.';
  const byCat = {};
  for (const n of items) {
    const c = catById(n.catId);
    const k = c ? c.name : 'No category';
    byCat[k] = (byCat[k] || 0) + 1;
  }
  const catLines = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => '  • ' + k + ': ' + v).join('\n');
  const span = fmtDY(items[items.length - 1].completedAt) + ' to ' + fmtDY(items[0].completedAt);
  const byDay = {};
  for (const n of items) { const k = dayKey(n.completedAt); byDay[k] = (byDay[k] || 0) + 1; }
  const best = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];
  const avgDays = items.reduce((a, n) => a + (n.completedAt - n.createdAt), 0) / items.length / DAY;
  return 'Using prompt: “' + (prompt ? prompt.name : '—') + '”\n\n'
    + 'You completed ' + items.length + ' task' + (items.length === 1 ? '' : 's') + ' (' + span + ').\n\n'
    + 'By category:\n' + catLines + '\n\n'
    + 'Busiest day: ' + fmtDY(new Date(best[0] + 'T12:00').getTime()) + ' (' + best[1] + ' done)\n'
    + 'Average time from created to done: ' + (avgDays < 1 ? 'same day' : avgDays.toFixed(1) + ' days');
}

function wishCard(w) {
  const goal = STATE.goals.find(g => g.id === w.goalId);
  const unlocked = !goal || goalMet(goal);
  const link = safeUrl(w.url);
  const card = h('div.gcard.wcard' + (w.claimedAt ? '.claimed' : ''));

  // picture, when we can get one. A dead or placeholder image removes itself rather than
  // leaving a broken frame behind.
  const imgSrc = wishImageUrl(w);
  if (imgSrc) {
    // Not lazy: these are a few small thumbnails, and lazy ones below the fold sit
    // unloaded until scrolled to, which reads as a broken picture.
    const thumb = h('img.wthumb', { src: imgSrc, alt: '', referrerPolicy: 'no-referrer' });
    thumb.addEventListener('error', () => shell.remove());
    // Amazon answers unknown ids with a 1x1 transparent pixel, which loads "successfully".
    thumb.addEventListener('load', () => { if (thumb.naturalWidth <= 1 || thumb.naturalHeight <= 1) shell.remove(); });
    const shell = link
      ? h('a.wthumbwrap', { href: link, target: '_blank', rel: 'noopener noreferrer', title: 'Open ' + w.text }, thumb)
      : h('span.wthumbwrap', {}, thumb);
    card.append(shell);
  }

  const main = h('div.wmain');
  card.append(main);

  let stateEl = null;
  if (w.claimedAt) stateEl = h('span.wish-state', { style: { color: 'var(--ink3)' } }, 'Claimed ' + fmtD(w.claimedAt) + ' 🎉');
  else if (goal && unlocked) stateEl = h('span.wish-state.unlocked', {}, 'Unlocked by “' + goal.name + '”!');
  else if (goal) stateEl = h('span.wish-state.locked', {}, (goal.target - goalCount(goal)) + ' more task' + (goal.target - goalCount(goal) === 1 ? '' : 's') + ' to unlock (' + goal.name + ')');

  main.append(h('div.ghead', {},
    link
      ? h('a.gname.wlink', { href: link, target: '_blank', rel: 'noopener noreferrer' }, w.text)
      : h('span.gname', {}, w.text),
    !w.claimedAt && unlocked ? h('button.btn.primary.small', { onclick: e => {
      w.claimedAt = Date.now(); save();
      const r = e.target.getBoundingClientRect();
      confetti(r.left, r.top);
      renderGoals();
    } }, 'Claim it') : null,
    h('button.lnkbtn', { title: 'Edit link and picture', onclick: () => openWishLinkEditor(w) }, '🔗'),
    h('button.xbtn', { title: 'Delete', onclick: () => undoableAction('Wish deleted', () => { STATE.wishes = STATE.wishes.filter(x => x.id !== w.id); }) }, '✕')));
  if (stateEl) main.append(h('div.gmeta', {}, stateEl));
  return card;
}

// Attach or change the shop link and picture for an existing wish.
function openWishLinkEditor(w) {
  const root = $('#modalRoot');
  root.innerHTML = ''; root.classList.add('open');
  const urlIn = h('input.input.grow', { placeholder: 'https://www.amazon.com/dp/…', value: w.url || '', maxLength: 600 });
  const imgIn = h('input.input.grow', { placeholder: 'Picture link (optional, overrides the automatic one)', value: w.img || '', maxLength: 600 });
  const preview = h('div.wprev');
  const note = h('div.setnote');
  // Each keystroke starts a new attempt. Stamp it, so a slow earlier image cannot come
  // back later and describe itself over the newer one.
  let paintGen = 0;
  const paint = () => {
    const gen = ++paintGen;
    preview.innerHTML = '';
    const nUrl = normalizeUrl(urlIn.value), nImg = normalizeUrl(imgIn.value);
    const src = nImg || amazonImageFor(nUrl);
    if (!src) {
      if (urlIn.value.trim() && !nUrl) note.textContent = 'That shop link is not a web address Dayu can open.';
      else if (imgIn.value.trim() && !nImg) note.textContent = 'That picture link is not a web address Dayu can open.';
      else if (!urlIn.value.trim()) note.textContent = 'Paste a shop link. Amazon product links find their own picture; for other shops, paste a picture link too.';
      else note.textContent = 'No picture found for that link. Right-click the product image in your browser, copy its address, and paste it below.';
      return;
    }
    const im = h('img', { src, alt: '', referrerPolicy: 'no-referrer' });
    im.addEventListener('load', () => {
      if (gen !== paintGen) return;
      if (im.naturalWidth <= 1 || im.naturalHeight <= 1) { preview.innerHTML = ''; note.textContent = 'Amazon has no picture on file for that item. Paste a picture link below instead.'; }
      else note.textContent = 'This is how it will look.';
    });
    im.addEventListener('error', () => {
      if (gen !== paintGen) return;
      preview.innerHTML = ''; note.textContent = 'That picture would not load. Check the address, or leave it blank.';
    });
    preview.append(im);
    note.textContent = 'Loading the picture…';
  };
  urlIn.addEventListener('input', paint);
  imgIn.addEventListener('input', paint);
  paint();

  const body = h('div.sbody', {},
    h('h1', { style: { fontSize: '19px', fontWeight: '800', marginBottom: '2px' } }, w.text),
    h('div', { style: { color: 'var(--ink2)', marginBottom: '16px', fontSize: '13px' } }, 'Link this to where you would buy it.'),
    h('div.setsec', {}, h('span.label', {}, 'Shop link'), h('div.frow', { style: { display: 'flex', marginTop: '8px' } }, urlIn)),
    h('div.setsec', {}, h('span.label', {}, 'Picture'), h('div.frow', { style: { display: 'flex', marginTop: '8px' } }, imgIn), preview, note));
  const sheet = h('div.sheet', {}, h('div.ctab', { style: { background: 'var(--accent)' } }), body,
    h('div.sfoot', {},
      h('button.btn.danger.small', { onclick: () => { w.url = ''; w.img = ''; save(); closeModal(); renderGoals(); } }, 'Remove link'),
      h('button.btn.primary.small', { onclick: () => {
        // Refuse to close on something we would only throw away: say so and let them fix it.
        if (urlIn.value.trim() && !normalizeUrl(urlIn.value)) { note.textContent = 'That shop link is not a web address Dayu can open. Fix it, or clear the box.'; urlIn.focus(); return; }
        if (imgIn.value.trim() && !normalizeUrl(imgIn.value)) { note.textContent = 'That picture link is not a web address Dayu can open. Fix it, or clear the box.'; imgIn.focus(); return; }
        w.url = normalizeUrl(urlIn.value); w.img = normalizeUrl(imgIn.value);
        save(); closeModal(); renderGoals();
      } }, 'Save')));
  root.append(h('div.overlay', { onclick: closeModal }), sheet);
  setTimeout(() => urlIn.focus(), 0);
}

/* ---------- boot ---------- */
function boot() {
  STATE = loadState();
  storeSet(STORE_KEY, storeGet(STORE_KEY) || JSON.stringify(STATE)); // probe storage
  for (const g of STATE.goals) metBefore[g.id] = goalMet(g);
  wireMenu();
  wireCanvas();
  wireTabs();
  renderMeters(); renderCanvas();
  // parse any OAuth redirect BEFORE the router touches the URL hash
  handleAuthRedirect().then(() => {
    window.addEventListener('hashchange', route);
    route();
    initSync();
    maybeShowWelcome();
  });
  if (!storageOK) {
    const sn = $('#storageNote');
    sn.style.display = 'block';
    sn.innerHTML = '';
    sn.append(
      h('button', { onclick: () => sn.style.display = 'none', 'aria-label': 'Dismiss' }, '✕'),
      h('div', {}, h('b', {}, 'Preview mode: '), 'this environment can’t store data between visits. Use ⋯ → Export to keep a backup, or run Dayu from its own page for full persistence.'));
  }
  // A board this browser has never panned gets framed once.
  if (!storeGet(VIEW_KEY)) initialView();
}
boot();

</script>
