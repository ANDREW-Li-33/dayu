/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* The page itself never scrolls (each board and page scrolls on its own), so a swipe that
   runs past the end of a list must not bounce the whole app or pull it to refresh. */
html,body{overscroll-behavior:none}
/* iOS enlarges some text when a phone turns sideways; the layout already fits. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.45; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

#app{height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
#topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:18px;
  height:54px; padding:0 16px; background:var(--surface);
  border-bottom:1px solid var(--line); position:relative; z-index:40;
}
.wordmark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.02em;user-select:none}

/* Routines and the Archive as settings entries, shown only where the bar has no room for their tabs */
#menuPop .mnav{display:none}
/* Routines and the Archive are places you visit now and then, to read how you do things or
   to look back, so they sit apart from the everyday pages at the other end of the bar. */
.tabs-end{margin-left:auto}
.tab{
  padding:6px 12px;border-radius:8px;font-weight:600;color:var(--ink2);
  text-decoration:none;font-size:13.5px;
}
.tab:hover{color:var(--ink);background:var(--accent-soft)}
.tabs .tab:focus-visible{outline-offset:-2px}   /* inside the tab: the sliding strip would clip it */
.tab.active{color:var(--accent);background:var(--accent-soft)}
/* unread friend messages wait behind the Goals tab */
.tabbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;
  padding:0 4px;margin-left:6px;border-radius:999px;background:var(--danger);color:var(--paper);
  font-size:10px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;vertical-align:1px}
#meters{display:flex;align-items:center;gap:14px;min-width:0;flex:0 1000 auto;overflow:hidden}   /* gives way before the tabs */
#meters:empty{display:none}   /* nothing pinned: no empty slot, and no extra gap in the bar */
.meter{display:flex;flex-direction:column;gap:3px;min-width:96px;cursor:pointer;border-radius:6px;padding:2px 4px}
.meter:hover{background:var(--accent-soft)}
.meter .mlabel{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.meter .mrow{display:flex;align-items:center;gap:6px}
.meter .mtrack{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.meter .mfill{height:100%;border-radius:4px;background:var(--accent);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.meter .mnum{font-size:11px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter.pulse .mfill{animation:mpulse .5s ease}
@keyframes mpulse{50%{filter:brightness(1.4)}}
#menuBtn{width:32px;height:32px;border-radius:8px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
#menuBtn svg{width:18px;height:18px;display:block}
#menuBtn:hover{background:var(--accent-soft);color:var(--ink)}
#themeBtn{width:32px;height:32px;border-radius:8px;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#themeBtn:hover{background:var(--accent-soft);color:var(--ink)}
#themeBtn svg{width:17px;height:17px;display:block}
#menuPop{
  position:absolute;top:50px;right:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-big);padding:6px;min-width:200px;display:none;z-index:60;
}
#menuPop.open{display:block}
#menuPop button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-weight:500}
#menuPop button:hover{background:var(--accent-soft)}
#menuPop .sep{height:1px;background:var(--line);margin:5px 8px}
#menuPop .danger{color:var(--danger)}

/* ---------- pages ---------- */
main{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none}
.page.active{display:block}
.doc{height:100%;overflow-y:auto;padding:32px 20px 80px}
.doc-inner{max-width:920px;margin:0 auto}
.doc h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;text-wrap:balance}
.doc .sub{color:var(--ink2);margin-bottom:24px}

/* ---------- canvas ---------- */
/* The board is the window; the field is an unbounded plane moved under it by transform,
   so notes and clusters can sit at any coordinate, negative included. */
#board{
  position:absolute;inset:0;overflow:hidden;z-index:0; /* own stacking context, so raised notes stay under the toolbar */
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);
  background-size:24px 24px;
  cursor:grab;
  touch-action:none; /* drags on the canvas are ours: panning is done in script */
}
#board.panready{cursor:grab}
#board.panning{cursor:grabbing;user-select:none}
#board.drawing{cursor:crosshair}
#board.placing{cursor:crosshair} /* armed for a new note: the next click picks its spot */
#field{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.hint{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  color:var(--ink3);font-size:15px;text-align:center;pointer-events:none;user-select:none;
}
.hint b{color:var(--ink2)}

/* zones: the area itself lets pointers through so the canvas can be panned across it */
.zone{position:absolute;border-radius:14px;z-index:1;pointer-events:none}
.zone .zbg{position:absolute;inset:0;border-radius:14px;opacity:.10;pointer-events:none;transition:opacity .15s ease}
.zone.moving .zbg{opacity:.2}
.zone.moving .zborder{opacity:.85}
.zone .zborder{position:absolute;inset:0;border-radius:14px;border:1.5px dashed;opacity:.55;pointer-events:none}
.zone .zhead{
  position:absolute;top:-1px;left:10px;transform:translateY(-50%);
  display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:12px;font-weight:700;cursor:grab;user-select:none;white-space:nowrap;
  pointer-events:auto;
}
.zone .zhead:active{cursor:grabbing}
.zone .zcount{font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.zone .zdel{width:16px;height:16px;border-radius:50%;font-size:11px;line-height:1;color:var(--ink3);display:none;align-items:center;justify-content:center}
.zone .zhead:hover .zdel{display:flex}
.zone .zdel:hover{background:var(--danger-soft);color:var(--danger)}
.zone .zresize{position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;cursor:nwse-resize;border-radius:4px;pointer-events:auto}
.zone .zresize::after{content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);border-radius:1px}
#drawPreview{position:absolute;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:14px;z-index:5;display:none;pointer-events:none}

/* ---------- arrows between tasks ---------- */
/* The layer is a single pixel that lets its contents show, the same trick #field uses, so a
   line can be drawn at any plane coordinate, negative ones included. Not zero, as #field is:
   Chrome and everything built on it (Obsidian's web viewer included) draws nothing at all
   for an <svg> with an empty box, overflow or not, and only Firefox showed the arrows. It
   sits above the clusters (z-index 1) and below the cards (10 and up). */
#linkLayer{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;z-index:2;pointer-events:none}
#linkLayer .lline{stroke:var(--ink2);stroke-width:2;fill:none;stroke-linecap:round}
#linkLayer .lhead{fill:var(--ink2)}
/* A wide invisible stroke is the thing you actually have to hit to right-click an arrow. */
#linkLayer .lhit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:context-menu}
#linkLayer .linkg:hover .lline{stroke:var(--accent)}
#linkLayer .linkg:hover .lhead{fill:var(--accent)}
#linkGhost{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;fill:none;pointer-events:none}
#board.linking{cursor:crosshair}
.note.linksrc{outline:2.5px solid var(--accent);outline-offset:2px}

/* ---------- the board panels: "Laser focusing on", "Currently working on" and "Queue" ---------- */
/* Pinned to the view rather than the plane, so the lists are still there after you pan away.
   They share a column, so each one always sits under the one above however tall it grows. */
#panelStack{
  position:absolute;left:16px;top:16px;z-index:20;width:238px;max-width:calc(100% - 32px);
  max-height:calc(100% - 104px);          /* the toolbar owns the bottom of the board */
  display:flex;flex-direction:column;gap:10px;align-items:stretch;
  pointer-events:none;                    /* the gap between the panels belongs to the canvas */
}
.sidepanel{
  pointer-events:auto;min-height:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;
}
.sidepanel .tpHead{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 12px;cursor:pointer;user-select:none;
}
.sidepanel .tpHead:hover{background:var(--accent-soft)}
.sidepanel .tpChev{color:var(--ink3);font-size:10px;width:9px;flex:0 0 auto}
.sidepanel .tpTitle{flex:1;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidepanel .tpShort{display:none}
.sidepanel .tpCount{
  flex:0 0 auto;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);
  color:var(--accent-ink);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
/* The lists can be long at once, so each keeps its own cap and gives way from the bottom
   when the board is too short to hold them all. */
.sidepanel .tpBody{flex:0 1 auto;min-height:0;max-height:340px;overflow-y:auto;padding:0 6px 7px}
.sidepanel .tpEmpty{padding:2px 6px 8px;font-size:11.5px;line-height:1.5;color:var(--ink3)}
.sidepanel .tpRow{
  display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:9px;cursor:pointer;
}
.sidepanel .tpRow:hover{background:var(--accent-soft)}
.sidepanel .tpDot{flex:0 0 auto;width:9px;height:9px;border-radius:3px;border:1px solid rgba(0,0,0,.14)}
.sidepanel .tpText{flex:1;min-width:0;font-size:12.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* A row's own buttons (the laser target, start from the queue) and its way off the list,
   kept out of sight until the row is hovered. A lit laser target stays: it is the answer. */
.sidepanel .tpBtn{flex:0 0 auto;width:20px;height:20px;border-radius:6px;color:var(--ink3);display:flex;align-items:center;justify-content:center;visibility:hidden}
.sidepanel .tpBtn svg{width:13px;height:13px;display:block}
.sidepanel .tpX{flex:0 0 auto;width:20px;height:20px;border-radius:6px;color:var(--ink3);font-size:12px;line-height:1;visibility:hidden}
.sidepanel .tpRow:hover .tpX,.sidepanel .tpX:focus-visible,
.sidepanel .tpRow:hover .tpBtn,.sidepanel .tpBtn:focus-visible,.sidepanel .tpBtn.on{visibility:visible}
.sidepanel .tpX:hover{color:var(--danger);background:var(--danger-soft)}
.sidepanel .tpLaser:hover{color:var(--laser);background:var(--laser-soft)}
.sidepanel .tpLaser.on{color:var(--laser)}
.sidepanel .tpStart:hover{color:var(--work);background:var(--work-soft)}
/* Nothing to hover with on a touch screen, so the buttons are simply always there. */
@media (hover:none){ .sidepanel .tpX,.sidepanel .tpBtn{visibility:visible} }
/* Each list wears its own colour, so the panels are never mistaken for each other. */
/* Laser focusing on: one task, so it wears its colour in the title rather than a count.
   One row at most, and it is the point of the panel: never the one that gives way when
   the column runs out of room on a small screen. */
#laserPanel{flex:0 0 auto}
#laserPanel .tpHead:hover,#laserPanel .tpRow:hover{background:var(--laser-soft)}
#laserPanel .tpBody{max-height:none}
#laserPanel .tpTitle{color:var(--laser)}
#workPanel .tpHead:hover,#workPanel .tpRow:hover{background:var(--work-soft)}
#workPanel .tpTitle{color:var(--work)}
#workPanel .tpCount{background:var(--work);color:var(--work-ink)}
#workPanel .tpBody{max-height:220px}
#queuePanel .tpHead:hover,#queuePanel .tpRow:hover{background:var(--queue-soft)}
#queuePanel .tpCount{background:var(--queue);color:var(--queue-ink)}
#queuePanel .tpBody{max-height:260px}
/* The queue's rows are dragged into order, so pressing one must not start selecting text. */
#queuePanel .tpRow{user-select:none;-webkit-user-select:none}
.sidepanel .tpGrip{flex:0 0 auto;width:10px;height:16px;margin:0 -2px 0 -1px;color:var(--ink3);opacity:.55;cursor:grab;touch-action:none;display:flex}
.sidepanel .tpGrip svg{width:10px;height:16px;display:block}
.sidepanel .tpRow:hover .tpGrip{opacity:1}
#queuePanel .tpRow.dragging{background:var(--raise);box-shadow:var(--shadow);cursor:grabbing;position:relative;z-index:1}
#queuePanel .reordering .tpRow:not(.dragging){background:none}
@media (max-width:620px){
  /* Kept under the 45% band fitInset() reserves for these panels, so Fit can never park a
     task in a strip the panels are actually covering. Change one and change the other. */
  #panelStack{width:190px;left:10px;top:10px;max-height:calc(45% - 34px);gap:6px}
  /* Three lists in that band leave little room, so the queue gives way first, down to its
     header, and "Currently working on" keeps a row or two: its targets are the only way to
     pick the laser task. */
  #queuePanel{flex-shrink:20;min-height:38px}
  .sidepanel .tpLong{display:none}
  .sidepanel .tpShort{display:inline}
  /* The panel column owns the top-left here, so the first-run hint goes below it. */
  .hint{top:auto;bottom:24%;transform:translate(-50%,0)}
}
/* A phone on its side: the board is short, so every panel keeps at least its header (and can
   be tapped open), the laser panel gives way like the rest, and the titles are the short ones. */
@media (max-height:500px){
  #panelStack{width:190px;left:8px;top:8px;gap:6px;max-height:calc(100% - 20px)}
  .sidepanel{min-height:38px}
  #laserPanel{flex:0 1 auto}
  #queuePanel{flex-shrink:20}
  .sidepanel .tpLong{display:none}
  .sidepanel .tpShort{display:inline}
}

/* notes */
.note{
  position:absolute;width:178px;min-height:64px;padding:10px 26px 9px 34px;
  border-radius:3px 10px 3px 3px;color:var(--note-ink);
  box-shadow:0 1px 2px rgba(23,22,27,.14),0 5px 12px rgba(23,22,27,.14);
  cursor:grab;user-select:none;touch-action:none;
  transition:box-shadow .15s ease, transform .15s ease;
}
.note:hover{box-shadow:0 2px 4px rgba(23,22,27,.16),0 10px 22px rgba(23,22,27,.2)}
.note.editing{padding-right:12px} /* the marks are not drawn while typing, so give the width back */
.note.dragging{cursor:grabbing;transform:scale(1.04) rotate(-.6deg);box-shadow:0 6px 14px rgba(23,22,27,.2),0 18px 40px rgba(23,22,27,.28);z-index:999}
.note .chk{
  position:absolute;left:8px;top:9px;width:19px;height:19px;border-radius:50%;
  border:2px solid var(--note-ink2);background:rgba(255,255,255,.4);padding:0;
  display:flex;align-items:center;justify-content:center;
}
.note .chk svg{width:11px;height:11px;display:block}
.note .chk .tickpath{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14}
.note .chk:hover{border-color:var(--note-ink)}
.note .ntitle{font-size:13.5px;font-weight:600;line-height:1.3;word-wrap:break-word;white-space:pre-wrap}
.note .ntitle:empty::before{content:"Untitled";opacity:.4}
/* the one-press marks, kept out of the way until the task is hovered. Each keeps its own
   slot in the corner, so a lit one never shifts when the other one appears. */
.note .nbtns{position:absolute;right:4px;top:5px;display:flex;flex-direction:column;gap:2px;align-items:center}
.note .workbtn,.note .queuebtn{
  width:19px;height:19px;padding:0;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--note-ink2);
  opacity:0;pointer-events:none;transition:opacity .12s ease;
}
.note .workbtn svg,.note .queuebtn svg{width:14px;height:14px;display:block}
/* a queued task's place in line, where the queue icon was */
.note .queuebtn .qnum{font-size:11px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
/* Invisible must also mean untouchable, or a tap in that corner hits a target nobody can see. */
.note:hover .workbtn,.note:hover .queuebtn{opacity:.5;pointer-events:auto}
.note .workbtn:hover,.note .queuebtn:hover{opacity:1;background:rgba(255,255,255,.55)}
.note .workbtn.on{opacity:1;pointer-events:auto;color:#0E6B45}
.note .queuebtn.on{opacity:1;pointer-events:auto;color:#B4400C}
.note .workbtn:focus-visible,.note .queuebtn:focus-visible{opacity:1;pointer-events:auto}
/* A task on a list stands out where it sits, so it can be picked out among its neighbours
   inside a cluster without opening or reading anything. A task is queued or being worked
   on, never both, and the laser task is always one being worked on, so its ring is
   declared last and equal specificity resolves in its favour. */
.note.queued{outline:2.5px solid var(--queue);outline-offset:2px}
.note.working{outline:2.5px solid var(--work);outline-offset:2px}
.note.laser{outline:3px solid var(--laser);outline-offset:2px}
/* The picked start of an arrow outranks the list rings, or on a touch screen, where no
   dashed line follows a finger, there would be no sign of which task was picked. */
.note.linksrc{outline:3px solid var(--accent);outline-offset:3px}
/* No hover to reveal them on a touch screen, so they are simply always there, and bigger. */
@media (hover:none){
  .note .nbtns{right:2px;top:4px}
  .note .workbtn,.note .queuebtn{opacity:.45;pointer-events:auto;width:24px;height:24px}
}
.note.flash{animation:noteflash 1s ease}
@keyframes noteflash{0%,100%{box-shadow:0 1px 2px rgba(23,22,27,.14),0 5px 12px rgba(23,22,27,.14)}30%,60%{box-shadow:0 0 0 3px var(--accent),0 8px 20px rgba(23,22,27,.28)}}
.note .nmeta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10.5px;font-weight:700;color:var(--note-ink2)}
.note .nmeta:empty{display:none}
/* three dots: there is a description written inside this one */
.nmore{display:flex;gap:3px}
.nmore span{width:3.5px;height:3.5px;border-radius:50%;background:var(--ink3)}
.note .nmore{margin-top:6px}
.note .nmore span{background:var(--note-ink2)}
.note .ncat{letter-spacing:.05em;text-transform:uppercase;font-size:9.5px}
/* the points a task earns toward a gift */
.note .npts{margin-left:auto;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--note-ink2)}
.note .neditor{display:flex;flex-direction:column;gap:6px}
.note .nptsrow{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--note-ink2)}
.note .nptsin{width:58px;padding:3px 6px;border-radius:6px;border:1px solid var(--note-ink2);background:rgba(255,255,255,.4);color:var(--note-ink);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.note .nptsin:focus{outline:2px solid var(--note-ink);outline-offset:0}
.note .nptsin::placeholder{color:var(--note-ink2)}
.sptsin{width:86px}
.note.done{opacity:.55}
.note.done .ntitle{text-decoration:line-through;text-decoration-thickness:1.5px}
.note.done .chk{background:var(--good);border-color:var(--good)}
.note.done .chk .tickpath{animation:tick .3s ease forwards}
/* A card on its way to the archive keeps its element so it can fly off, which would
   otherwise leave its marks live and clickable for the length of the flight. Pressing one
   then would clear the mark for good, and un-ticking the task later would bring it back
   unmarked. */
.note.done .nbtns{display:none}
@keyframes tick{to{stroke-dashoffset:0}}
.note.flyoff{transition:transform .5s cubic-bezier(.5,0,.9,.4),opacity .5s ease;opacity:0 !important;pointer-events:none}
.note textarea{
  width:100%;background:transparent;border:none;resize:none;outline:none;
  font-size:13.5px;font-weight:600;line-height:1.3;color:var(--note-ink);overflow:hidden;
}
.dropchip{
  position:fixed;z-index:1200;padding:5px 12px;border-radius:999px;background:var(--ink);color:var(--paper);
  font-size:12px;font-weight:700;pointer-events:none;animation:chipin 1.1s ease forwards;white-space:nowrap;
}
@keyframes chipin{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* ---------- touch screens ---------- */
/* Holding a finger on a card, a tag or a bar is a gesture here (lift, delete, drag), so iOS
   must not start selecting text or open its callout under it. Fields still take text. */
#board,#rboard,.note,.zhead,.rhead,#toolbar,#rtoolbar,#panelStack,#topbar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#board textarea,#board input,#rboard textarea,#rboard input{-webkit-user-select:text;user-select:text}
button,.tab,.tpRow,.note,.zhead,.rhead,.meter{-webkit-tap-highlight-color:transparent}
/* The bars and panels are tapped, not zoomed: no double-tap zoom and no tap delay there. */
#topbar,#toolbar,#rtoolbar,#panelStack,.zonepop,#ctxmenu{touch-action:manipulation}
.sidepanel .tpBody{overscroll-behavior:contain}
/* A pinch or a pan moves the whole plane; letting the browser know keeps it smooth. */
#board.pinching #field,#board.panning #field,#rboard.pinching #rfield,#rboard.panning #rfield{will-change:transform}
@media (pointer:coarse){
  #themeBtn,#menuBtn{width:40px;height:40px}
  #syncChip{min-height:32px}
  .btn.small{min-height:36px}
  #menuPop button{padding:11px 14px}
  .doc,.chatlog,.rbody,.hwrap{overscroll-behavior:contain}
  .doc,.hcell,.acard{touch-action:manipulation}   /* quick taps on a day cell never zoom */
  .hcell,.acard,.seg,.chip{-webkit-tap-highlight-color:transparent}
  .xbtn,.pinbtn,.lnkbtn{width:36px;height:36px}
  .htable .htools button{width:30px;height:30px;font-size:13px}
  .rdel,.rshare{width:32px;height:32px}
  .rshare{opacity:.7}
  /* iOS zooms the whole page into any field set under 16px, and does not zoom back out. */
  input:not([type=checkbox]):not([type=radio]):not([type=range]),textarea:not(.ttl),select{font-size:16px !important}
  /* Anything held for the delete question must not start selecting text under the finger. */
  .lpdel{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .lpdel input,.lpdel textarea{-webkit-user-select:text;user-select:text}
  .lpdel a,.lpdel img{-webkit-touch-callout:default}
  /* Fingers are wider than what is drawn: the hit areas grow, the drawings do not. */
  .note .chk::before{content:"";position:absolute;inset:-10px;border-radius:50%}
  .note .nbtns{gap:8px}
  #linkLayer .lhit{stroke-width:30}
  .zone .zresize{width:30px;height:30px;right:-12px;bottom:-12px}
  .zone .zresize::after{right:11px;bottom:11px}
  .rresize{width:36px;height:36px}
  .rresize::after{right:9px;bottom:9px}
  .sidepanel .tpGrip{width:28px;height:34px;margin:-9px -10px;padding:9px}
}

/* toolbar */
#toolbar,#rtoolbar{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 24px);gap:4px;padding:5px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow-big);z-index:30;
}
#toolbar button,#rtoolbar button{
  display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;
}
#toolbar button:hover,#rtoolbar button:hover{background:var(--accent-soft)}
#toolbar button.primary,#rtoolbar button.primary{background:var(--accent);color:var(--accent-ink)}
#toolbar button.primary:hover,#rtoolbar button.primary:hover{background:var(--accent-hover)}
#toolbar button.on,#rtoolbar button.on{background:var(--ink);color:var(--paper)}
#toolbar svg,#rtoolbar svg{width:15px;height:15px;flex:0 0 auto}
/* On a phone the toolbar stays one row: a second row covers board, and toasts land on it. */
@media (max-width:430px){
  #toolbar,#rtoolbar{flex-wrap:nowrap;gap:2px;padding:4px}
  #toolbar button,#rtoolbar button{padding:9px 10px;gap:5px}
}
@media (pointer:coarse){
  #toolbar button,#rtoolbar button{min-height:42px}
}

/* ---------- routines: a board of written sequences ---------- */
/* Its own plane, with its own pan and zoom, so a long routine can be parked beside the ones
   it belongs with instead of competing with the tasks for room. */
#rboard{
  position:absolute;inset:0;overflow:hidden;z-index:0;
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);
  background-size:24px 24px;
  cursor:grab;touch-action:none;
}
#rboard.panning{cursor:grabbing;user-select:none}
#rfield{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.rcard{
  position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);
}
.rcard.dragging{box-shadow:var(--shadow-big);z-index:999}
.rhead{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 13px;
  border-bottom:1px solid var(--line);background:var(--raise);
  cursor:grab;user-select:none;touch-action:none;
}
.rhead:active{cursor:grabbing}
.rtitle{
  flex:1;min-width:0;font-weight:800;font-size:14px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:text;border-radius:6px;padding:1px 5px;margin:-1px -5px;
}
.rtitle:hover{background:var(--accent-soft)}
.rtitle:empty::before{content:"Untitled routine";opacity:.45}
.rtitleedit{
  flex:1;min-width:0;font:inherit;font-weight:800;font-size:14px;line-height:1.3;
  border:none;outline:none;background:transparent;color:var(--ink);padding:1px 5px;margin:-1px -5px;
}
.rdel{flex:0 0 auto;width:22px;height:22px;border-radius:7px;color:var(--ink3);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.rdel:hover{color:var(--danger);background:var(--danger-soft)}
/* the one mark that says whether this routine is shared, and opens the panel for it */
.rshare{flex:0 0 auto;width:22px;height:22px;border-radius:7px;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.3;filter:grayscale(1)}
.rhead:hover .rshare{opacity:.7}
.rshare:hover{opacity:1;filter:none;background:var(--accent-soft)}
.rshare.on{opacity:1;filter:none}
.rsharepop{
  position:fixed;z-index:1450;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-big);padding:12px;width:280px;max-width:calc(100vw - 24px);
}
.rsharepop .sharebox{border-top:none;padding-top:0}
.rbody{flex:1;min-height:0;overflow-y:auto;padding:11px 14px 13px}
.rbody .mdbody{margin:0;padding:0;font-size:13px}
.rbody .descadd{font-size:12.5px}
.rbodyedit{
  width:100%;height:100%;min-height:70px;border:none;outline:none;resize:none;background:transparent;
  font:inherit;font-size:13px;line-height:1.55;color:var(--ink2);
}
.rresize{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none}
.rresize::after{content:"";position:absolute;right:6px;bottom:6px;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);border-radius:1px}
/* an embedded video, with a way through underneath: a strict content policy blocks the
   frame outright, and without the link the video would just be a black box */
.mdbody .ytwrap{position:relative;width:100%;padding-top:56.25%;margin:10px 0 5px;border-radius:10px;overflow:hidden;background:#0D0D10;border:1px solid var(--line)}
.mdbody .ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mdbody a.ytlink{display:inline-block;font-size:11.5px;margin-bottom:10px}

/* ---------- shared controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;
  font-weight:700;font-size:13px;border:1px solid var(--line2);background:var(--surface);
}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:7px}
.input,select.input{
  padding:7px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);
  font-size:13.5px;min-width:0;
}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.input::placeholder{color:var(--ink3)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  border:1px solid var(--line2);font-size:12px;font-weight:700;background:var(--surface);
}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.label{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* ---------- modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.open{display:block}
.overlay{position:absolute;inset:0;background:rgba(23,22,27,.35);animation:fadein .15s ease}
@keyframes fadein{from{opacity:0}}
.sheet{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 32px));max-height:min(680px,calc(100% - 24px));
  background:var(--surface);border-radius:16px;box-shadow:var(--shadow-big);
  display:flex;flex-direction:column;overflow:hidden;animation:sheetin .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes sheetin{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}}
.sheet .ctab{height:6px;flex:0 0 auto}
.sheet .sbody{padding:20px 24px 22px;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain}
.sheet .srow{display:flex;align-items:flex-start;gap:12px}
.sheet .bigchk{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line2);margin-top:4px;display:flex;align-items:center;justify-content:center;padding:0}
.sheet .bigchk:hover{border-color:var(--good)}
.sheet .bigchk.done{background:var(--good);border-color:var(--good)}
.sheet .bigchk svg{width:13px;height:13px}
.sheet .bigchk .tickpath{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sheet .ttl{
  flex:1;border:none;outline:none;background:transparent;resize:none;overflow:hidden;
  font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.25;
}
/* description: rendered Markdown, swapping to its plain source while you edit */
.sheet .descwrap{margin:6px 0 0 38px;max-width:calc(100% - 38px)}
.sheet .desc{
  width:100%;border:none;outline:none;background:transparent;resize:none;overflow:hidden;
  color:var(--ink2);font-size:13.5px;font-family:inherit;
}
.descadd{color:var(--ink3);font-size:13px;padding:2px 0;text-align:left}
.descadd:hover{color:var(--accent)}
.mdbody{
  color:var(--ink2);font-size:13.5px;line-height:1.55;cursor:text;
  border-radius:8px;padding:3px 5px;margin:0 -5px;overflow-wrap:anywhere;
}
.mdbody:hover{background:var(--accent-soft)}
.mdbody>*:first-child{margin-top:0}
.mdbody>*:last-child{margin-bottom:0}
.mdbody p{margin:0 0 8px}
.mdbody h3{font-size:15px;font-weight:800;color:var(--ink);margin:13px 0 5px}
.mdbody h4{font-size:13.5px;font-weight:800;color:var(--ink);margin:11px 0 4px}
.mdbody h5,.mdbody h6{font-size:12px;font-weight:800;color:var(--ink2);margin:11px 0 4px;letter-spacing:.05em;text-transform:uppercase}
.mdbody ul,.mdbody ol{margin:0 0 8px;padding-left:20px}
.mdbody li{margin:2px 0}
.mdbody a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.mdbody strong{color:var(--ink);font-weight:800}
.mdbody code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.mdbody pre{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:0 0 8px;overflow-x:auto}
.mdbody pre code{background:none;border:none;padding:0}
.mdbody blockquote{margin:0 0 8px;padding:2px 0 2px 12px;border-left:3px solid var(--line2);color:var(--ink3)}
.mdbody hr{border:none;border-top:1px solid var(--line);margin:13px 0}
.mdbody img{max-width:100%;height:auto;display:block;margin:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--raise)}
.mdbody .mdbox{display:inline-block;width:11px;height:11px;border:1.5px solid var(--line2);border-radius:3px;margin-right:6px;vertical-align:-1px}
.mdbody .mdbox.on{background:var(--good);border-color:var(--good)}
.sheet .sec{margin-top:20px}
.sheet .sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.newcat{display:flex;gap:6px;margin-top:8px}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.meta .mitem{display:flex;flex-direction:column;gap:2px}
.meta .mval{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--raise)}
.sfoot .screated{font-size:11.5px;font-weight:700;color:var(--ink3);white-space:nowrap}
/* the task's category, sitting with the dates rather than taking a section of its own */
.sfoot .catbtn{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line2);background:var(--surface);font-size:12px;font-weight:700;
  color:var(--ink2);min-width:0;max-width:180px;
}
.sfoot .catbtn:hover{border-color:var(--ink3);color:var(--ink)}
.sfoot .catbtn .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.sfoot .catbtn .dot.nodot{border:1px dashed var(--ink3)}
.sfoot .catbtn .catname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catpop{
  position:fixed;z-index:1450;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-big);padding:12px;width:280px;max-width:calc(100vw - 24px);
}
.catpop .label{display:block;margin-bottom:9px}
@media (max-width:520px){
  .sfoot{flex-wrap:wrap}
  .sfoot .catbtn{max-width:130px}
  .sheet .sbody{padding:16px 18px 18px}
}

/* the on-device backups, listed in the restore sheet */
.bakrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.bakrow .bakinfo{flex:1;min-width:0}
.bakrow .bakwhen{font-weight:800;font-size:13.5px}
.bakrow .bakwhat{font-size:12px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.bakrow .bakwhy{font-size:11.5px;color:var(--ink3);margin-top:2px}
.bakempty{font-size:12.5px;color:var(--ink3);line-height:1.5;padding:2px 0 6px}

/* ---------- archive ---------- */
.filters{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.filters .frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .daterange{display:inline-flex;gap:8px;align-items:center;flex-wrap:nowrap;min-width:0;max-width:100%}
.filters input[type=date]{min-height:36px;min-width:0;flex:1 1 0}
@media (max-width:520px){ .filters .daterange{display:flex;flex:1 1 100%} }
.filters .grow{flex:1;min-width:180px}
.count{color:var(--ink2);font-size:13px;margin-bottom:12px}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.acard:hover{border-color:var(--line2);box-shadow:var(--shadow)}
/* the dots line up with the chips beside them here */
.acard .nmore{margin:0;flex:0 0 auto}
.acard .atop{display:flex;align-items:flex-start;gap:8px}
.acard .atick{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--good);display:flex;align-items:center;justify-content:center;margin-top:1px}
.acard .atick svg{width:9px;height:9px}
.acard .atitle{font-weight:700;font-size:14px;line-height:1.3;flex:1;min-width:0;overflow-wrap:anywhere}
.acard .adates{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.acard .abot{display:flex;align-items:center;gap:8px;margin-top:2px}
.acard .spacer{flex:1}
.minichip{min-width:0;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.minichip .dot{width:7px;height:7px;border-radius:50%}
/* right-click delete popup */
#ctxmenu{
  position:fixed;z-index:1500;background:var(--surface);border:1px solid var(--line2);
  border-radius:12px;box-shadow:var(--shadow-big);padding:12px 14px;max-width:280px;
  animation:ctxin .1s ease;
}
@keyframes ctxin{from{opacity:0;transform:scale(.96)}}
#ctxmenu .ctxq{font-size:13px;line-height:1.4;margin-bottom:10px}
#ctxmenu .ctxq b{font-weight:700}
#ctxmenu .ctxrow{display:flex;gap:8px;justify-content:flex-end}
#ctxmenu .ctxyes{background:var(--danger);border-color:var(--danger);color:#fff}
#ctxmenu .ctxyes:hover{filter:brightness(1.08)}

/* ---------- goals ---------- */
/* minmax(0,1fr), not 1fr: a column must never be widened by what is in it (a long goal name
   in a select made the whole page scroll sideways on a phone). */
.gsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.gsplit{grid-template-columns:minmax(0,1fr)}}
select.input{max-width:100%}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.gcard .ghead{display:flex;align-items:center;gap:8px}
.gcard .gname{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.gcard .gmeta{font-size:12px;color:var(--ink2);margin-top:2px}
.gcard .gbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.gcard .gtrack{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gcard .gfill{height:100%;border-radius:4px;background:var(--accent);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.gcard .gfill.full{background:var(--good)}
.gcard .gnum{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.gcard.donegoal{border-color:var(--good)}
.gdone-tag{display:inline-flex;align-items:center;gap:5px;color:var(--good);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pinbtn{width:26px;height:26px;border-radius:7px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.pinbtn:hover{background:var(--accent-soft)}
.pinbtn.on{color:var(--accent)}
.xbtn{width:26px;height:26px;border-radius:7px;color:var(--ink3);font-size:15px}
.xbtn:hover{color:var(--danger);background:var(--danger-soft)}
.newform{background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.newform .frow{display:flex;gap:8px;flex-wrap:wrap}
.wish-state{font-size:12px;font-weight:700}
.wish-state.locked{color:var(--ink3)}
.wish-state.unlocked{color:var(--accent)}
.claimed .gname{text-decoration:line-through;color:var(--ink3)}

/* wishlist cards with a product picture */
.gcard.wcard{display:flex;gap:12px;align-items:flex-start}
@media (max-width:360px){ .gcard.wcard .ghead{flex-wrap:wrap} .gcard.wcard .ghead .gname{flex:1 1 100%} }
.wthumbwrap{
  flex:0 0 auto;display:block;width:58px;height:58px;border-radius:9px;overflow:hidden;
  background:var(--raise);border:1px solid var(--line);
}
a.wthumbwrap:hover{border-color:var(--accent)}
.wthumb{width:100%;height:100%;object-fit:contain;display:block}
.wmain{flex:1;min-width:0}
.gname.wlink{color:inherit;text-decoration:none}
.gname.wlink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
/* a claimed reward stays struck through even when its title is a link */
.claimed .gname,.claimed .gname.wlink,.claimed .gname.wlink:hover{text-decoration:line-through;color:var(--ink3)}
.lnkbtn{width:26px;height:26px;border-radius:7px;color:var(--ink3);font-size:13px;line-height:1}
.lnkbtn:hover{background:var(--accent-soft);color:var(--ink)}
.wdays{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.wdayslab{font-size:12px;color:var(--ink2);white-space:nowrap}
.newform .grow{flex:1 1 170px;min-width:0}
.wprev{margin-top:12px}
.wprev img{max-width:150px;max-height:150px;border-radius:10px;border:1px solid var(--line);background:var(--raise);display:block}

/* ---------- friends ---------- */
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.fhead .label{flex:1;min-width:80px}
.frefresh .ric{display:inline-block;font-size:13px;line-height:1}
.frefresh.spinning .ric{animation:rspin .8s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
.frefresh:disabled{opacity:.6;cursor:default}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fid{display:flex;align-items:center;gap:10px}
.fid .fwho{flex:1;min-width:0}
.favatar{position:relative;flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--note-ink);overflow:hidden;user-select:none}
.favatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmail{font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgbtn{position:relative}
.msgbadge{position:absolute;top:-7px;right:-7px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--danger);color:var(--paper);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fhb{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.fhb .fhname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.fhb .strip7{display:flex;gap:2px;flex:0 0 auto}
/* fixed so the seven squares line up under their weekday letters on every row */
.fhb .fhstreak{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:0 0 auto;white-space:nowrap;min-width:72px;text-align:right}
.fhb.fhbhead{padding:0 0 1px}
.fhb .sqlab{width:12px;font-size:8.5px;font-weight:800;line-height:1;text-align:center;color:var(--ink3)}
.fstale{font-size:11px;color:var(--ink3)}
.freq{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;flex-wrap:wrap}
.freq .ftext{flex:1;font-size:13px;min-width:150px}
.fwait{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:8px 2px}
/* the add-a-friend picker: a search result, then the people you already know */
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.plabel{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:14px 2px 2px}
.pwho{flex:1;min-width:0}
/* chat */
.chatlog{height:min(320px,45vh);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:12px;
  background:var(--raise);border:1px solid var(--line);border-radius:12px}
.cmsg{max-width:82%;padding:7px 11px;border-radius:13px;font-size:13.5px;line-height:1.4;overflow-wrap:break-word;white-space:pre-wrap}
.cmsg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.cmsg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.cday{align-self:center;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:6px 0 2px}
.crow{display:flex;gap:8px;margin-top:12px}
.crow .input{flex:1}
.cempty{align-self:center;color:var(--ink3);font-size:12.5px;padding:20px 10px;text-align:center}

/* ---------- toast / misc ---------- */
/* Spans the width and centres its toasts: a box pinned at left:50% could only ever use the
   right half of a narrow screen, which folded messages into a sliver on a phone. */
#toastRoot{position:fixed;left:0;right:0;bottom:24px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 12px;pointer-events:none}
#toastRoot .toast{pointer-events:auto}
/* The canvas keeps its toolbar at the bottom centre, which is exactly where messages land.
   On that page they sit above it, so Undo never covers the buttons. */
body.canvasview #toastRoot{bottom:78px}
.toast{
  display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:12px;
  background:var(--ink);color:var(--paper);font-weight:600;font-size:13px;box-shadow:var(--shadow-big);
  animation:toastin .2s cubic-bezier(.2,.9,.3,1.2);max-width:min(480px,90vw);
}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}}
.toast button{color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;flex:0 0 auto;padding:8px 10px;margin:-8px -10px -8px 0}
/* Up to three lines rather than an ellipsis: a cut-off warning is worse than a tall one. */
.toast .tmsg{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;line-height:1.35}
#storageNote{
  position:fixed;left:16px;bottom:16px;z-index:250;max-width:280px;display:none;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-big);
  padding:12px 14px;font-size:12.5px;color:var(--ink2);
}
#storageNote b{color:var(--ink)}
#storageNote button{float:right;color:var(--ink3);font-size:14px;margin:-4px -6px 0 6px}
.confetto{position:fixed;width:8px;height:8px;z-index:400;pointer-events:none;animation:confall .9s ease-in forwards}
@keyframes confall{to{transform:translateY(120px) rotate(340deg);opacity:0}}
/* Fixed to the viewport, not to the canvas plane: the zoom must never shrink the colour
   targets, and a cluster drawn near the bottom still needs a popover you can reach. */
.zonepop{
  position:fixed;z-index:1400;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-big);padding:12px;display:flex;flex-direction:column;gap:9px;width:230px;
}
.zonepop{width:250px}
.zonepop .dots{display:flex;gap:7px;flex-wrap:wrap}
.zonepop .cdot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.zonepop .cdot:hover{border-color:var(--line2)}
.zonepop .cdot.on{border-color:var(--ink)}
.zone .zshared{font-size:11px;line-height:1;flex:0 0 auto}
.sharebox{border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:7px}
.sharenote{font-size:11.5px;color:var(--ink3);line-height:1.45}
.sharerow{display:flex;align-items:center;gap:7px}
.sharename{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sharepick{display:flex;gap:6px;align-items:center}
.empty{color:var(--ink3);text-align:center;padding:40px 20px;font-size:14px}

/* ---------- welcome gate ---------- */
#welcome{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#welcome .wcard{margin:auto}   /* centred when it fits, scrolls from the top when it does not */
@media (max-height:480px){
  #welcome .wcard{padding:18px 24px 14px}
  #welcome .wseal{display:none}
  #welcome h1{font-size:24px;margin:0 0 4px}
  #welcome .wlede{margin-bottom:12px}
}
#welcome .woverlay{position:absolute;inset:0;background:var(--paper);opacity:.97}
#welcome .wcard{
  position:relative;width:min(420px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow-big);padding:34px 32px 24px;text-align:center;
  animation:sheetin .22s cubic-bezier(.2,.9,.3,1.2);
}
#welcome .wseal{width:32px;height:56px;margin:0 auto}
#welcome h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:8px 0 6px}
#welcome .wlede{color:var(--ink2);font-size:14px;line-height:1.5;margin-bottom:22px;text-wrap:balance}
#welcome .wbtn{width:100%;justify-content:center;padding:11px 16px;font-size:14.5px;border-radius:11px}
#welcome .gmark{
  display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;
  background:var(--accent-ink);color:var(--accent);font-weight:800;font-size:12.5px;flex:0 0 auto;
}
#welcome .werr{color:var(--danger);font-size:12px;font-weight:600;line-height:1.45;margin-top:12px}
#welcome .werr:empty{display:none}
#welcome .wfine{color:var(--ink3);font-size:11.5px;line-height:1.5;margin-top:12px}
#welcome .wskip{margin-top:16px;color:var(--ink3);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
#welcome .wskip:hover{color:var(--ink)}

/* ---------- notice bar & sync chip ---------- */
#noticeBar{flex:0 0 auto;display:flex;flex-direction:column;z-index:35}
.notice{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:12.5px;font-weight:600;background:var(--danger-soft);border-bottom:1px solid var(--line)}
.notice .nico{color:var(--danger);flex:0 0 auto}
.notice .ntext{flex:1}
.notice .ndis{color:var(--ink3);font-size:14px;flex:0 0 auto}
.notice .ndis:hover{color:var(--ink)}
#syncChip{display:none;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;border:1px solid var(--line2);font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
#syncChip.show{display:inline-flex}
#syncChip:hover{border-color:var(--ink3)}
#syncChip .sdot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:0 0 auto}
#syncChip.ok .sdot{background:var(--good)}
#syncChip.err .sdot{background:var(--danger)}
#syncChip.busy .sdot{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- daily-goal sheet ---------- */
.hsheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hsheet-head .label{flex:1;min-width:0}
.hreset{flex:0 0 auto;white-space:nowrap}
.hwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:22px}
table.htable{border-collapse:separate;border-spacing:0;width:100%;min-width:620px}
.htable th,.htable td{border-bottom:1px solid var(--line);padding:0;text-align:center}
.htable tr:last-child td{border-bottom:none}
.htable thead th{padding:8px 3px 6px;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.htable thead th .dnum{display:block;font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.htable th.hname,.htable td.hname{position:sticky;left:0;background:var(--surface);text-align:left;padding:8px 12px;min-width:160px;max-width:230px;z-index:2}
/* On a phone the name column gives most of its width to the days. */
@media (max-width:520px){
  .htable th.hname,.htable td.hname{min-width:96px;max-width:124px;padding:6px 8px;font-size:12.5px;overflow-wrap:anywhere}
  .htable td.hname > span:first-child{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
}
.htable td.hname{font-weight:600;font-size:13px}
.htable td.hname .htools{visibility:hidden;display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.htable tr:hover td.hname .htools{visibility:visible}
/* Nothing to hover with on a touch screen, so a goal's own tools are simply always there. */
@media (hover:none){ .htable td.hname .htools{visibility:visible} }
.htable .htools button{width:20px;height:20px;border-radius:5px;color:var(--ink3);font-size:11px;line-height:1}
.htable .htools button:hover{background:var(--accent-soft);color:var(--ink)}
.htable .todaycol{background:var(--accent-soft)}
/* days that have not happened yet: there to be seen, not to be marked */
.htable td.futurecol,.htable th.futurecol{opacity:.4}
.htable td.futurecol .hcell{cursor:default}
.htable td.futurecol .hcell:hover{background:none}
.hcell{width:36px;height:36px;padding:0;border-radius:0;display:inline-flex;align-items:center;justify-content:center;transition:background .1s ease}
.hcell:hover{background:var(--accent-soft)}
.hcell.c-green{background:var(--good)}
.hcell.c-blue{background:var(--rest)}
.hcell.c-yellow{background:var(--warn)}
.hcell.c-red{background:var(--danger)}
.htable td.hname input{width:100%;border:none;outline:none;background:transparent;font:inherit}
.hsheetwrap{margin-bottom:10px}
/* the add box lives below the grid, never inside it, so horizontal scroll cannot hide it */
.haddbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:22px}
.haddbox:focus-within{border-color:var(--accent)}
.haddbox input{width:100%;border:none;outline:none;background:transparent;padding:11px 14px;font-size:13px;border-radius:12px}
/* the browser's faded default left this at 3.3:1 on the dark surface, and this box is the
   only way onto the page when there are no goals yet */
.haddbox input::placeholder{color:var(--ink2);opacity:1}
.hempty{color:var(--ink3);font-size:12.5px;line-height:1.55;margin-bottom:10px}
.todaychip{font-size:11.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- archive view switch & goal history ---------- */
.segbar{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--raise);border:1px solid var(--line);margin-bottom:18px}
.seg{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg:hover{color:var(--ink)}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ghist-sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.ghist-row{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ghist-row:last-child{border-bottom:none}
.ghr-name{font-weight:700;font-size:13.5px;flex:1;min-width:130px}
.ghr-tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-left:7px}
.ghr-pct{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.ghr-detail{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ghr-acts{display:flex;gap:6px;flex-basis:100%}   /* a retired goal's Resume and Delete, on their own line */
.htable.hmonth{min-width:0}
.htable.hmonth .hcell{width:26px;height:26px}
.htable.hmonth th.hname,.htable.hmonth td.hname{min-width:140px;max-width:190px;font-size:12.5px}
.htable.hmonth thead th{padding:6px 2px 5px}
.htable.hmonth td.futurecol{opacity:.35}
.htable.hmonth td.futurecol .hcell{cursor:default}

/* ---------- shared: day squares, page sections, small goal bars ---------- */
.sq{width:12px;height:12px;border-radius:3px;background:var(--line)}
.sq.c-green{background:var(--good)}
.sq.c-blue{background:var(--rest)}
.sq.c-yellow{background:var(--warn)}
.sq.c-red{background:var(--danger)}
.dsec{margin-top:26px}
.dsec>.label{display:block;margin-bottom:10px}
.minigoal{display:flex;align-items:center;gap:10px;padding:7px 0}
.minigoal .mgname{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:13px}
.minigoal .gtrack{flex:2;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.minigoal .gnum{font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- sleep ---------- */
/* points, and what they are closest to buying */
.slpts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 10px 9px 16px;margin-bottom:18px}
.slptsnum{font-weight:800;font-size:15px;white-space:nowrap}
.slptsaim{flex:1;min-width:0;color:var(--ink2);font-size:12.5px;overflow-wrap:anywhere}
/* which night, with a step back and forward */
.slhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.slnight{font-weight:800;font-size:15px}
.slnavbtn{width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1;color:var(--ink2);border:1px solid var(--line2);background:var(--surface)}
.slnavbtn:hover:not(:disabled){border-color:var(--ink3);color:var(--ink)}
.slnavbtn:disabled{opacity:.35;cursor:default}
/* the checklist: each row is one button, so the whole row is the target */
.sllist{display:flex;flex-direction:column;gap:6px}
.slrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.slrow:hover{border-color:var(--line2)}
.slchk{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;margin-top:1px}
.slchk svg{width:12px;height:12px;display:block}
.slchk .tickpath{stroke:transparent;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.slrow.on .slchk{background:var(--good);border-color:var(--good)}
.slrow.on .slchk .tickpath{stroke:#fff}
.slrow.on .sltext{color:var(--ink2)}
.slbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sltime{font-size:11.5px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.sltext{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.slpt{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:2px}
.slrow.on .slpt{color:var(--ink)}
.slfoot{display:flex;align-items:center;gap:10px;margin-top:12px}
.slsum{flex:1;min-width:0;font-size:12.5px;color:var(--ink2)}
.slwatch{margin-top:10px;font-size:12.5px;color:var(--ink2)}
/* editing the list */
.sledit{display:flex;flex-direction:column;gap:8px}
.sleditrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.sleditrow .grow{flex:1 1 220px;min-width:0}
.sleditnew{border-style:dashed;border-color:var(--line2)}
.sltimein{width:122px}
.slptsin{width:64px}
.sleditbtns{display:flex;gap:2px;margin-left:auto;align-items:center}
.lnkbtn:disabled{opacity:.3;cursor:default}
/* nights from Apple Health */
.slimport .ghead{flex-wrap:wrap}
.slhelp{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-top:6px}
.slprog{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.slprogfill{height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .2s ease}
.sltiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 0}
.sltile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.slval{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sllab{font-size:11.5px;color:var(--ink2);margin-top:2px}
.slnote{font-size:11.5px;color:var(--ink3);margin:6px 0 14px}
.slchartcard .ghead{margin-bottom:8px}
.slchartcard .slnote{margin-bottom:0}
.slchart{display:flex;flex-direction:column}
/* one row per night: the date, the night drawn on a shared clock, how long it was */
.slcrow{display:grid;grid-template-columns:58px minmax(0,1fr) 62px;column-gap:10px;align-items:center;width:100%;text-align:left;min-height:28px;border-radius:7px;padding:0 4px;color:var(--ink)}
button.slcrow:hover,.slcrow.open{background:var(--accent-soft)}
.sltrack{position:relative;display:block;height:24px}
.slaxis .sltrack{height:16px}
.slgrid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.sltick{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.slbar{position:absolute;top:6px;height:12px;border-radius:4px;background:var(--accent)}
.slbar.inbed{background:var(--line2)}
.slday{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.sldur{font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.slempty .slday,.slempty .sldur{color:var(--ink3);font-weight:500}
.slndetail{font-size:12.5px;color:var(--ink2);line-height:1.55;padding:6px 8px 10px 72px}
/* the log and the notes */
.sllogin{width:100%;resize:vertical;min-height:72px;line-height:1.5}
.newform .frow .slsum{align-self:center}
.sllogdate{flex:1;min-width:0;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.sllogtext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.55;margin:6px -5px 0;padding:3px 5px;border-radius:8px;cursor:text}
.sllogtext:hover{background:var(--accent-soft)}
.sllog .sllogin{margin-top:6px}
.sllognew{margin-bottom:10px}
.slnotesedit{width:100%;border:none;outline:none;background:transparent;resize:none;overflow:hidden;color:var(--ink);font-size:13.5px;line-height:1.55;font-family:inherit;min-height:160px}

/* ---------- gifts ---------- */
/* the balance: as wide as what it says, with where the points came from on its right */
.gfbal{display:flex;align-items:center;column-gap:12px;row-gap:6px;flex-wrap:wrap;width:fit-content;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin:14px 0 18px}
.gfbalnum{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gfballab{font-weight:700;margin-right:12px}   /* the space before the sources, which then line up on the left if they wrap */
.gfbalsub{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.gfnew{margin-top:6px}
.gfnew .grow{flex:1 1 170px;min-width:0}
.gfnew .frow{align-items:center}
.gfred{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gfred:last-child{border-bottom:none}
.gfredname{font-weight:700;font-size:13.5px;flex:1;min-width:120px;overflow-wrap:anywhere}
.gfredmeta{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
@media (max-width:470px){
  /* the three averages stack, each a label and its value on one line */
  .sltiles{grid-template-columns:1fr;gap:6px}
  .sltile{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px}
  .slval{font-size:17px;order:2}
  .sllab{margin-top:0}
  .slcrow{grid-template-columns:46px minmax(0,1fr) 54px;column-gap:6px}
  .slndetail{padding-left:8px}
  /* an item being edited: its time and its buttons on one line, its words and points below */
  .sleditrow .sleditbtns{order:1}
  .sleditrow .grow,.sleditrow .slptsin{order:2}
}

/* ---------- settings ---------- */
.setsec{margin-bottom:22px}
.setsec .frow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.setsec .grow{flex:1;min-width:170px}
.setnote{font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.5}
.okline{font-size:12.5px;font-weight:700;color:var(--good)}
.errline{font-size:12.5px;font-weight:700;color:var(--danger)}
/* Six tabs need a wide bar. Narrower than this, the four everyday pages keep their tabs, and
   Routines and the Archive, the pages you visit now and then, move under Settings.
   Measured with the unread badge on Goals: tablets in portrait (744 to 834px) would otherwise
   clip the end of the strip. The working tabs then hold the rest of the bar at the far end. */
@media (max-width:840px){

function placeToasts() {
  const root = $('#toastRoot');
  if (!root) return;
  const tb = pageName === 'canvas' ? $('#toolbar') : pageName === 'routines' ? $('#rtoolbar') : null;
  const r = tb && tb.getBoundingClientRect();
  root.style.bottom = r && r.height ? Math.max(24, innerHeight - r.top + 10) + 'px' : '';
}
// Every save bumps this. An Undo offer is only good while nothing else has been saved
// since: the snapshot is the WHOLE board, so replaying it over later work would silently
// throw that work away.
let saveGen = 0;
function snapshot() { return JSON.stringify(STATE); }
// An undo is a change made here on top of the version the board matches now, so the board
// keeps its current sync base rather than the older one the snapshot was taken with.
function restore(snap) {
  const meta = STATE && STATE.meta ? STATE.meta : {};
  STATE = JSON.parse(snap);
  if (STATE.meta) {
    if (meta.syncBase) STATE.meta.syncBase = meta.syncBase; else delete STATE.meta.syncBase;
    if (meta.sentTs) STATE.meta.sentTs = meta.sentTs; else delete STATE.meta.sentTs;
  }
  save(); renderAll();
}
function undoableAction(msg, mutate) {
  const snap = snapshot();
  mutate();
  save(); renderAll();
  const gen = saveGen;
  toast(msg, () => {
    if (saveGen !== gen) { toast('The board has changed since then. Settings, Restore a backup has the older copies', null, 6000); return; }
    restore(snap);
  });
}

/* ---------- gamification helpers ---------- */
function completedNotes() { return STATE.notes.filter(n => n.completedAt); }
function goalCount(g) {
  return completedNotes().filter(n => inPeriod(n.completedAt, g.period) && (!g.catId || n.catId === g.catId)).length;
}
function goalMet(g) { return goalCount(g) >= g.target; }
function confetti(x, y) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = PAL.map(p => p.bg).concat(['#2B3FD6']);
  for (let i = 0; i < 22; i++) {
    const c = h('div.confetto', {
      style: {
        left: (x + (Math.random() * 120 - 60)) + 'px', top: (y + (Math.random() * 30 - 15)) + 'px',
        background: colors[i % colors.length],
        borderRadius: Math.random() > .5 ? '50%' : '2px',
        animationDelay: (Math.random() * .18) + 's',

}
// called after any completion change: pulse meters, celebrate newly met goals
let metBefore = {};
function completionChanged() {
  renderMeters(true);
  // A task ticked off leaves both board lists at once, rather than lingering there for the
  // second it spends flying to the archive.
  renderSidePanels();
  for (const g of STATE.goals) {
    const met = goalMet(g);
    if (met && !metBefore[g.id]) {
      const at = burstFrom($('#meters'));
      confetti(at.x, at.y);
      toast('Goal reached: ' + g.name + ' 🎉', null, 3500);
    }
    metBefore[g.id] = met;
  }
}

// Where a celebration bursts from: the first of these that is on screen, or else the top
// middle of the window. On screen means in view, not just drawn: the confetti only falls a
// short way, so a burst from a header scrolled off the top would never be seen.
function burstFrom(...els) {
  for (const el of els) {
    const r = el && el.getBoundingClientRect();
    if (r && r.width && r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth) return { x: r.left + r.width / 2, y: r.bottom + 10 };
  }
  return { x: innerWidth / 2, y: 60 };
}

/* ---------- phones: Back, the keyboard, and the overlay ---------- */
function wireMobileShell() {
  const root = $('#modalRoot');
  // A sheet's history entry that outlived a reload would make the next Back reload Dayu.
  if (history.state && history.state.dayuSheet) { try { history.back(); } catch (e) { /* nothing to undo */ } }
  // Android's Back button (and an edge swipe on iPhone) closes the open sheet rather than
  // leaving Dayu. Opening a sheet adds a history entry at the same address, so Back lands
  // on it; closing the sheet any other way takes that entry back out.
  let backArmed = false, poppingBack = false;
  new MutationObserver(() => {
    const open = root.classList.contains('open');
    if (open && !backArmed) {
      backArmed = true;
      try { history.pushState({ dayuSheet: 1 }, '', location.href); } catch (e) { backArmed = false; }
    } else if (!open && backArmed) {
      backArmed = false;
      if (!poppingBack && history.state && history.state.dayuSheet) { try { history.back(); } catch (e) { /* nothing to undo */ } }
      poppingBack = false;
    }
  }).observe(root, { attributes: true, attributeFilter: ['class'] });
  window.addEventListener('popstate', () => {
    if (!backArmed || !root.classList.contains('open')) return;
    poppingBack = true;
    closeModal();
    if (root.classList.contains('open')) poppingBack = false;   // it refused to close
  });
  // The on-screen keyboard shrinks only the visible part of the page, not the layout, so a
  // sheet centred in the layout ends up under the keyboard. The sheet layer follows the
  // visible part instead, and the sheet re-centres above the keyboard.
  const vv = window.visualViewport;
  if (vv) {
    const fit = () => {
      if (!root.classList.contains('open')) { root.style.top = root.style.height = root.style.bottom = ''; return; }
      root.style.top = vv.offsetTop + 'px';
      root.style.height = vv.height + 'px';
      root.style.bottom = 'auto';
    };
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
    new MutationObserver(fit).observe(root, { attributes: true, attributeFilter: ['class'] });
  }
  // On a phone, tapping blank space is how the keyboard gets put away. Around a sheet that
  // space is the overlay, which closes the sheet and threw away whatever was being typed;
  // with a field in use, the first tap only puts the keyboard away.
  // Decided as the finger lands: by the time the click arrives, the tap itself has already
  // taken the focus off the field.
  let keepSheet = false;
  // Only while the keyboard is actually up: after Back has put it away, a tap closes as usual.
  const keyboardUp = () => !vv || vv.height * (vv.scale || 1) < document.documentElement.clientHeight - 120;
  root.addEventListener('pointerdown', e => {
    keepSheet = !!(e.target.classList && e.target.classList.contains('overlay'))
      && matchMedia('(pointer:coarse)').matches && editorBusy() && keyboardUp();
  }, true);
  root.addEventListener('click', e => {
    if (!keepSheet || !e.target.classList || !e.target.classList.contains('overlay')) return;
    keepSheet = false;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    e.stopImmediatePropagation();
  }, true);
  window.addEventListener('resize', placeToasts);
}

/* ---------- menu: export / import / reset ---------- */
async function exportBackup() {

  try {
    const dl = window.claude && claude.use ? await claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data }); toast('Backup saved'); return; }
  } catch (err) {
    if (err && err.code === 'declined') return;
    if (err && err.code === 'rate_limited') { toast('One download at a time. Try again in a moment'); return; }
    // fall through to anchor download

  try {
    const a = h('a', { href: URL.createObjectURL(new Blob([data], { type: 'application/json' })), download: filename });
    document.body.append(a); a.click(); a.remove();
    toast('Backup downloaded');
  } catch (e) { toast('Couldn’t save a backup in this environment'); }
}
function importBackup(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const s = JSON.parse(rd.result);
      if (!s || !Array.isArray(s.notes)) throw new Error('bad shape');
      const snap = snapshot();
      stashBoard('before an import');
      STATE = keepBase(migrate(s), STATE);   // a deliberate replacement: an edit on this version
      save(); renderAll();
      toast('Backup imported', () => restore(snap));
    } catch (e) { toast('That file doesn’t look like a Dayu backup'); }
  };
  rd.readAsText(file);
}
// The backups, offered back: the three kept on this device, then the versions the

function bakCounts(n) {

  return (n.notes || []).length + ' tasks · ' + (n.zones || []).length + ' clusters · '
    + (n.routines || []).length + ' routines · ' + (n.habits || []).length + ' daily goals'
    + (nights ? ' · ' + nights + ' sleep night' + (nights === 1 ? '' : 's') : '');

function openRestoreSheet() {

/* ---------- Supabase (plain REST, no library) ---------- */
const SB = { access: null, lastPull: 0, status: 'local', detail: '', pushTimer: null };

function syncStatus(status, detail) {

async function sbFetch(path, opts, allowRetry) {

    { apikey: CFG.sbAnon, 'Content-Type': 'application/json' },

function b64url(bytes) { return btoa(String.fromCharCode.apply(null, Array.from(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

/* ---- Google sign-in (PKCE, no library) ----
   Returns {ok:true} when the browser is being handed to Google, or {ok:false, message}
   so a caller such as the welcome card can show the reason in its own surface. */
function authFail(id, message) { showNotice(id, message); return { ok: false, message }; }
async function signInWithGoogle() {
  if (!sbConfigured()) return authFail('sb-cfg', 'Add the Supabase project URL in Settings first.');
  if (location.protocol === 'file:') return authFail('sb-file', 'Google sign-in needs the app on an http address: run serve.ps1 or use the hosted page.');
  // Check the provider is on, so a disabled provider shows a message here instead of a raw error page.
  // An unreachable service also stops here rather than navigating to a dead address.
  try {
    const s = await fetch(CFG.sbUrl + '/auth/v1/settings', { headers: { apikey: CFG.sbAnon } }).then(x => x.json());
    if (s && s.external && s.external.google === false) {
      return authFail('sb-google', 'Google sign-in is not switched on for this project yet. Enable the Google provider in Supabase (see SETUP.md).');
    }
  } catch (e) {
    return authFail('sb-net', 'Cannot reach the sign-in service from this page. If this is the preview page, open Dayu from its own address instead.');
  }
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  const verifier = b64url(bytes);
  storeSet('dayu-pkce', verifier);
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  const challenge = b64url(new Uint8Array(digest));
  const redirect = location.origin + location.pathname;
  // Remember that we left, so a silent bounce-back can be explained on return.
  storeSet('dayu-oauth-pending', JSON.stringify({ at: Date.now(), redirect }));
  location.href = CFG.sbUrl + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(redirect)
    + '&code_challenge=' + challenge + '&code_challenge_method=s256';
  return { ok: true };
}
// Turn provider jargon into something a person can act on.
function explainAuthError(raw) {
  const s = String(raw || '');
  if (/unable to exchange external code/i.test(s)) {
    return 'Google refused the hand-off. The Client Secret saved in Supabase does not match the Google OAuth client. Copy the secret again from Google Cloud (APIs & Services, Credentials, your Web application client) and paste it into Supabase under Authentication, Sign In / Providers, Google.';
  }
  if (/redirect_uri_mismatch/i.test(s)) {
    return 'Google rejected the callback address. In Google Cloud, the client\'s Authorized redirect URI must be exactly the callback URL shown in Supabase\'s Google provider panel.';
  }
  if (/provider is not enabled|unsupported provider/i.test(s)) {
    return 'Google sign-in is switched off for this project. Enable the Google provider in Supabase.';
  }
  if (/access_denied/i.test(s)) {
    return 'Sign-in was cancelled, or this Google account is not on the test-user list while the consent screen is in Testing mode.';
  }
  if (/bad_oauth_state|flow state|state/i.test(s) && /expired|not found|invalid/i.test(s)) {
    return 'That sign-in attempt expired. Try Continue with Google once more.';

}

  const body = JSON.stringify({ data: STATE, updated_at: new Date(stamp).toISOString() });
  const inList = known.map(ts => '"' + new Date(ts).toISOString() + '"').join(',');
  let small = false;
  try { small = new Blob([body]).size < 60000; } catch (e) { /* no Blob: send it plainly */ }
  sbFetch('/rest/v1/dayu_state?id=eq.main&updated_at=in.(' + encodeURIComponent(inList) + ')&select=updated_at', {
    method: 'PATCH', headers: { Prefer: 'return=representation' }, body, keepalive: small,
  }, false).then(async r => {
    // A sync that started meanwhile will see the stamp in the board's sentTs and take it from there.
    if (!r.ok || syncing) return;
    const rows = await r.json().catch(() => null);
    const held = Array.isArray(rows) && rows[0] && Date.parse(rows[0].updated_at);
    if (!held || boardBase(STATE) !== base) return;
    if (STATE.meta.updatedAt === stamp) STATE.meta.updatedAt = held;
    STATE.meta.syncBase = held;
    delete STATE.meta.sentTs;

}
function initSync() {
  syncStatus(sbConfigured() ? (CFG.sbRefresh ? 'busy' : 'signin') : 'local');
  if (sbConfigured() && CFG.sbRefresh) syncNow();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { flushOnHide(); return; }
    if (!sbConfigured()) return;

}

/* ---------- friends: directory, requests, shared progress, messages ---------- */
// Four small tables (friends.sql). Nobody can browse who uses Dayu: the profiles that load

// cluster with. Anyone else is found by their exact email (findPerson). A progress row is
// readable only by accepted friends; a message only by its two people. What friends see is
// a trimmed snapshot (goal names, marks, streaks), never the board.
const FR = {

  found: [],                          // people looked up by email, known by name but not yet linked

  chatWith: null, chatHook: null, ticks: 0,

function myId() {

}
function resetFriendsCache() {

  FR.lastProgressPushed = ''; FR.profilePushed = false;

}
function profileOf(userId) {

}

}
function friendIds() {
  const me = myId();

    .map(l => (l.requester === me ? l.addressee : l.requester));
}
function incomingRequests() { return FR.links.filter(l => l.status === 'pending' && l.addressee === myId()); }

// forever, since there is no longer a chat to open and clear them with.
function unreadTotal() {

// A signed-in caller may hold only a refresh token (first call after load); trade it in.

// whole feature missing. Either way the caller should stop what it was doing.
async function frMissing(r) {

  try { const j = await r.json(); sig = String((j && (j.code || '')) + ' ' + (j && j.message || '')); } catch (e) { /* not JSON */ }

  }

    try {
      if (!await frReady() || FR.missing) return false;
      const [pr, fr, gr, mr] = await Promise.all([
        sbFetch('/rest/v1/dayu_profiles?select=user_id,name,email,avatar&order=name'),
        sbFetch('/rest/v1/dayu_friends?select=requester,addressee,status,created_at'),
        sbFetch('/rest/v1/dayu_progress?select=user_id,data,updated_at'),
        sbFetch('/rest/v1/dayu_messages?select=id,sender,recipient,body,created_at,read_at&order=id.desc&limit=400'),
