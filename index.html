    if (imgIn.value.trim() && !normalizeUrl(imgIn.value)) { note.textContent = 'That picture link is not a web address Dayu can open. Fix it, or clear the box.'; imgIn.focus(); return; }
    w.text = nameIn.value.trim();
    w.url = normalizeUrl(urlIn.value); w.img = normalizeUrl(imgIn.value);
    Object.assign(w, wc.read());
    save(); closeModal(); renderGoals();
  };
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !imeBusy(e)) commit(); });
  urlIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !imeBusy(e)) commit(); });
  imgIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !imeBusy(e)) commit(); });

  const body = h('div.sbody', {},
    h('h1', { style: { fontSize: '19px', fontWeight: '800', marginBottom: '2px' } }, 'Edit wish'),
    h('div', { style: { color: 'var(--ink2)', marginBottom: '16px', fontSize: '13px' } }, 'Rename it, say what unlocks it, and link it to where you would buy it.'),
    h('div.setsec', {}, h('span.label', {}, 'Name'), h('div.frow', { style: { display: 'flex', marginTop: '8px' } }, nameIn)),
    h('div.setsec', {}, h('span.label', {}, 'Shop link'), h('div.frow', { style: { display: 'flex', marginTop: '8px' } }, urlIn)),
    h('div.setsec', {}, h('span.label', {}, 'Picture'), h('div.frow', { style: { display: 'flex', marginTop: '8px' } }, imgIn), preview, note),
    h('div.setsec', {}, h('span.label', {}, 'Unlocks with'),
      h('div.frow', { style: { display: 'flex', marginTop: '8px', gap: '8px', flexWrap: 'wrap', alignItems: 'center' } }, wc.sel, wc.daysWrap)));
  const sheet = h('div.sheet', {}, h('div.ctab', { style: { background: 'var(--accent)' } }), body,
    h('div.sfoot', {},
      h('button.btn.danger.small', { onclick: () => { w.url = ''; w.img = ''; save(); closeModal(); renderGoals(); } }, 'Remove link'),
      h('button.btn.primary.small', { onclick: commit }, 'Save')));
  root.append(h('div.overlay', { onclick: closeModal }), sheet);
  setTimeout(() => { nameIn.focus(); nameIn.select(); }, 0);

/* ---------- routines: a board of written sequences ---------- */
// A routine is a piece of writing rather than a task: a title, a body in Markdown, and a
// place on its own plane. It gets its own board, with its own pan and zoom, because the
// canvas is about things to knock down and this is about how you go about them.
const R_VIEW_KEY = 'dayu-rview-v1';
let rZoom = 1, rPanX = 0, rPanY = 0;
let rViewReady = false;

function routineById(id) { return STATE.routines.find(r => r.id === id) || null; }
function rSaveView() {
  try { storeSet(R_VIEW_KEY, JSON.stringify({ zoom: rZoom, panX: rPanX, panY: rPanY })); } catch (e) { /* private mode */ }
}
function rLoadView() {
  try {
    const v = JSON.parse(storeGet(R_VIEW_KEY) || 'null');
    if (v && isFinite(v.panX) && isFinite(v.panY)) {
      rPanX = v.panX; rPanY = v.panY;
      rZoom = clamp(isFinite(v.zoom) ? v.zoom : 1, ZOOM_MIN, ZOOM_MAX);
      return true;
    }
  } catch (e) { /* nothing saved, or unreadable */ }
  return false;
}
function rApplyView() {
  const field = $('#rfield'), board = $('#rboard');
  if (!field || !board) return;
  field.style.transform = 'translate(' + rPanX + 'px,' + rPanY + 'px) scale(' + rZoom + ')';
  board.style.backgroundSize = (24 * rZoom) + 'px ' + (24 * rZoom) + 'px';
  board.style.backgroundPosition = rPanX + 'px ' + rPanY + 'px';
  rSaveView();
}
function rToPlane(clientX, clientY) {
  const rb = $('#rboard').getBoundingClientRect();
  return { x: (clientX - rb.left - rPanX) / rZoom, y: (clientY - rb.top - rPanY) / rZoom };
}
function rSetZoom(next, clientX, clientY) {
  next = clamp(next, ZOOM_MIN, ZOOM_MAX);
  if (next === rZoom) return;
  const rb = $('#rboard').getBoundingClientRect();
  const px = clientX == null ? rb.width / 2 : clientX - rb.left;
  const py = clientY == null ? rb.height / 2 : clientY - rb.top;
  const cx = (px - rPanX) / rZoom, cy = (py - rPanY) / rZoom;
  rZoom = next;
  rPanX = px - cx * rZoom; rPanY = py - cy * rZoom;
  rApplyView();
}
function rBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const r of STATE.routines) {
    minX = Math.min(minX, r.x); minY = Math.min(minY, r.y);
    maxX = Math.max(maxX, r.x + r.w); maxY = Math.max(maxY, r.y + r.h);
  }
  return isFinite(minX) ? { minX, minY, maxX, maxY } : null;
}
// The toolbar sits over the bottom of this board too, so the fit leaves it a strip.
const R_TOOLBAR_BAND = 80;
function rFit() {
  const board = $('#rboard');
  if (!board) return;
  const rb = board.getBoundingClientRect();
  if (!rb.width || !rb.height) return;                 // the page is not on screen yet
  const vh = Math.max(140, rb.height - R_TOOLBAR_BAND);
  const b = rBounds();
  if (!b) { rZoom = 1; rPanX = 40; rPanY = 40; rApplyView(); return; }
  const pad = 60;
  const w = (b.maxX - b.minX) + pad * 2, hgt = (b.maxY - b.minY) + pad * 2;
  rZoom = clamp(Math.min(rb.width / w, vh / hgt, 1), ZOOM_MIN, ZOOM_MAX);
  rPanX = rb.width / 2 - ((b.minX + b.maxX) / 2) * rZoom;
  rPanY = vh / 2 - ((b.minY + b.maxY) / 2) * rZoom;
  rApplyView();
}
// Is any routine actually on screen with the view as it stands?
function rAnythingVisible() {
  const board = $('#rboard');
  const b = rBounds();
  if (!board || !b) return true;                       // nothing to have lost sight of
  const rb = board.getBoundingClientRect();
  if (!rb.width) return true;
  return (b.maxX * rZoom + rPanX) > 0 && (b.maxY * rZoom + rPanY) > 0
    && (b.minX * rZoom + rPanX) < rb.width && (b.minY * rZoom + rPanY) < rb.height;
}
function renderRoutines() {
  const field = $('#rfield'), board = $('#rboard');
  if (!field || !board) return;
  field.innerHTML = '';
  // Drawn in z order, so whichever was raised last is the one on top.
  for (const r of STATE.routines.slice().sort((a, b) => (a.z || 0) - (b.z || 0))) field.append(buildRoutine(r));
  $$('.hint', board).forEach(el => el.remove());
  if (!STATE.routines.length) {
    board.append(h('div.hint', {},
      h('div', { style: { fontSize: '34px', marginBottom: '10px' } }, '🧭'),
      coarsePointer()
        ? h('div', {}, h('b', {}, 'Tap Routine below'), ' to write your first routine.')
        : h('div', {}, h('b', {}, 'Double-click anywhere'), ' to write your first routine.'),
      h('div', { style: { marginTop: '4px' } }, 'Markdown works, and a YouTube link on a line of its own becomes a player.')));
  }
  // A remembered view with nothing in it is worse than no remembered view: the board would
  // open on blank plane with the routines somewhere off the edge.
  if (!rViewReady) { rViewReady = true; if (!rLoadView() || !rAnythingVisible()) rFit(); }
  rApplyView();
}
function buildRoutine(r) {
  const el = h('div.rcard', { dataset: { id: r.id }, style: {
    left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', zIndex: r.z || 10,
  } });

  /* title: a click turns it into a box, Enter or clicking away puts it back */
  const titleSpan = h('span.rtitle', { title: 'Click to rename' }, r.title);
  const editTitle = () => {
    const inp = h('input.rtitleedit', { value: r.title || '', placeholder: 'Name this routine', maxLength: 80 });
    let done = false;
    const commit = () => {
      if (done) return;
      done = true;
      r.title = inp.value.trim();
      save();
      // A shared routine's words belong to everyone in it, so they go up straight away
      // rather than waiting for the next sweep.
      if (r.sharedId) pushSharedRow(r.sharedId);
      titleSpan.textContent = r.title;
      inp.replaceWith(titleSpan);
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e => {
      if (imeBusy(e)) { e.stopPropagation(); return; }
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      if (e.key === 'Escape') { inp.value = r.title || ''; inp.blur(); }
      e.stopPropagation();
    });
    inp.addEventListener('pointerdown', e => e.stopPropagation());
    inp.__flush = () => { const v = inp.value.trim(); if (v === (r.title || '')) return false; r.title = v; return true; };
    titleSpan.replaceWith(inp);
    inp.focus(); inp.select();
  };
  // Renaming is decided when the press ends, not by a click: this header calls
  // preventDefault on pointerdown so it can be dragged, and a cancelled pointerdown means
  // the browser never fires the click that a listener here would have been waiting for.
  el.__editTitle = editTitle;

  const del = h('button.rdel', { title: 'Delete this routine' }, '✕');
  del.addEventListener('pointerdown', e => e.stopPropagation());
  del.addEventListener('click', e => {
    e.stopPropagation();
    askDelete(e, r.title || 'this routine', () => removeRoutine(r));
  });

  // One button that both says whether this routine is shared and opens the panel for it.
  // Hidden until there is an account to share from, unless it is already shared.
  const shareBtn = (signedIn() || r.sharedId)
    ? h('button.rshare' + (r.sharedId ? '.on' : ''), {
      title: r.sharedId
        ? 'Shared with ' + (sharedMemberIds(r.sharedId).map(displayName).join(', ') || 'a friend')
        : 'Share this routine with a friend',
    }, '👥')
    : null;
  if (shareBtn) {
    shareBtn.addEventListener('pointerdown', e => e.stopPropagation());
    shareBtn.addEventListener('click', e => { e.stopPropagation(); routineSharePop(r, e.clientX, e.clientY); });
  }

  const head = h('div.rhead', {}, titleSpan, shareBtn, del);
  el.append(head);

  /* body: rendered Markdown, swapping to its plain source while you write */
  const body = h('div.rbody');
  const paintBody = editing => {
    body.innerHTML = '';
    if (editing) {
      const ta = h('textarea.rbodyedit', {
        value: r.body || '',
        placeholder: 'Write the sequence. Markdown works, and a YouTube link on a line of its own becomes a player.',
      });
      let done = false;
      const commit = () => {
        if (done) return;
        done = true;
        r.body = ta.value;
        save();
        if (r.sharedId) pushSharedRow(r.sharedId);
        paintBody(false);
      };
      ta.addEventListener('blur', commit);
      ta.addEventListener('keydown', e => {
        // Enter belongs to the writing here: this is a description, not a one-line title.
        if (imeBusy(e)) { e.stopPropagation(); return; }
        if (e.key === 'Escape') ta.blur();
        e.stopPropagation();
      });
      ta.addEventListener('pointerdown', e => e.stopPropagation());
      ta.__flush = () => { if (ta.value === (r.body || '')) return false; r.body = ta.value; return true; };
      body.append(ta);
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
      return;
    }
    if ((r.body || '').trim()) {
      const view = h('div.mdbody', { title: 'Click to edit' });
      view.innerHTML = mdToHtml(r.body, null, { embeds: true });
      // A link, a picture or the video itself is there to be used, not to open the editor.
      view.addEventListener('click', ev => { if (!ev.target.closest('a, img, iframe, .ytwrap')) paintBody(true); });
      body.append(view);
      return;
    }
    body.append(h('button.descadd', { onclick: () => paintBody(true) }, 'Write the steps…'));
  };
  paintBody(false);
  el.append(body);

  /* dragged by its header, the way a cluster is dragged by its name tag */
  head.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.rdel, input')) return;
    // A press that starts on the name and never moves is a rename; anywhere else on the bar,
    // or any press that turns into a drag, moves the card.
    const onName = !!e.target.closest('.rtitle');
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, ox = r.x, oy = r.y;
    const slop = e.pointerType === 'mouse' ? 4 : 10;
    let moved = false;
    try { head.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    // A second finger (a pinch) calls the drag off and puts the card back.
    const gesture = beginGesture(() => {
      if (moved) { r.x = ox; r.y = oy; el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; }
      moved = false;
      up(null);
    });
    const mv = ev => {
      if (ev.pointerId !== e.pointerId) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (pressWasLongPress(head)) {                // held for the delete question
        if (Math.hypot(dx, dy) < slop) return;
        dropLongPress(head);                         // then moved after all: a drag
      }
      if (!moved) {
        if (Math.hypot(dx, dy) < slop) return;
        moved = true;
        el.classList.add('dragging');
        r.z = ++STATE.zTop; el.style.zIndex = r.z;
      }
      r.x = ox + dx / rZoom; r.y = oy + dy / rZoom;      // the plane has no edges
      el.style.left = r.x + 'px'; el.style.top = r.y + 'px';
    };
    const up = ev => {
      if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      endGesture(gesture);
      head.removeEventListener('pointermove', mv);
      head.removeEventListener('pointerup', up);
      head.removeEventListener('pointercancel', up);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      el.classList.remove('dragging');
      try { head.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
      // A press that never became a drag, and started on the name, opens the name box. A
      // cancelled gesture is not a press, so it opens nothing.
      if (!moved) { if (onName && ev && ev.type === 'pointerup' && !pressWasLongPress(head)) editTitle(); return; }
      save();
    };
    head.addEventListener('pointermove', mv);
    head.addEventListener('pointerup', up);
    head.addEventListener('pointercancel', up);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  onRightClickDelete(head, r.title || 'this routine', () => removeRoutine(r));

  /* resized from the corner, so a long routine can be given the room it needs */
  const grip = h('div.rresize', { title: 'Resize' });
  grip.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const sx = e.clientX, sy = e.clientY, w0 = r.w, h0 = r.h;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    const gesture = beginGesture(() => up(null));
    const mv = ev => {
      if (ev.pointerId !== e.pointerId) return;
      r.w = Math.max(R_MIN_W, w0 + (ev.clientX - sx) / rZoom);
      r.h = Math.max(R_MIN_H, h0 + (ev.clientY - sy) / rZoom);
      el.style.width = r.w + 'px'; el.style.height = r.h + 'px';
    };
    const up = ev => {
      if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      endGesture(gesture);
      grip.removeEventListener('pointermove', mv);
      grip.removeEventListener('pointerup', up);
      grip.removeEventListener('pointercancel', up);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      try { grip.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
      save();
    };
    grip.addEventListener('pointermove', mv);
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', up);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  el.append(grip);
  return el;
}
// A shared routine is not just writing on this screen: removing it has to mean either
// leaving it or, for whoever made it, taking it away from everyone.
function removeRoutine(rt) {
  if (rt.sharedId) {
    const sid = rt.sharedId;
    if (iOwnShared(sid)) {
      deleteSharedRow(sid).then(ok => toast(ok ? 'Routine removed for everyone in it' : 'Could not remove that just now'));
    } else {
      unshareMember(sid, myId()).then(r => toast(r.ok ? 'You have left that routine' : 'Could not leave just now'));
    }
    return;
  }
  undoableAction('Routine deleted', () => { STATE.routines = STATE.routines.filter(x => x.id !== rt.id); });
}
function closeRoutinePop() { $$('.rsharepop').forEach(p => p.remove()); }
let routinePopWired = false;
// The share panel sits on the body at a fixed spot rather than on the routines plane, for
// the same reasons the cluster's does: on the plane it would scale with the zoom and be
// wiped out by any redraw that happened to land mid-pick.
function routineSharePop(rt, atX, atY) {
  closeRoutinePop();
  const pop = h('div.rsharepop', { role: 'dialog', 'aria-label': 'Share this routine' },
    shareBox({
      noun: 'routine',
      sid: () => rt.sharedId,
      share: friendId => shareRoutine(rt, friendId),
      onLeave: closeRoutinePop,
      after: renderRoutines,          // the card's mark lights up once it is shared
    }));
  document.body.append(pop);
  const pr = pop.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(atX - 24, innerWidth - pr.width - 8)) + 'px';
  pop.style.top = Math.max(8, Math.min(atY + 12, innerHeight - pr.height - 8)) + 'px';
  if (!routinePopWired) {
    routinePopWired = true;
    document.addEventListener('pointerdown', ev => {
      const p = $('.rsharepop');
      if (p && !p.contains(ev.target) && !ev.target.closest('.rshare')) closeRoutinePop();
    }, true);
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeRoutinePop(); });
  }
}
function newRoutineAt(x, y) {
  const r = {
    id: uid(), title: '', body: '',
    x: Math.round(x), y: Math.round(y), w: 340, h: 280,
    z: ++STATE.zTop, createdAt: Date.now(),
  };
  STATE.routines.push(r);
  save();
  renderRoutines();
  // Straight into naming it, the way a new task opens its title box.
  const el = $('.rcard[data-id="' + r.id + '"]');
  if (el && el.__editTitle) el.__editTitle();
}
// The button drops one in the middle of what you are looking at, stepping off anything
// already sitting there rather than burying it.
function addRoutineHere() {
  const rb = $('#rboard').getBoundingClientRect();
  const c = rToPlane(rb.left + rb.width / 2, rb.top + rb.height / 2);
  let x = Math.round(c.x - 170), y = Math.round(c.y - 140);
  for (let i = 0; i < 40 && STATE.routines.some(r => Math.abs(r.x - x) < 26 && Math.abs(r.y - y) < 26); i++) { x += 28; y += 28; }
  newRoutineAt(x, y);
}
function wireRoutines() {
  const board = $('#rboard'), field = $('#rfield');
  if (!board) return;
  $('#btnRoutine').addEventListener('click', addRoutineHere);
  $('#btnRFit').addEventListener('click', rFit);

  board.addEventListener('wheel', e => {
    e.preventDefault();
    rSetZoom(rZoom * Math.exp(-e.deltaY * 0.0016), e.clientX, e.clientY);
  }, { passive: false });
  let rFrame = 0;
  wirePinch(board, {
    get: () => ({ zoom: rZoom, panX: rPanX, panY: rPanY }),
    set: (z, x, y) => {
      rZoom = z; rPanX = x; rPanY = y;
      if (!rFrame) rFrame = requestAnimationFrame(() => { rFrame = 0; rApplyView(); });
    },
  });
  window.addEventListener('resize', () => { if (currentPage() === 'routines') rApplyView(); });

  // As on the canvas: a double-tap by finger zooms in, and the button writes new routines.
  let lastPressType = 'mouse';
  board.addEventListener('pointerdown', e => { lastPressType = e.pointerType; }, true);
  board.addEventListener('dblclick', e => {
    if (e.target !== board && e.target !== field) return;
    if (lastPressType !== 'mouse') { rSetZoom(rZoom * 1.6, e.clientX, e.clientY); return; }
    const p = rToPlane(e.clientX, e.clientY);
    newRoutineAt(p.x - 170, p.y - 26);
  });

  // Empty board drags the view. A press inside a card belongs to the card.
  board.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.button !== 1) return;
    if (e.target.closest('.rcard')) return;
    const sx = e.clientX, sy = e.clientY;
    const p0x = rPanX, p0y = rPanY;
    const slop = e.pointerType === 'mouse' ? 4 : 10;
    let panning = false;
    try { board.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    const gesture = beginGesture(() => up(null));
    const mv = ev => {
      if (ev.pointerId !== e.pointerId) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!panning) {
        if (Math.hypot(dx, dy) < slop) return;
        panning = true;
        board.classList.add('panning');
      }
      if (ev.cancelable) ev.preventDefault();
      rPanX = p0x + dx; rPanY = p0y + dy;
      rApplyView();
    };
    const up = ev => {
      if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      endGesture(gesture);
      board.removeEventListener('pointermove', mv);
      board.removeEventListener('pointerup', up);
      board.removeEventListener('pointercancel', up);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      board.classList.remove('panning');
      try { board.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
    };
    board.addEventListener('pointermove', mv);
    board.addEventListener('pointerup', up);
    board.addEventListener('pointercancel', up);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

/* ---------- boot ---------- */
function boot() {
  STATE = loadState();
  // Probe storage. A board that loaded is written back as cleaned up by migrate(), so nothing
  // it stripped (an old API key, say) waits in storage for the next edit. A board that failed
  // to load is left exactly as it was, in case it can still be recovered by hand.
  storeSet(STORE_KEY, returningUser ? JSON.stringify(STATE) : (storeGet(STORE_KEY) || JSON.stringify(STATE)));
  stashPurgedBoard();   // keep whatever the steps purge just stripped, if it stripped any
  for (const g of STATE.goals) metBefore[g.id] = goalMet(g);
  wireTheme();
  wireMenu();
  wireMobileShell();
  wireCanvas();
  wireRoutines();
  wireTabs();
  syncPageChrome();
  renderMeters(); renderCanvas();
  // parse any OAuth redirect BEFORE the router touches the URL hash
  handleAuthRedirect().then(() => {
    window.addEventListener('hashchange', route);
    route();
    initSync();
    initFriends();
    maybeShowWelcome();
  });
  if (!storageOK) {
    const sn = $('#storageNote');
    sn.style.display = 'block';
    sn.innerHTML = '';
    sn.append(
      h('button', { onclick: () => sn.style.display = 'none', 'aria-label': 'Dismiss' }, '✕'),
      h('div', {}, h('b', {}, 'Preview mode: '), 'this environment can’t store data between visits. Use Settings (the gear), Export backup to keep a copy, or run Dayu from its own page for full persistence.'));
  }
  // A board this browser has never panned gets framed once.
  if (!storeGet(VIEW_KEY)) initialView();
}
boot();

</script>
