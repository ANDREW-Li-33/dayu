      h('button', { title: 'Rename', onclick: () => {
        const inp = h('input', { value: hb.name, maxLength: 60 });
        const commit = () => { hb.name = inp.value.trim() || hb.name; save(); renderGoals(); };
        inp.addEventListener('blur', commit);
        inp.addEventListener('keydown', e => { if (imeBusy(e)) return; if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = hb.name; inp.blur(); } });
        nameTd.innerHTML = ''; nameTd.append(inp); inp.focus({ preventScroll: true }); inp.select();
      } }, '✎'),
      h('button', { title: 'Retire: stop tracking, keep its history on the Dashboard', onclick: () => {
        undoableAction('“' + hb.name + '” retired. Its history stays on the Dashboard', () => { hb.archivedAt = Date.now(); });
      } }, '🗄'),
      h('button', { title: 'Delete forever', onclick: () => {
        undoableAction('“' + hb.name + '” deleted', () => { STATE.habits = STATE.habits.filter(x => x.id !== hb.id); });
      } }, '✕'));
    nameTd.append(nameSpan, tools);
    const tr = h('tr', {}, nameTd);
    onRightClickDelete(nameTd, hb.name, () => {
      undoableAction('“' + hb.name + '” deleted', () => { STATE.habits = STATE.habits.filter(x => x.id !== hb.id); });
    });
    for (const k of keys) {
      // A day that has not happened yet is shown but not markable, the same as in the
      // archive's history: a tick there would count towards a score for a day nobody lived.
      const future = k > tk;
      const cellTitle = () => hb.name + ' · ' + k + (future ? ' (not yet)' : (hb.days[k] ? ' (' + cellLabel(hb.days[k]) + ')' : ''));
      const cell = h('button.hcell' + (hb.days[k] ? '.c-' + hb.days[k] : ''), { title: cellTitle(), disabled: future });
      if (!future) cell.addEventListener('click', () => {
        toggleHabit(hb, k);
        cell.className = 'hcell' + (hb.days[k] ? ' c-' + hb.days[k] : '');
        cell.title = cellTitle();
        const chip = $('.todaychip', box);
        if (chip) chip.textContent = 'Today: ' + activeHabits().filter(habitCheckedToday).length + ' of ' + activeHabits().length;
      });
      tr.append(h('td' + (k === tk ? '.todaycol' : (future ? '.futurecol' : '')), {}, cell));
    }
    tbody.append(tr);
  }
  // add row
  const addInp = h('input', { placeholder: '＋ Add a daily goal and press Enter…', maxLength: 60 });
  addInp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !imeBusy(e) && addInp.value.trim()) {
      const maxOrder = STATE.habits.reduce((m, x) => Math.max(m, x.order || 0), 0);
      STATE.habits.push({ id: uid(), name: addInp.value.trim(), order: maxOrder + 1, createdAt: Date.now(), archivedAt: null, days: {} });
      save(); renderGoals(); renderMeters();
      // preventScroll, or focusing this box (which lives in the sticky left column) drags
      // the sheet back to its far left and undoes the scroll that parks today on the edge.
      setTimeout(() => { const i = $('.haddrow input'); if (i) i.focus({ preventScroll: true }); }, 0);
    }
  });
  tbody.append(h('tr.haddrow', {}, h('td.hname', { colSpan: SHEET_DAYS + 1, style: { maxWidth: 'none' } }, addInp)));

  const wrap = h('div.hwrap', {}, h('table.htable', {}, thead, tbody));
  box.append(wrap);
  setTimeout(() => parkSheetOnToday(wrap), 0);
  if (!habs.length) {
    box.lastChild.before(h('div', { style: { color: 'var(--ink3)', fontSize: '12.5px', marginBottom: '8px' } }, 'Goals you want to hit every day. Add one below, then click a cell to mark it: green for done, blue for a planned rest day, yellow, or red for anything else. Click again to cycle through, or once more to clear it. The Dashboard tab keeps score off the green days, and a rest day never counts against you.'));
  }
  return box;
}
// Park today against the left edge of the scrolling area, just past the sticky name column,
// so the days ahead are what you see first. Measured rather than counted, since the name
// column's width depends on the longest goal name, and run after the page has appended the
// sheet, because a detached element has no width to scroll.
function parkSheetOnToday(wrap) {
  if (!wrap || !wrap.isConnected) return;
  const th = wrap.querySelector('thead th.todaycol');
  const nameTh = wrap.querySelector('thead th.hname');
  if (!th) return;
  const gap = th.getBoundingClientRect().left - wrap.getBoundingClientRect().left
    - (nameTh ? nameTh.getBoundingClientRect().width : 0);
  wrap.scrollLeft += gap;
}

/* ---------- full goal-tracking history (archive page) ---------- */
function monthKeyOf(ts) { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthsWithHistory() {
  // Every month from the first day anyone tracked through the current one, newest first.
  const all = STATE.habits;
  if (!all.length) return [];
  let earliest = Infinity;
  for (const hb of all) {
    earliest = Math.min(earliest, startOfDay(hb.createdAt || Date.now()));
    for (const k of Object.keys(hb.days)) earliest = Math.min(earliest, startOfDay(keyToTs(k)));
  }
  if (!isFinite(earliest)) return [];
  const out = [];
  const now = new Date();
  const cur = new Date(now.getFullYear(), now.getMonth(), 1);
  const first = new Date(earliest);
  const walk = new Date(first.getFullYear(), first.getMonth(), 1);
  while (walk <= cur) { out.push({ y: walk.getFullYear(), m: walk.getMonth() }); walk.setMonth(walk.getMonth() + 1); }
  return out.reverse();
}
function monthDayKeys(y, m) {
  const days = new Date(y, m + 1, 0).getDate();
  const out = [];
  for (let d = 1; d <= days; d++) out.push(y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'));
  return out;
}
const GHIST_QUICK = [['all', 'All time'], ['30', 'Last 30 days'], ['90', 'Last 90 days'], ['year', 'This year'], ['', 'Custom range']];
let ghistFilters = { from: '', to: '', quick: 'all' };
function ghistHasFilter() { return !!(ghistFilters.from || ghistFilters.to); }
function ghistRangeLabel() {
  const f = ghistFilters.from, t = ghistFilters.to;
  if (f && t) return 'Totals, ' + fmtDY(keyToTs(f)) + ' to ' + fmtDY(keyToTs(t));
  if (f) return 'Totals since ' + fmtDY(keyToTs(f));
  if (t) return 'Totals through ' + fmtDY(keyToTs(t));
  return 'Totals so far';
}

function renderGoalHistory() {
  const wrap = h('div');
  const all = STATE.habits.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  if (!all.length) {
    wrap.append(h('div.empty', {}, 'No daily goals yet. Add some on the Goals page and their whole history shows up here.'));
    return wrap;
  }

  // --- date range filter ---
  const quickSel = h('select.input', {}, GHIST_QUICK.map(([v, l]) => h('option', { value: v, selected: ghistFilters.quick === v }, l)));
  const fromIn = h('input.input', { type: 'date', value: ghistFilters.from, title: 'From this day' });
  const toIn = h('input.input', { type: 'date', value: ghistFilters.to, title: 'Through this day' });
  quickSel.addEventListener('change', () => {
    ghistFilters.quick = quickSel.value;
    const now = Date.now();
    if (quickSel.value === 'all') { ghistFilters.from = ''; ghistFilters.to = ''; }
    else if (quickSel.value === '30') { ghistFilters.from = dayKey(now - 29 * DAY); ghistFilters.to = ''; }
    else if (quickSel.value === '90') { ghistFilters.from = dayKey(now - 89 * DAY); ghistFilters.to = ''; }
    else if (quickSel.value === 'year') { ghistFilters.from = new Date().getFullYear() + '-01-01'; ghistFilters.to = ''; }
    // '' (custom) leaves from/to as already typed
    renderArchive();
  });
  fromIn.addEventListener('change', () => { ghistFilters.from = fromIn.value; ghistFilters.quick = ''; renderArchive(); });
  toIn.addEventListener('change', () => { ghistFilters.to = toIn.value; ghistFilters.quick = ''; renderArchive(); });
  wrap.append(h('div.filters', {}, h('div.frow', {}, quickSel, fromIn, h('span', { style: { color: 'var(--ink3)', fontSize: '12px' } }, 'to'), toIn)));

  const hasFilter = ghistHasFilter();

  // per-goal totals: the filtered window if one is set, otherwise the whole history
  const summary = h('div.ghist-sum');
  for (const hb of all) {
    let s;
    if (hasFilter) {
      s = habitStatsInRange(hb, ghistFilters.from, ghistFilters.to);
    } else {
      const st = habitStats(hb);
      const marks = Object.values(hb.days);
      s = { pct: st.pct, checked: st.checked, totalDays: st.totalDays, best: st.best, blue: marks.filter(v => v === 'blue').length, yellow: marks.filter(v => v === 'yellow').length, red: marks.filter(v => v === 'red').length };
    }
    summary.append(h('div.ghist-row', {},
      h('span.ghr-name', {}, hb.name, hb.archivedAt ? h('span.ghr-tag', {}, 'retired') : null),
      h('span.ghr-pct', {}, s.pct + '%'),
      h('span.ghr-detail', {}, s.checked + ' green'
        + (s.blue ? ', ' + s.blue + ' rest' : '') + (s.yellow ? ', ' + s.yellow + ' yellow' : '') + (s.red ? ', ' + s.red + ' red' : '')
        + ' of ' + s.totalDays + ' days · best streak ' + s.best)));
  }
  wrap.append(h('div.dsec', {}, h('span.label', {}, ghistRangeLabel()), summary));

  const letters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const tk = todayKey();
  const months = monthsWithHistory().filter(({ y, m }) => {
    if (!hasFilter) return true;
    const first = y + '-' + String(m + 1).padStart(2, '0') + '-01';
    const last = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(new Date(y, m + 1, 0).getDate()).padStart(2, '0');
    if (ghistFilters.to && first > ghistFilters.to) return false;
    if (ghistFilters.from && last < ghistFilters.from) return false;
    return true;
  });
  let shown = 0;
  for (const { y, m } of months) {
    let keys = monthDayKeys(y, m);
    if (hasFilter) keys = keys.filter(k => (!ghistFilters.from || k >= ghistFilters.from) && (!ghistFilters.to || k <= ghistFilters.to));
    if (!keys.length) continue;
    if (!hasFilter) {
      // Skip a month nobody marked, unless it is the current one.
      const anyMarks = all.some(hb => keys.some(k => hb.days[k]));
      if (!anyMarks && monthKeyOf(Date.now()) !== y + '-' + String(m + 1).padStart(2, '0')) continue;
    }
    // A goal belongs in this month if it was marked here, or if it was already alive then
    // and had not yet been retired: no rows for months before a goal existed.
    const monthEnd = keyToTs(keys[keys.length - 1]);
    const monthStart = keyToTs(keys[0]);
    const rows = all.filter(hb => keys.some(k => hb.days[k])
      || (startOfDay(hb.createdAt) <= monthEnd && (!hb.archivedAt || hb.archivedAt >= monthStart)));
    if (!rows.length) continue;

    const thead = h('thead', {}, h('tr', {},
      h('th.hname', {}, ''),
      keys.map(k => {
        const d = new Date(k + 'T12:00');
        return h('th' + (k === tk ? '.todaycol' : ''), {}, letters[d.getDay()], h('span.dnum', {}, String(d.getDate())));
      })));
    const tbody = h('tbody');
    for (const hb of rows) {
      const tr = h('tr', {}, h('td.hname', {}, hb.name, hb.archivedAt ? h('span.ghr-tag', {}, 'retired') : null));
      for (const k of keys) {
        const future = keyToTs(k) > Date.now();
        const title = () => hb.name + ' · ' + k + (hb.days[k] ? ' (' + cellLabel(hb.days[k]) + ')' : '');
        const cell = h('button.hcell' + (hb.days[k] ? '.c-' + hb.days[k] : ''), { title: title(), disabled: future });
        if (!future) cell.addEventListener('click', () => {
          toggleHabit(hb, k);
          cell.className = 'hcell' + (hb.days[k] ? ' c-' + hb.days[k] : '');
          cell.title = title();
        });
        tr.append(h('td' + (k === tk ? '.todaycol' : '') + (future ? '.futurecol' : ''), {}, cell));
      }
      tbody.append(tr);
    }
    const label = new Date(y, m, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    wrap.append(h('div.dsec', {},
      h('span.label', {}, label),
      h('div.hwrap', {}, h('table.htable.hmonth', {}, thead, tbody))));
    shown++;
  }
  if (hasFilter && !shown) wrap.append(h('div.empty', {}, 'Nothing tracked in this range.'));
  return wrap;
}

/* ---------- dashboard page ---------- */
function renderDashboard() {
  const inner = $('#dashInner');
  inner.innerHTML = '';
  inner.append(h('h1', {}, 'Dashboard'), h('div.sub', {}, 'How your daily goals are actually going.'));

  const habs = activeHabits(), ret = retiredHabits();
  const last7 = lastNDaysKeys(7);

  // stat tiles
  if (habs.length || ret.length) {
    const hit7 = habs.reduce((a, hb) => a + last7.filter(k => hb.days[k] === 'green').length, 0);
    const rest7 = habs.reduce((a, hb) => a + last7.filter(k => hb.days[k] === 'blue').length, 0);
    const possible7 = habs.length * 7 - rest7; // planned rest days do not count against the week
    const totalChecks = STATE.habits.reduce((a, hb) => a + Object.keys(hb.days).length, 0);
    let bestName = '', bestVal = 0, curBest = 0, curName = '';
    for (const hb of STATE.habits) {
      const s = habitStats(hb);
      if (s.best > bestVal) { bestVal = s.best; bestName = hb.name; }
      if (!hb.archivedAt && s.cur > curBest) { curBest = s.cur; curName = hb.name; }
    }
    const dayWord = n => n === 1 ? ' day' : ' days';
    inner.append(h('div.statrow', {},
      h('div.stat', {}, h('div.snum', {}, possible7 ? Math.round(hit7 / possible7 * 100) + '%' : '·'), h('div.slab', {}, 'Hit rate, last 7 days')),
      h('div.stat', {}, h('div.snum', {}, String(totalChecks)), h('div.slab', {}, 'Checks, all time')),
      h('div.stat', {}, h('div.snum', {}, curBest, h('small', {}, dayWord(curBest))), h('div.slab', {}, curName ? 'Streak now · ' + curName : 'Streak now')),
      h('div.stat', {}, h('div.snum', {}, bestVal, h('small', {}, dayWord(bestVal))), h('div.slab', {}, bestName ? 'Best ever · ' + bestName : 'Best ever'))));
  }

  // per-habit cards
  const habSec = h('div.dsec', {}, h('span.label', {}, 'Daily goals'));
  if (!habs.length) habSec.append(h('div.empty', {}, 'No daily goals yet. Add them on the Goals page and they’ll be scored here.'));
  for (const hb of habs) habSec.append(habCard(hb, false));
  inner.append(habSec);

  if (ret.length) {
    const retSec = h('div.dsec', {}, h('span.label', {}, 'Retired (history kept)'));
    for (const hb of ret) retSec.append(habCard(hb, true));
    inner.append(retSec);
  }

  // task goals echo
  if (STATE.goals.length) {
    const tg = h('div.dsec', {}, h('span.label', {}, 'Task goals'));
    for (const g of STATE.goals) {
      const n = goalCount(g), pct = clamp(n / g.target * 100, 0, 100);
      tg.append(h('div.minigoal', {},
        h('span.mgname', {}, g.name),
        h('div.gtrack', {}, h('div.gfill' + (n >= g.target ? '.full' : ''), { style: { width: pct + '%', height: '100%', borderRadius: '4px', background: n >= g.target ? 'var(--good)' : 'var(--accent)' } })),
        h('span.gnum', {}, n + ' / ' + g.target + ' ' + PERIOD_LABEL[g.period])));
    }
    inner.append(tg);
  }

}

function habCard(hb, retired) {
  const s = habitStats(hb);
  const keys = lastNDaysKeys(30);
  const tk = todayKey();
  const card = h('div.hab' + (retired ? '.retired' : ''), {},
    h('div.hhead', {},
      h('span.hnamebig', {}, hb.name),
      retired ? h('button.btn.ghost.small', { onclick: () => { hb.archivedAt = null; save(); renderDashboard(); renderMeters(); } }, 'Resume') : null,
      retired ? h('button.btn.danger.small', { onclick: () => undoableAction('“' + hb.name + '” deleted', () => { STATE.habits = STATE.habits.filter(x => x.id !== hb.id); }) }, 'Delete') : null,
      h('span.hpct', {}, s.pct + '%')),
    h('div.hmeta', {}, 'Since ' + fmtDY(s.since) + ' · ' + s.checked + ' of ' + s.totalDays + ' days'
      + (retired ? ' · retired ' + fmtDY(hb.archivedAt) : ' · streak ' + s.cur + ' (best ' + s.best + ')')));
  if (!retired) {
    const strip = h('div.strip');
    for (const k of keys) strip.append(h('span.sq' + (hb.days[k] ? '.c-' + hb.days[k] : '') + (k === tk ? '.today' : ''), { title: k + (hb.days[k] ? ' (' + cellLabel(hb.days[k]) + ')' : '') }));
    card.append(strip);
  }
  return card;
}


'use strict';
/* ================= Tack — archive & goals pages, boot ================= */

/* ---------- archive ---------- */
const afilters = { q: '', cats: new Set(), from: '', to: '', quick: 'all' };
let archiveView = 'tasks'; // 'tasks' or 'goals'

function archivedNotes() {
  let list = STATE.notes.filter(n => n.archived && n.completedAt);
  if (afilters.q) {
    const q = afilters.q.toLowerCase();
    list = list.filter(n => (n.title || '').toLowerCase().includes(q) || (n.desc || '').toLowerCase().includes(q));
  }
  if (afilters.cats.size) list = list.filter(n => afilters.cats.has(n.catId || 'none'));
  if (afilters.from) { const t = new Date(afilters.from + 'T00:00').getTime(); list = list.filter(n => n.completedAt >= t); }
  if (afilters.to) { const t = new Date(afilters.to + 'T00:00').getTime() + DAY; list = list.filter(n => n.completedAt < t); }
  return list.sort((a, b) => b.completedAt - a.completedAt);
}

function renderArchive() {
  const inner = $('#archiveInner');
  inner.innerHTML = '';
  inner.append(h('h1', {}, 'Archive'),
    h('div.sub', {}, archiveView === 'goals'
      ? 'Every day you have marked, all the way back. Click any cell to correct it.'
      : 'Everything you’ve finished. Click any task to read it back, or filter and restore.'));

  // --- which archive are we looking at ---
  const seg = h('div.segbar', {}, [['tasks', 'Completed tasks'], ['goals', 'Goal history']].map(([v, l]) =>
    h('button.seg' + (archiveView === v ? '.on' : ''), { onclick: () => { archiveView = v; renderArchive(); } }, l)));
  inner.append(seg);

  if (archiveView === 'goals') { inner.append(renderGoalHistory()); return; }

  // --- filters ---
  const qIn = h('input.input.grow', { placeholder: 'Search by name…', value: afilters.q });
  qIn.addEventListener('input', () => { afilters.q = qIn.value; refresh(); });
  const fromIn = h('input.input', { type: 'date', value: afilters.from, title: 'Completed on or after' });
  const toIn = h('input.input', { type: 'date', value: afilters.to, title: 'Completed on or before' });
  fromIn.addEventListener('change', () => { afilters.from = fromIn.value; afilters.quick = ''; refresh(); });
  toIn.addEventListener('change', () => { afilters.to = toIn.value; afilters.quick = ''; refresh(); });
  const quick = h('select.input', {},
    [['all', 'All time'], ['7', 'Last 7 days'], ['30', 'Last 30 days'], ['', 'Custom range']].map(([v, l]) =>
      h('option', { value: v, selected: afilters.quick === v }, l)));
  quick.addEventListener('change', () => {
    afilters.quick = quick.value;
    if (quick.value === 'all') { afilters.from = ''; afilters.to = ''; }
    else if (quick.value) {
      afilters.from = dayKey(Date.now() - (Number(quick.value) - 1) * DAY); afilters.to = '';
    }
    renderArchive();
  });

  const catRow = h('div.frow');
  const usedCats = [...new Set(STATE.notes.filter(n => n.archived).map(n => n.catId || 'none'))];
  for (const cid of usedCats) {
    const cat = cid === 'none' ? null : catById(cid);
    const pal = cat ? palById(cat.color) : null;
    const on = afilters.cats.has(cid);
    catRow.append(h('button.chip' + (on ? '.on' : ''), { onclick: e => {
      if (afilters.cats.has(cid)) afilters.cats.delete(cid); else afilters.cats.add(cid);
      renderArchive();
    } },
      pal ? h('span.dot', { style: { background: pal.bg, border: '1px solid ' + pal.deep } }) : null,
      cat ? cat.name : 'No category'));
  }

  inner.append(h('div.filters', {},
    h('div.frow', {}, qIn, quick, fromIn, h('span', { style: { color: 'var(--ink3)', fontSize: '12px' } }, 'to'), toIn),
    usedCats.length ? catRow : null));

  // --- list ---
  const countEl = h('div.count');
  const listEl = h('div.alist');
  inner.append(countEl, listEl);

  function refresh() {
    const items = archivedNotes();
    countEl.textContent = items.length === 1 ? '1 task' : items.length + ' tasks';
    listEl.innerHTML = '';
    if (!items.length) {
      listEl.append(h('div.empty', { style: { gridColumn: '1/-1' } },
        STATE.notes.some(n => n.archived) ? 'Nothing matches these filters.' : 'Nothing archived yet. Go check something off.'));

  }
  refresh();
}

function archiveCard(n) {
  const cat = catById(n.catId);
  const days = Math.max(0, Math.round((n.completedAt - n.createdAt) / DAY));
  const card = h('div.acard', { tabIndex: 0, title: 'Click to see the details' },
    h('div.atop', {},
      h('span.atick', { innerHTML: TICK_SVG.replace('class="tickpath"', 'class="tickpath" style="stroke-dashoffset:0"') }),
      h('div.atitle', {}, n.title || 'Untitled')),
    h('div.adates', {}, 'Created ' + fmtDY(n.createdAt) + '  →  Done ' + fmtDY(n.completedAt) + (days ? '  (' + days + (days === 1 ? ' day)' : ' days)') : '  (same day)')),
    h('div.abot', {},
      cat ? h('span.minichip', {}, h('span.dot', { style: { background: palById(cat.color).bg, border: '1px solid ' + palById(cat.color).deep } }), cat.name) : null,
      n.steps.length ? h('span.minichip', {}, n.steps.filter(s => s.done).length + '/' + n.steps.length + ' steps') : null,
      (n.desc || '').trim() ? h('span.nmore', { title: 'Has a description' }, h('span'), h('span'), h('span')) : null,
      h('span.spacer'),
      h('button.btn.ghost.small', { title: 'Back to the canvas, unchecked', onclick: () => {
        undoableAction('“' + (n.title || 'Untitled') + '” is back on the canvas', () => { n.archived = false; n.completedAt = null; });
        completionChanged();
      } }, 'Restore'),
      h('button.btn.danger.small', { onclick: () => {
        undoableAction('Deleted from archive', () => { STATE.notes = STATE.notes.filter(x => x.id !== n.id); });
        completionChanged();
      } }, 'Delete')));
  onRightClickDelete(card, n.title || 'this task', () => {
    undoableAction('Deleted from archive', () => { STATE.notes = STATE.notes.filter(x => x.id !== n.id); });
    completionChanged();
  });
  // The whole card opens the same expanded view the canvas uses, so a finished task can be
  // read back in full. The buttons along the bottom keep their own jobs.
  card.addEventListener('click', e => { if (!e.target.closest('button')) openNote(n.id); });
  card.addEventListener('keydown', e => {
    if (e.target !== card) return;                       // a button inside handles its own keys
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openNote(n.id); }
  });
  return card;
}

// The poll calls this. It used to skip whenever anything in the section held focus, which
// a button does after you click it: pressing "Add a friend" once left focus parked there
// and stopped every later refresh. Only a half-typed entry is worth protecting, and the

function repaintFriendsIfSafe() {

function agoText(iso) {
  const t = Date.parse(iso || '');
  if (!t) return 'a while ago';
  const s = Math.max(0, Date.now() - t);
  if (s < 90000) return 'just now';
  if (s < 3600000) return Math.round(s / 60000) + ' min ago';
  if (s < 86400000) return Math.round(s / 3600000) + ' h ago';
  return fmtD(t);
}
// Only picture hosts Google itself serves avatars from. A profile row is writable by its
// owner with any URL, and an arbitrary host would let one user turn everyone else's
// friend list into a beacon that pings their server.
function safeAvatarUrl(raw) {
  const s = safeUrl(raw);
  if (!s) return '';
  try {
    return /(^|\.)googleusercontent\.com$/i.test(new URL(s).hostname) ? s : '';
  } catch (e) { return ''; }
}
// Initials on a sticky-note color, with the Google picture layered on top when it loads.
function avatarEl(userId, size) {
  const name = displayName(userId);
  const initials = name.split(/\s+/).slice(0, 2).map(w => (w[0] || '')).join('').toUpperCase() || '?';
  let hash = 0;
  for (const ch of String(userId)) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  const el = h('span.favatar', { 'aria-hidden': 'true', style: { background: PAL[hash % PAL.length].bg } }, initials);
  if (size) { el.style.width = size + 'px'; el.style.height = size + 'px'; el.style.fontSize = Math.round(size * .38) + 'px'; }
  const p = profileOf(userId);
  const src = p ? safeAvatarUrl(p.avatar) : '';
  if (src) {
    const img = h('img', { src, alt: '', referrerPolicy: 'no-referrer' });
    img.addEventListener('error', () => img.remove());

}

    }

// The one control that says what is holding a wish back: a run of finished tasks, a run of
// days on a daily goal, or nothing at all. Shared by the add form and the editor, so the
// two can never drift apart. Pass null for a wish that does not exist yet.
function wishCondControls(w) {
  const habs = activeHabits();
  const sel = h('select.input.grow', {},
    h('option', { value: '' }, 'no goal, just a wish'),
    STATE.goals.length ? h('optgroup', { label: 'Finish tasks' },
      STATE.goals.map(g => h('option', { value: 'g:' + g.id }, 'unlocks with: ' + g.name))) : null,
    habs.length ? h('optgroup', { label: 'Days in a row' },
      habs.map(hb => h('option', { value: 'h:' + hb.id }, 'days in a row of: ' + hb.name)),
      habs.length > 1 ? h('option', { value: 'h:*' }, 'days in a row of: every daily goal') : null) : null);
  const days = h('input.input', { type: 'number', min: 1, max: 365, style: { width: '78px' }, title: 'How many days in a row' });
  const daysWrap = h('span.wdays', {}, days, h('span.wdayslab', {}, 'days in a row'));
  sel.value = w && w.habitId ? 'h:' + w.habitId : (w && w.goalId ? 'g:' + w.goalId : '');
  if (sel.selectedIndex < 0) sel.value = '';   // whatever it named has since been deleted
  days.value = String(w ? wishStreakNeed(w) : 7);
  const sync = () => { daysWrap.style.display = sel.value.slice(0, 2) === 'h:' ? '' : 'none'; };
  sel.addEventListener('change', sync);
  sync();
  return {
    sel, daysWrap,
    read() {
      const v = sel.value;
      if (v.slice(0, 2) === 'g:') return { goalId: v.slice(2), habitId: null, streakDays: null };
      if (v.slice(0, 2) === 'h:') return { goalId: null, habitId: v.slice(2), streakDays: clamp(Math.round(Number(days.value) || 1), 1, 365) };
      return { goalId: null, habitId: null, streakDays: null };
    },
  };
}
function wishCard(w) {
  const goal = STATE.goals.find(g => g.id === w.goalId);
  // A wish is held back by days in a row, or by finished tasks, never by both.
  const byStreak = wishStreakOn(w);
  const need = wishStreakNeed(w), have = byStreak ? wishStreakNow(w) : 0;
  const unlocked = byStreak ? have >= need : (!goal || goalMet(goal));
  const link = safeUrl(w.url);
  const card = h('div.gcard.wcard' + (w.claimedAt ? '.claimed' : ''));

  // picture, when we can get one. A dead or placeholder image removes itself rather than
  // leaving a broken frame behind.
  const imgSrc = wishImageUrl(w);
  if (imgSrc) {
    // Not lazy: these are a few small thumbnails, and lazy ones below the fold sit
    // unloaded until scrolled to, which reads as a broken picture.
    const thumb = h('img.wthumb', { src: imgSrc, alt: '', referrerPolicy: 'no-referrer' });
    thumb.addEventListener('error', () => shell.remove());
    // Amazon answers unknown ids with a 1x1 transparent pixel, which loads "successfully".
    thumb.addEventListener('load', () => { if (thumb.naturalWidth <= 1 || thumb.naturalHeight <= 1) shell.remove(); });
    const shell = link
      ? h('a.wthumbwrap', { href: link, target: '_blank', rel: 'noopener noreferrer', title: 'Open ' + w.text }, thumb)
      : h('span.wthumbwrap', {}, thumb);
    card.append(shell);
  }

  const main = h('div.wmain');
  card.append(main);

  let stateEl = null;
  if (w.claimedAt) stateEl = h('span.wish-state', { style: { color: 'var(--ink3)' } }, 'Claimed ' + fmtD(w.claimedAt) + ' 🎉');
  else if (byStreak && unlocked) stateEl = h('span.wish-state.unlocked', {}, 'Unlocked by ' + need + ' days in a row!');
  else if (byStreak) stateEl = h('span.wish-state.locked', {}, have + ' of ' + need + ' days in a row (' + wishStreakName(w) + ')');
  else if (goal && unlocked) stateEl = h('span.wish-state.unlocked', {}, 'Unlocked by “' + goal.name + '”!');
  else if (goal) stateEl = h('span.wish-state.locked', {}, (goal.target - goalCount(goal)) + ' more task' + (goal.target - goalCount(goal) === 1 ? '' : 's') + ' to unlock (' + goal.name + ')');

  main.append(h('div.ghead', {},
    link
      ? h('a.gname.wlink', { href: link, target: '_blank', rel: 'noopener noreferrer' }, w.text)
      : h('span.gname', {}, w.text),
    !w.claimedAt && unlocked ? h('button.btn.primary.small', { onclick: e => {
      w.claimedAt = Date.now(); save();
      const r = e.target.getBoundingClientRect();
      confetti(r.left, r.top);
      renderGoals();
    } }, 'Claim it') : null,
    h('button.lnkbtn', { title: 'Edit name, link and picture', onclick: () => openWishLinkEditor(w) }, '✎'),
    h('button.xbtn', { title: 'Delete', onclick: () => undoableAction('Wish deleted', () => { STATE.wishes = STATE.wishes.filter(x => x.id !== w.id); }) }, '✕')));
  if (stateEl) main.append(h('div.gmeta', {}, stateEl));
  onRightClickDelete(card, w.text || 'this wish', () => {
    undoableAction('Wish deleted', () => { STATE.wishes = STATE.wishes.filter(x => x.id !== w.id); });
  });
  return card;
}

// Rename a wish, or attach and change its shop link and picture.
function openWishLinkEditor(w) {
  const root = $('#modalRoot');
  root.innerHTML = ''; root.classList.add('open');
  const nameIn = h('input.input.grow', { placeholder: 'Working towards…', value: w.text || '', maxLength: 80 });
  const urlIn = h('input.input.grow', { placeholder: 'https://www.amazon.com/dp/…', value: w.url || '', maxLength: 600 });
  const imgIn = h('input.input.grow', { placeholder: 'Picture link (optional, overrides the automatic one)', value: w.img || '', maxLength: 600 });
  const wc = wishCondControls(w);
  const preview = h('div.wprev');
  const note = h('div.setnote');
  // Each keystroke starts a new attempt. Stamp it, so a slow earlier image cannot come
  // back later and describe itself over the newer one.
  let paintGen = 0;
  const paint = () => {
    const gen = ++paintGen;
    preview.innerHTML = '';
    const nUrl = normalizeUrl(urlIn.value), nImg = normalizeUrl(imgIn.value);
    const src = nImg || amazonImageFor(nUrl);
    if (!src) {
      if (urlIn.value.trim() && !nUrl) note.textContent = 'That shop link is not a web address Dayu can open.';
      else if (imgIn.value.trim() && !nImg) note.textContent = 'That picture link is not a web address Dayu can open.';
      else if (!urlIn.value.trim()) note.textContent = 'Paste a shop link. Amazon product links find their own picture; for other shops, paste a picture link too.';
      else note.textContent = 'No picture found for that link. Right-click the product image in your browser, copy its address, and paste it below.';
      return;
    }
    const im = h('img', { src, alt: '', referrerPolicy: 'no-referrer' });
    im.addEventListener('load', () => {
      if (gen !== paintGen) return;
      if (im.naturalWidth <= 1 || im.naturalHeight <= 1) { preview.innerHTML = ''; note.textContent = 'Amazon has no picture on file for that item. Paste a picture link below instead.'; }
      else note.textContent = 'This is how it will look.';
    });
    im.addEventListener('error', () => {
      if (gen !== paintGen) return;
      preview.innerHTML = ''; note.textContent = 'That picture would not load. Check the address, or leave it blank.';
    });
    preview.append(im);
    note.textContent = 'Loading the picture…';
  };
  urlIn.addEventListener('input', paint);
  imgIn.addEventListener('input', paint);
  paint();

  const commit = () => {
    if (!nameIn.value.trim()) { note.textContent = 'Give it a name so you know what you are working towards.'; nameIn.focus(); return; }
    // Refuse to close on something we would only throw away: say so and let them fix it.
    if (urlIn.value.trim() && !normalizeUrl(urlIn.value)) { note.textContent = 'That shop link is not a web address Dayu can open. Fix it, or clear the box.'; urlIn.focus(); return; }
    if (imgIn.value.trim() && !normalizeUrl(imgIn.value)) { note.textContent = 'That picture link is not a web address Dayu can open. Fix it, or clear the box.'; imgIn.focus(); return; }
    w.text = nameIn.value.trim();
    w.url = normalizeUrl(urlIn.value); w.img = normalizeUrl(imgIn.value);
    Object.assign(w, wc.read());
    save(); closeModal(); renderGoals();
  };
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !imeBusy(e)) commit(); });
  urlIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !imeBusy(e)) commit(); });
  imgIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !imeBusy(e)) commit(); });

  const body = h('div.sbody', {},
    h('h1', { style: { fontSize: '19px', fontWeight: '800', marginBottom: '2px' } }, 'Edit wish'),
    h('div', { style: { color: 'var(--ink2)', marginBottom: '16px', fontSize: '13px' } }, 'Rename it, say what unlocks it, and link it to where you would buy it.'),
    h('div.setsec', {}, h('span.label', {}, 'Name'), h('div.frow', { style: { display: 'flex', marginTop: '8px' } }, nameIn)),
    h('div.setsec', {}, h('span.label', {}, 'Shop link'), h('div.frow', { style: { display: 'flex', marginTop: '8px' } }, urlIn)),
    h('div.setsec', {}, h('span.label', {}, 'Picture'), h('div.frow', { style: { display: 'flex', marginTop: '8px' } }, imgIn), preview, note),
    h('div.setsec', {}, h('span.label', {}, 'Unlocks with'),
      h('div.frow', { style: { display: 'flex', marginTop: '8px', gap: '8px', flexWrap: 'wrap', alignItems: 'center' } }, wc.sel, wc.daysWrap)));
  const sheet = h('div.sheet', {}, h('div.ctab', { style: { background: 'var(--accent)' } }), body,
    h('div.sfoot', {},
      h('button.btn.danger.small', { onclick: () => { w.url = ''; w.img = ''; save(); closeModal(); renderGoals(); } }, 'Remove link'),
      h('button.btn.primary.small', { onclick: commit }, 'Save')));
  root.append(h('div.overlay', { onclick: closeModal }), sheet);
  setTimeout(() => { nameIn.focus(); nameIn.select(); }, 0);
}

/* ---------- routines: a board of written sequences ---------- */
// A routine is a piece of writing rather than a task: a title, a body in Markdown, and a
// place on its own plane. It gets its own board, with its own pan and zoom, because the
// canvas is about things to knock down and this is about how you go about them.
const R_VIEW_KEY = 'dayu-rview-v1';
let rZoom = 1, rPanX = 0, rPanY = 0;
let rViewReady = false;

function routineById(id) { return STATE.routines.find(r => r.id === id) || null; }
function rSaveView() {
  try { storeSet(R_VIEW_KEY, JSON.stringify({ zoom: rZoom, panX: rPanX, panY: rPanY })); } catch (e) { /* private mode */ }
}
function rLoadView() {
  try {
    const v = JSON.parse(storeGet(R_VIEW_KEY) || 'null');
    if (v && isFinite(v.panX) && isFinite(v.panY)) {
      rPanX = v.panX; rPanY = v.panY;
      rZoom = clamp(isFinite(v.zoom) ? v.zoom : 1, ZOOM_MIN, ZOOM_MAX);
      return true;
    }
  } catch (e) { /* nothing saved, or unreadable */ }
  return false;
}
function rApplyView() {
  const field = $('#rfield'), board = $('#rboard');
  if (!field || !board) return;
  field.style.transform = 'translate(' + rPanX + 'px,' + rPanY + 'px) scale(' + rZoom + ')';
  board.style.backgroundSize = (24 * rZoom) + 'px ' + (24 * rZoom) + 'px';
  board.style.backgroundPosition = rPanX + 'px ' + rPanY + 'px';
  rSaveView();
}
function rToPlane(clientX, clientY) {
  const rb = $('#rboard').getBoundingClientRect();
  return { x: (clientX - rb.left - rPanX) / rZoom, y: (clientY - rb.top - rPanY) / rZoom };
}
function rSetZoom(next, clientX, clientY) {
  next = clamp(next, ZOOM_MIN, ZOOM_MAX);
  if (next === rZoom) return;
  const rb = $('#rboard').getBoundingClientRect();
  const px = clientX == null ? rb.width / 2 : clientX - rb.left;
  const py = clientY == null ? rb.height / 2 : clientY - rb.top;
  const cx = (px - rPanX) / rZoom, cy = (py - rPanY) / rZoom;
  rZoom = next;
  rPanX = px - cx * rZoom; rPanY = py - cy * rZoom;
  rApplyView();
}
function rBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const r of STATE.routines) {
    minX = Math.min(minX, r.x); minY = Math.min(minY, r.y);
    maxX = Math.max(maxX, r.x + r.w); maxY = Math.max(maxY, r.y + r.h);
  }
  return isFinite(minX) ? { minX, minY, maxX, maxY } : null;
}
// The toolbar sits over the bottom of this board too, so the fit leaves it a strip.
const R_TOOLBAR_BAND = 80;
function rFit() {
  const board = $('#rboard');
  if (!board) return;
  const rb = board.getBoundingClientRect();
  if (!rb.width || !rb.height) return;                 // the page is not on screen yet
  const vh = Math.max(140, rb.height - R_TOOLBAR_BAND);
  const b = rBounds();
  if (!b) { rZoom = 1; rPanX = 40; rPanY = 40; rApplyView(); return; }
  const pad = 60;
  const w = (b.maxX - b.minX) + pad * 2, hgt = (b.maxY - b.minY) + pad * 2;
  rZoom = clamp(Math.min(rb.width / w, vh / hgt, 1), ZOOM_MIN, ZOOM_MAX);
  rPanX = rb.width / 2 - ((b.minX + b.maxX) / 2) * rZoom;
  rPanY = vh / 2 - ((b.minY + b.maxY) / 2) * rZoom;
  rApplyView();
}
// Is any routine actually on screen with the view as it stands?
function rAnythingVisible() {
  const board = $('#rboard');
  const b = rBounds();
  if (!board || !b) return true;                       // nothing to have lost sight of
  const rb = board.getBoundingClientRect();
  if (!rb.width) return true;
  return (b.maxX * rZoom + rPanX) > 0 && (b.maxY * rZoom + rPanY) > 0
    && (b.minX * rZoom + rPanX) < rb.width && (b.minY * rZoom + rPanY) < rb.height;
}
function renderRoutines() {
  const field = $('#rfield'), board = $('#rboard');
  if (!field || !board) return;
  field.innerHTML = '';
  // Drawn in z order, so whichever was raised last is the one on top.
  for (const r of STATE.routines.slice().sort((a, b) => (a.z || 0) - (b.z || 0))) field.append(buildRoutine(r));
  $$('.hint', board).forEach(el => el.remove());
  if (!STATE.routines.length) {
    board.append(h('div.hint', {},
      h('div', { style: { fontSize: '34px', marginBottom: '10px' } }, '🧭'),
      h('div', {}, h('b', {}, 'Double-click anywhere'), ' to write your first routine.'),
      h('div', { style: { marginTop: '4px' } }, 'Markdown works, and a YouTube link on a line of its own becomes a player.')));
  }
  // A remembered view with nothing in it is worse than no remembered view: the board would
  // open on blank plane with the routines somewhere off the edge.
  if (!rViewReady) { rViewReady = true; if (!rLoadView() || !rAnythingVisible()) rFit(); }
  rApplyView();
}
function buildRoutine(r) {
  const el = h('div.rcard', { dataset: { id: r.id }, style: {
    left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', zIndex: r.z || 10,
  } });

  /* title: a click turns it into a box, Enter or clicking away puts it back */
  const titleSpan = h('span.rtitle', { title: 'Click to rename' }, r.title);
  const editTitle = () => {
    const inp = h('input.rtitleedit', { value: r.title || '', placeholder: 'Name this routine', maxLength: 80 });
    let done = false;
    const commit = () => {
      if (done) return;
      done = true;
      r.title = inp.value.trim();
      save();
      titleSpan.textContent = r.title;
      inp.replaceWith(titleSpan);
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e => {
      if (imeBusy(e)) { e.stopPropagation(); return; }
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      if (e.key === 'Escape') { inp.value = r.title || ''; inp.blur(); }
      e.stopPropagation();
    });
    inp.addEventListener('pointerdown', e => e.stopPropagation());
    titleSpan.replaceWith(inp);
    inp.focus(); inp.select();
  };
  titleSpan.addEventListener('click', e => { e.stopPropagation(); editTitle(); });
  el.__editTitle = editTitle;

  const del = h('button.rdel', { title: 'Delete this routine' }, '✕');
  del.addEventListener('pointerdown', e => e.stopPropagation());
  del.addEventListener('click', e => {
    e.stopPropagation();
    askDelete(e, r.title || 'this routine', () => {
      undoableAction('Routine deleted', () => { STATE.routines = STATE.routines.filter(x => x.id !== r.id); });
    });
  });

  const head = h('div.rhead', {}, titleSpan, del);
  el.append(head);

  /* body: rendered Markdown, swapping to its plain source while you write */
  const body = h('div.rbody');
  const paintBody = editing => {
    body.innerHTML = '';
    if (editing) {
      const ta = h('textarea.rbodyedit', {
        value: r.body || '',
        placeholder: 'Write the sequence. Markdown works, and a YouTube link on a line of its own becomes a player.',
      });
      let done = false;
      const commit = () => { if (done) return; done = true; r.body = ta.value; save(); paintBody(false); };
      ta.addEventListener('blur', commit);
      ta.addEventListener('keydown', e => {
        // Enter belongs to the writing here: this is a description, not a one-line title.
        if (imeBusy(e)) { e.stopPropagation(); return; }
        if (e.key === 'Escape') ta.blur();
        e.stopPropagation();
      });
      ta.addEventListener('pointerdown', e => e.stopPropagation());
      body.append(ta);
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
      return;
    }
    if ((r.body || '').trim()) {
      const view = h('div.mdbody', { title: 'Click to edit' });
      view.innerHTML = mdToHtml(r.body, null, { embeds: true });
      // A link, a picture or the video itself is there to be used, not to open the editor.
      view.addEventListener('click', ev => { if (!ev.target.closest('a, img, iframe, .ytwrap')) paintBody(true); });
      body.append(view);
      return;
    }
    body.append(h('button.descadd', { onclick: () => paintBody(true) }, 'Write the steps…'));
  };
  paintBody(false);
  el.append(body);

  /* dragged by its header, the way a cluster is dragged by its name tag */
  head.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.rdel, input')) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, ox = r.x, oy = r.y;
    let moved = false;
    try { head.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    const mv = ev => {
      if (ev.pointerId !== e.pointerId) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved) {
        if (Math.abs(dx) + Math.abs(dy) < 4) return;
        moved = true;
        el.classList.add('dragging');
        r.z = ++STATE.zTop; el.style.zIndex = r.z;
      }
      r.x = ox + dx / rZoom; r.y = oy + dy / rZoom;      // the plane has no edges
      el.style.left = r.x + 'px'; el.style.top = r.y + 'px';
    };
    const up = ev => {
      if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      head.removeEventListener('pointermove', mv);
      head.removeEventListener('pointerup', up);
      head.removeEventListener('pointercancel', up);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      el.classList.remove('dragging');
      try { head.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
      if (!moved) return;
      // The click that ends a drag would otherwise land on the title and open its editor.
      el.addEventListener('click', ce => { ce.stopPropagation(); ce.preventDefault(); }, { capture: true, once: true });
      save();
    };
    head.addEventListener('pointermove', mv);
    head.addEventListener('pointerup', up);
    head.addEventListener('pointercancel', up);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  onRightClickDelete(head, r.title || 'this routine', () => {
    undoableAction('Routine deleted', () => { STATE.routines = STATE.routines.filter(x => x.id !== r.id); });
  });

  /* resized from the corner, so a long routine can be given the room it needs */
  const grip = h('div.rresize', { title: 'Resize' });
  grip.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const sx = e.clientX, sy = e.clientY, w0 = r.w, h0 = r.h;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    const mv = ev => {
      if (ev.pointerId !== e.pointerId) return;
      r.w = Math.max(R_MIN_W, w0 + (ev.clientX - sx) / rZoom);
      r.h = Math.max(R_MIN_H, h0 + (ev.clientY - sy) / rZoom);

    };
    const up = ev => {
      if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      grip.removeEventListener('pointermove', mv);
      grip.removeEventListener('pointerup', up);
      grip.removeEventListener('pointercancel', up);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      try { grip.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
      save();
    };
    grip.addEventListener('pointermove', mv);
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', up);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  el.append(grip);
  return el;
}
function newRoutineAt(x, y) {
  const r = {
    id: uid(), title: '', body: '',
    x: Math.round(x), y: Math.round(y), w: 340, h: 280,
    z: ++STATE.zTop, createdAt: Date.now(),
  };
  STATE.routines.push(r);
  save();
  renderRoutines();
  // Straight into naming it, the way a new task opens its title box.
  const el = $('.rcard[data-id="' + r.id + '"]');
  if (el && el.__editTitle) el.__editTitle();
}
// The button drops one in the middle of what you are looking at, stepping off anything
// already sitting there rather than burying it.
function addRoutineHere() {
  const rb = $('#rboard').getBoundingClientRect();
  const c = rToPlane(rb.left + rb.width / 2, rb.top + rb.height / 2);
  let x = Math.round(c.x - 170), y = Math.round(c.y - 140);
  for (let i = 0; i < 40 && STATE.routines.some(r => Math.abs(r.x - x) < 26 && Math.abs(r.y - y) < 26); i++) { x += 28; y += 28; }
  newRoutineAt(x, y);
}
function wireRoutines() {
  const board = $('#rboard'), field = $('#rfield');
  if (!board) return;
  $('#btnRoutine').addEventListener('click', addRoutineHere);
  $('#btnRFit').addEventListener('click', rFit);

  board.addEventListener('wheel', e => {
    e.preventDefault();
    rSetZoom(rZoom * Math.exp(-e.deltaY * 0.0016), e.clientX, e.clientY);
  }, { passive: false });
  window.addEventListener('resize', () => { if (currentPage() === 'routines') rApplyView(); });

  board.addEventListener('dblclick', e => {
    if (e.target !== board && e.target !== field) return;
    const p = rToPlane(e.clientX, e.clientY);
    newRoutineAt(p.x - 170, p.y - 26);
  });

  // Empty board drags the view. A press inside a card belongs to the card.
  board.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.button !== 1) return;
    if (e.target.closest('.rcard')) return;
    const sx = e.clientX, sy = e.clientY;
    const p0x = rPanX, p0y = rPanY;
    let panning = false;
    try { board.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    const mv = ev => {
      if (ev.pointerId !== e.pointerId) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!panning) {
        if (Math.abs(dx) + Math.abs(dy) < 4) return;
        panning = true;
        board.classList.add('panning');
      }
      if (ev.cancelable) ev.preventDefault();
      rPanX = p0x + dx; rPanY = p0y + dy;
      rApplyView();
    };
    const up = ev => {
      if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      board.removeEventListener('pointermove', mv);
      board.removeEventListener('pointerup', up);
      board.removeEventListener('pointercancel', up);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      board.classList.remove('panning');
      try { board.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
    };
    board.addEventListener('pointermove', mv);
    board.addEventListener('pointerup', up);
    board.addEventListener('pointercancel', up);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

/* ---------- boot ---------- */
function boot() {
  STATE = loadState();
  storeSet(STORE_KEY, storeGet(STORE_KEY) || JSON.stringify(STATE)); // probe storage
  for (const g of STATE.goals) metBefore[g.id] = goalMet(g);
  wireTheme();
  wireMenu();
  wireCanvas();
  wireRoutines();
  wireTabs();
  syncPageChrome();
  renderMeters(); renderCanvas();
  // parse any OAuth redirect BEFORE the router touches the URL hash
  handleAuthRedirect().then(() => {
    window.addEventListener('hashchange', route);
    route();
    initSync();
    initFriends();
    maybeShowWelcome();
  });
  if (!storageOK) {
    const sn = $('#storageNote');
    sn.style.display = 'block';
    sn.innerHTML = '';
    sn.append(
      h('button', { onclick: () => sn.style.display = 'none', 'aria-label': 'Dismiss' }, '✕'),
      h('div', {}, h('b', {}, 'Preview mode: '), 'this environment can’t store data between visits. Use ⋯ → Export to keep a backup, or run Dayu from its own page for full persistence.'));
  }
  // A board this browser has never panned gets framed once.
  if (!storeGet(VIEW_KEY)) initialView();
}
boot();

</script>
